<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Dance Move Graph</title>

<script src="https://unpkg.com/cytoscape/dist/cytoscape.min.js"></script>

<style>
html, body {
    margin:0;
    height:100%;
    font-family:sans-serif;
}

#container{
    display:flex;
    height:100vh;
}

#cy{
    flex:1;
    background:#fafafa;
}

#sidebar{
    width:320px;
    overflow:auto;
    border-left:1px solid #ccc;
    padding:15px;
    background:white;
}

.combo{
    padding:8px;
    margin-bottom:8px;
    border-radius:6px;
    cursor:pointer;
}

.combo:hover{
    background:#eef5ff;
}

.combo-title{
    font-weight:bold;
    margin-bottom:4px;
}

.combo-moves{
    color:#444;
    font-size:14px;
}

h2{
    margin-top:0;
}
</style>
</head>

<body>

<div id="container">

<div id="cy"></div>

<div id="sidebar">
<h2>Common Combinations</h2>

<div id="comboList"></div>

<p style="margin-top:20px;color:#666;font-size:13px;">
Hover over a combination to highlight its moves.
</p>

</div>

</div>

<script>

const moves = [
["Accordion","rr","rr"],
["Loop Throughs","bh","bh"],
["Back Pass","rr","lr"],
["Manhattan","lr","lr"],
["Basket","bh","lr"],
["New Yorker","lr","lr"],
["Block & Turn","rr","rr"],
["Outside Turn","lr","lr"],
["Break Through","lr","rr"],
["Short First Move","lr","lr"],
["Catapult","rr","lr"],
["Shoulder Block","rr","lr"],
["Figure Of 8","lr","rr"],
["Squeezebox","bh","lr"],
["Hatchback","lr","lr"],
["Step Across","lr","lr"],
["Hook Turn","rr","lr"],
["Travelling Return","lr","lr"],
["Key Turn","rr","lr"],
["Wurlitzer","lr","lr"],
["Left Side Change","lr","rr"],
["Yoyo","rr","lr"],
["Shoulder Wrap","rr","lr"],
["Comb","rr","rr"],
["Slide Break","bh","rr"],
["First Move","lr","lr"],
["Wrap & Throw","rl","lr"],
["Short Manhattan","lr","lr"]
];

const combinations = [
[1,["Basket","Manhattan","Step Across"]],
[2,["Short First Move","Break Through","Hook Turn"]],
[3,["Yoyo","Back Pass","Figure Of 8"]],
[4,["Accordion","Shoulder Block","Block & Turn"]],
[5,["Manhattan","Left Side Change","Key Turn"]],
[6,["Step Across","Wurlitzer","Short First Move"]],
[7,["Basket","Loop Throughs","Hatchback"]],
[8,["Squeezebox","Figure Of 8","Catapult"]],
[10,["Shoulder Block","Accordion","Yoyo"]],
[11,["Short First Move","Loop Throughs","New Yorker"]],
[12,["Catapult","Break Through","Block & Turn"]],
[13,["Squeezebox","Left Side Change","Back Pass"]]
];

const handPositions=["rr","lr","rl","bh"];

const elements=[];

handPositions.forEach(h=>{
    elements.push({
        data:{
            id:h,
            label:h,
            type:"hand"
        }
    });
});

moves.forEach(([name,input,output])=>{

    const id=name;

    elements.push({
        data:{
            id,
            label:name,
            type:"move"
        }
    });

    elements.push({
        data:{
            id:`${input}->${id}`,
            source:input,
            target:id,
            kind:"in"
        }
    });

    elements.push({
        data:{
            id:`${id}->${output}`,
            source:id,
            target:output,
            kind:"out"
        }
    });

});

const cy=cytoscape({

container:document.getElementById("cy"),

elements,

style:[

{
selector:'node[type="move"]',
style:{
'label':'data(label)',
'background-color':'#2d7ff9',
'color':'white',
'text-valign':'center',
'text-halign':'center',
'font-size':12,
'width':40,
'height':40
}
},

{
selector:'node[type="hand"]',
style:{
'label':'data(label)',
'background-color':'orange',
'color':'black',
'font-weight':'bold',
'width':50,
'height':50
}
},

{
selector:'edge[kind="in"]',
style:{
'curve-style':'bezier',
'line-color':'#3ca55c',
'target-arrow-shape':'triangle',
'target-arrow-color':'#3ca55c',
'width':2
}
},

{
selector:'edge[kind="out"]',
style:{
'curve-style':'bezier',
'line-color':'#d9534f',
'target-arrow-shape':'triangle',
'target-arrow-color':'#d9534f',
'width':2
}
},

{
selector:'.dim',
style:{
'opacity':0.15
}
},

{
selector:'.highlight',
style:{
'background-color':'gold',
'line-color':'gold',
'target-arrow-color':'gold',
'width':6,
'z-index':999
}
}

],

layout:{
name:'cose',
animate:true,
padding:50
}

});

function clearHighlight(){

cy.elements().removeClass("highlight");
cy.elements().removeClass("dim");

}

function highlightMoves(names){

cy.elements().addClass("dim");

names.forEach(name=>{

const node=cy.getElementById(name);

if(node.length){

node.removeClass("dim");
node.addClass("highlight");

node.connectedEdges().removeClass("dim");
node.connectedEdges().addClass("highlight");

node.connectedEdges().connectedNodes().removeClass("dim");

}

});

}

const comboList=document.getElementById("comboList");

combinations.forEach(([id,moves])=>{

const div=document.createElement("div");
div.className="combo";

div.innerHTML=`
<div class="combo-title">Combination ${id}</div>
<div class="combo-moves">${moves.join(" → ")}</div>
`;

div.addEventListener("mouseenter",()=>highlightMoves(moves));
div.addEventListener("mouseleave",clearHighlight);

comboList.appendChild(div);

});

</script>

</body>
</html>
