<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dance State Transition Graph</title>

<!-- Bundled & pinned: the comet and step highlight read Cytoscape internals
     (see edgeCurves / labelBox in the script). -->
<script src="vendor/cytoscape-3.35.0.min.js"></script>

<style>
/* Design tokens, shared with the graph styles in the script */
:root{
    --font: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    --accent: #ff9900;        /* highlight orange */
    --accent-text: #b35c00;   /* orange text on light backgrounds (4.5:1) */
    --accent-soft: #fff3e0;
    --ink: #222;
    --ink-soft: #555;
    --ink-faded: #737373;     /* labels in the background during a combination */
    --line: #8c8c8c;
    --line-faded: #cdcdcd;
    --rule: #e3e3e3;
    --canvas: #fafafa;
    --node-border: #cfcfcf;
    --empty-slot: #dcdcdc;    /* outline of an empty hand position */
    --lead: #2d7ff9;          /* lead's hands */
    --follow: #7d8894;        /* follow's hands (silver; 3.6:1 with white) */
}

html, body {
    margin:0;
    height:100%;
    font-family:var(--font);
    color:var(--ink);
}

#container{
    display:flex;
    flex-direction:column;
    height:100vh;
    height:100dvh;
}

/* ---------- Top bar: menu button, caption, prev/next ---------- */

#topbar{
    display:flex;
    align-items:center;
    gap:8px;
    padding:8px 10px;
    padding-top:calc(8px + env(safe-area-inset-top));
    border-bottom:1px solid var(--rule);
    background:white;
    flex:0 0 auto;
}

#topbar button{
    min-width:44px;
    min-height:44px;
    font-size:20px;
    color:var(--ink);
    border:1px solid #ccc;
    border-radius:8px;
    background:white;
    cursor:pointer;
    -webkit-tap-highlight-color:transparent;
}

#topbar button:hover,
#topbar button:focus-visible{
    background:#f0f0f0;
}

#topbar button:active{
    background:#e6e6e6;
}

#menuBtn{
    font-size:22px;
}

/* One line that scrolls sideways if the combination is long; the step the
   comet is on is kept in view. */
#caption{
    flex:1;
    min-width:0;
    display:flex;
    align-items:center;
    justify-content:safe center;
    gap:0;
    position:relative;        /* so chip offsetLeft is measured from here */
    overflow-x:auto;
    scrollbar-width:none;
    white-space:nowrap;
    font-size:15px;
    color:var(--ink);
    scroll-behavior:smooth;
}

#caption::-webkit-scrollbar{
    display:none;
}

#caption .combo-id{
    color:var(--ink-soft);
    margin-right:4px;
}

#caption .arrow{
    color:#aaa;
}

.note{
    display:inline-block;
    font-style:italic;
    font-size:0.85em;
    color:var(--accent-text);
    border:1px dashed var(--accent);
    border-radius:10px;
    padding:0 6px;
    line-height:1.5;
    white-space:nowrap;
}

/* Caption steps are chips; the one the comet is on is filled, so the
   caption doubles as a progress indicator. */
/* an alternative ending, e.g. Basket "keep both", tagged onto the move */
.step .variant,
.combo-moves .variant{
    font-size:0.78em;
    font-style:italic;
    margin-left:5px;
    padding:0 5px;
    border-radius:8px;
    background:rgba(0,0,0,0.07);
}

.combo-moves .variant{
    color:var(--accent-text);
}

#caption .step{
    display:inline-block;
    border-radius:10px;
    padding:0 7px;
    line-height:1.5;
    background:#f1f1f1;
    white-space:nowrap;
    transition:background-color 0.15s, color 0.15s;
}

#caption .step.current,
#caption .note.current{
    background:var(--accent);
    color:white;
    border-color:var(--accent);
}

#caption .placeholder{
    color:#777;
}

#graph{
    flex:1;
    min-width:0;
    min-height:0;
    position:relative;
    overflow:hidden;
}

#cy{
    position:absolute;
    inset:0;
    background:var(--canvas);
}

/* Lights up the single line of a graph label that the comet is on
   (Cytoscape can't style one line of a label on its own). */
#stepHighlight{
    position:absolute;
    display:none;
    box-sizing:border-box;
    background:var(--accent);
    color:white;
    text-align:center;
    white-space:nowrap;
    overflow:hidden;
    border-radius:3px;
    pointer-events:none;
}

/* ---------- Slide-out menu of combinations ---------- */

#backdrop{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.3);
    opacity:0;
    pointer-events:none;
    transition:opacity 0.2s;
    z-index:10;
}

#menu{
    position:fixed;
    top:0;
    left:0;
    bottom:0;
    width:min(320px, 85vw);
    background:white;
    box-shadow:2px 0 12px rgba(0,0,0,0.2);
    transform:translateX(-105%);
    transition:transform 0.2s ease-out;
    overflow-y:auto;
    overscroll-behavior:contain;    /* scrolling past the end stays in the menu */
    padding:15px;
    padding-top:calc(15px + env(safe-area-inset-top));
    padding-bottom:calc(15px + env(safe-area-inset-bottom));
    box-sizing:border-box;
    z-index:11;
}

body.menu-open #menu{
    transform:translateX(0);
}

body.menu-open #backdrop{
    opacity:1;
    pointer-events:auto;
}

/* Foldable menu sections: the heading toggles the content. */
.menu-section > summary{
    display:flex;
    align-items:center;
    gap:8px;
    min-height:44px;
    cursor:pointer;
    list-style:none;
    user-select:none;
    -webkit-tap-highlight-color:transparent;
}

.menu-section > summary::-webkit-details-marker{
    display:none;
}

.menu-section > summary::before{
    content:"▸";
    color:var(--ink-soft);
    font-size:14px;
    transition:transform 0.15s;
}

.menu-section[open] > summary::before{
    transform:rotate(90deg);
}

.menu-section h2{
    margin:0;
    font-size:20px;
}

#menuTop{
    display:flex;
    justify-content:flex-end;
    margin:-8px -6px 0 0;
}

#closeBtn{
    min-width:44px;
    min-height:44px;
    font-size:22px;
    border:none;
    background:none;
    cursor:pointer;
}

#comboList{
    margin-top:6px;
}

.combo{
    box-sizing:border-box;
    text-decoration:none;
    display:flex;
    align-items:baseline;
    gap:10px;
    width:100%;
    text-align:left;
    font:inherit;
    color:inherit;
    background:none;
    padding:10px 8px;
    border-radius:6px;
    cursor:pointer;
    border:2px solid transparent;
    -webkit-tap-highlight-color:transparent;
    user-select:none;
}

.combo:hover{
    background:#eef5ff;
}

.combo.active{
    background:var(--accent-soft);
    border-color:var(--accent);
}

/* A menu row: the combination's link, then its favourite/done buttons */
.combo-row{
    display:flex;
    align-items:center;
    gap:2px;
    margin-bottom:6px;
}

.combo-row .combo{
    flex:1;
    min-width:0;
}

.combo-actions{
    display:flex;
    flex-direction:column;
    align-items:center;
    flex:none;
}

.star,
.tick{
    min-width:40px;
    min-height:34px;
    padding:0 4px;
    border:none;
    border-radius:8px;
    background:none;
    color:#b5b5b5;
    font:inherit;
    cursor:pointer;
    -webkit-tap-highlight-color:transparent;
}

.star:hover,
.tick:hover{
    background:#f0f0f0;
}

.star{
    font-size:20px;
    line-height:1;
}

.star.on{
    color:var(--accent);
}

.tick{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:2px;
    font-size:14px;
}

.tick.on{
    color:var(--accent-text);
    font-weight:bold;
}

/* "Practiced 4 times · Undo" message */
#toast{
    position:fixed;
    left:50%;
    bottom:calc(16px + env(safe-area-inset-bottom));
    transform:translate(-50%, 20px);
    display:flex;
    align-items:center;
    gap:12px;
    max-width:calc(100vw - 32px);
    padding:8px 8px 8px 16px;
    border-radius:10px;
    background:#2b2b2b;
    color:white;
    font-size:15px;
    box-shadow:0 4px 16px rgba(0,0,0,0.25);
    opacity:0;
    pointer-events:none;
    transition:opacity 0.2s, transform 0.2s;
    z-index:20;
}

#toast.show{
    opacity:1;
    transform:translate(-50%, 0);
    pointer-events:auto;
}

#toast button{
    min-height:36px;
    padding:0 12px;
    border:none;
    border-radius:8px;
    background:none;
    color:var(--accent);
    font:inherit;
    font-weight:bold;
    cursor:pointer;
}

/* The Beginner's Super Combo: a card of its own below the class list */
/* favourite the combination being shown (top bar) */
#topbar #favBtn{
    font-size:22px;
    color:#b5b5b5;
}

#topbar #favBtn.on{
    color:var(--accent);
}

/* share a link to the combination being shown (top bar) */
#topbar #shareBtn{
    display:flex;
    align-items:center;
    justify-content:center;
    padding:0;
}

#topbar #shareBtn[hidden]{
    display:none;
}

/* ---------- Statistics: a full-page overlay ---------- */
.stats-open{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    width:100%;
    margin:12px 0 4px;
}

#statsPage{
    --s-blue:#2a78d6;           /* series 1 (beginner, moves that link) */
    --s-orange:#eb6834;         /* series 2 (intromediate, hand changes) */
    --s-aqua:#1baf7a;           /* series 3 (alternative endings) */
    --s-track:#ececec;
    position:fixed;
    inset:0;
    z-index:30;
    overflow-y:auto;
    background:var(--canvas);
    overscroll-behavior:contain;
}

#statsPage[hidden]{
    display:none;
}

#statsHeader{
    position:sticky;
    top:0;
    z-index:1;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:8px 10px 8px 20px;
    padding-top:calc(8px + env(safe-area-inset-top));
    background:white;
    border-bottom:1px solid var(--rule);
}

#statsHeader h2{
    margin:0;
    font-size:22px;
}

#statsClose{
    min-width:44px;
    min-height:44px;
    font-size:22px;
    border:none;
    border-radius:8px;
    background:none;
    color:var(--ink);
    cursor:pointer;
}

#statsClose:hover{
    background:#f0f0f0;
}

#statsBody{
    display:grid;
    grid-template-columns:repeat(auto-fit, minmax(min(100%, 440px), 1fr));
    gap:16px;
    max-width:1240px;
    margin:0 auto;
    padding:16px;
    padding-bottom:calc(24px + env(safe-area-inset-bottom));
    box-sizing:border-box;
}

.stats-card{
    min-width:0;
    padding:18px 20px 20px;
    border:1px solid var(--rule);
    border-radius:12px;
    background:white;
}

.stats-stack{
    display:grid;
    gap:16px;
    align-content:start;
    min-width:0;
}

.stats-card.wide{
    grid-column:1 / -1;
}

.stats-card h3{
    margin:0 0 4px;
    font-size:17px;
}

.stats-card .sub{
    margin:4px 0 14px;
    font-size:14px;
    color:var(--ink-soft);
}

.stats-card .stat-note{
    margin:12px 0 0;
    font-size:14px;
    line-height:1.45;
    color:var(--ink-soft);
}

.stats-card .stat-note b{
    color:var(--ink);
    font-weight:600;
}

/* headline numbers */
.stat-tiles{
    display:grid;
    grid-template-columns:repeat(auto-fit, minmax(min(100%, 200px), 1fr));
    gap:12px 24px;
}

.stat-tile .label{
    font-size:14px;
    color:var(--ink-soft);
}

.stat-tile .value{
    margin:2px 0;
    font-size:34px;
    font-weight:600;
    line-height:1.1;
}

.stat-tile .value small{
    font-size:18px;
    font-weight:500;
    color:var(--ink-soft);
}

.stat-tile .detail{
    font-size:13px;
    color:var(--ink-faded);
}

.meter{
    display:flex;
    gap:2px;
    height:8px;
    margin:6px 0;
}

.meter span{
    border-radius:4px;
    background:var(--s-blue);
}

.meter span.rest{
    background:#cde2fb;
}

/* legend */
.legend{
    display:flex;
    flex-wrap:wrap;
    gap:4px 16px;
    margin:0 0 12px;
    font-size:13px;
    color:var(--ink-soft);
}

.legend span{
    display:inline-flex;
    align-items:center;
    gap:6px;
}

.legend i{
    width:12px;
    height:12px;
    border-radius:3px;
}

/* horizontal bars: name | bar | value */
.hbars{
    display:grid;
    grid-template-columns:max-content 1fr;
    gap:4px 10px;
    align-items:center;
    font-size:14px;
}

.hbars .name{
    text-align:right;
    color:var(--ink);
    white-space:nowrap;
}

.hbars .name.zero{
    color:var(--ink-faded);
}

.hbar-row{
    display:flex;
    align-items:center;
    gap:6px;
    min-height:22px;
    border-radius:4px;
}

.hbar{
    height:16px;
    border-radius:0 4px 4px 0;
}

.hbar-row .val{
    font-size:13px;
    color:var(--ink-soft);
    font-variant-numeric:tabular-nums;
}

[data-tip]{
    cursor:default;
    outline-offset:2px;
}

[data-tip]:hover .hbar,
[data-tip]:focus-visible .hbar,
.col[data-tip]:hover .colbar,
.col[data-tip]:focus-visible .colbar{
    filter:brightness(1.15);
}

/* hand position matrix */
.matrix{
    display:grid;
    grid-template-columns:auto repeat(4, minmax(44px, 72px));
    gap:3px;
    justify-content:start;
    align-items:center;
    font-size:12px;
    color:var(--ink-soft);
}

.matrix .head{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:2px;
    text-align:center;
}

.matrix .head.row{
    flex-direction:row;
    justify-content:flex-end;
    gap:6px;
    padding-right:4px;
}

.matrix .head img{
    width:36px;
    height:36px;
}

.matrix .axis{
    font-size:12px;
    line-height:1.25;
    color:var(--ink-faded);
}

.cell{
    display:flex;
    align-items:center;
    justify-content:center;
    aspect-ratio:1;
    border-radius:6px;
    font-size:17px;
    font-weight:600;
    background:#f3f3f3;
    color:var(--ink-faded);
}

.cell:hover,
.cell:focus-visible{
    outline:2px solid var(--ink);
}

/* segmented bar (one whole in parts) */
.segbar{
    display:flex;
    gap:2px;
    height:28px;
}

.segbar span{
    display:flex;
    align-items:center;
    padding:0 8px;
    border-radius:4px;
    font-size:13px;
    font-weight:600;
    color:white;
    white-space:nowrap;
    overflow:visible;
}

.chips{
    display:flex;
    flex-wrap:wrap;
    gap:6px;
    margin-top:8px;
}

.chip{
    padding:3px 10px;
    border:1px dashed var(--accent);
    border-radius:999px;
    font-size:13px;
    color:var(--accent-text);
    background:var(--accent-soft);
}

/* combination shapes: the hand positions each combination passes through */
.shapes{
    display:grid;
    grid-template-columns:max-content 1fr;
    gap:6px 10px;
    align-items:center;
    margin-top:14px;
}

.shapes .num{
    font-weight:bold;
    text-align:right;
    font-size:14px;
}

.shape{
    display:flex;
    flex-wrap:wrap;
    align-items:center;
    row-gap:4px;
}

.shape img{
    width:30px;
    height:30px;
}

/* each step is a 2px line, in a taller box so it's easy to hover */
.shape .hop{
    position:relative;
    width:20px;
    height:30px;
    margin:0 1px;
}

.shape .hop::before{
    content:"";
    position:absolute;
    left:0;
    right:0;
    top:14px;
    height:2px;
    background:var(--line);
}

.shape .hop.change::before{
    height:0;
    border-top:2px dashed var(--s-orange);
    background:none;
}

.shape .hop.ending::before{
    background:var(--s-aqua);
}

/* hero figure */
.hero{
    font-size:56px;
    font-weight:600;
    line-height:1;
    margin:6px 0 4px;
}

.stats-table{
    width:100%;
    margin-top:14px;
    border-collapse:collapse;
    font-size:14px;
}

.stats-table th,
.stats-table td{
    padding:7px 8px;
    border-bottom:1px solid var(--rule);
    text-align:right;
    font-variant-numeric:tabular-nums;
}

.stats-table th:first-child,
.stats-table td:first-child{
    text-align:left;
}

.stats-table th{
    font-weight:600;
    color:var(--ink-soft);
    font-size:13px;
}

/* columns: practice per combination */
.cols{
    display:flex;
    align-items:flex-end;
    gap:4px;
    height:160px;
    padding-top:20px;
    border-bottom:1px solid var(--rule);
}

.col{
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:flex-end;
    height:100%;
    min-width:0;
}

.col .v{
    font-size:12px;
    color:var(--ink-soft);
    margin-bottom:3px;
}

.colbar{
    width:min(24px, 100%);
    border-radius:4px 4px 0 0;
    background:var(--s-blue);
}

.col-labels{
    display:flex;
    gap:4px;
    margin-top:4px;
    font-size:12px;
    color:var(--ink-soft);
}

.col-labels span{
    flex:1;
    min-width:0;
    text-align:center;
}

.empty-note{
    padding:16px;
    border-radius:8px;
    background:var(--canvas);
    color:var(--ink-soft);
    font-size:14px;
}

#statsTip{
    position:fixed;
    z-index:2;
    max-width:260px;
    padding:8px 10px;
    border-radius:8px;
    background:#2b2b2b;
    color:#ddd;
    font-size:13px;
    line-height:1.35;
    box-shadow:0 4px 16px rgba(0,0,0,0.25);
    pointer-events:none;
}

#statsTip strong{
    display:block;
    color:white;
    font-size:15px;
}

/* number column used for a label in the Favourites list */
.combo-num.tag{
    font-size:11px;
    font-weight:bold;
    text-transform:uppercase;
    letter-spacing:0.04em;
    color:var(--ink-soft);
    min-width:3.6em;
    text-align:left;
}

.loop-mark{
    color:var(--accent-text);
    font-weight:bold;
}

.combo-body{
    display:flex;
    flex-direction:column;
    min-width:0;
}

.combo-name{
    font-weight:bold;
    margin-bottom:1px;
}

.rename{
    min-width:40px;
    min-height:34px;
    border:none;
    border-radius:8px;
    background:none;
    color:#9a9a9a;
    font-size:16px;
    cursor:pointer;
}

.rename:hover{
    background:#f0f0f0;
}

.rename-input{
    flex:1;
    min-width:0;
    min-height:44px;
    padding:0 10px;
    border:2px solid var(--accent);
    border-radius:8px;
    font:inherit;
}

.fav-empty{
    margin:4px 8px 8px;
    font-size:14px;
    color:var(--ink-soft);
}

/* Random Combo controls */
.random-controls{
    display:flex;
    flex-direction:column;
    gap:6px;
    padding:4px 8px 8px;
}

.field{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
}

.seg{
    display:flex;
    border:1px solid #ccc;
    border-radius:8px;
    overflow:hidden;
}

.seg button{
    min-width:44px;
    min-height:40px;
    border:none;
    border-left:1px solid #ccc;
    background:white;
    color:var(--ink);
    font:inherit;
    cursor:pointer;
}

.seg button:first-child{
    border-left:none;
}

.seg button[aria-checked="true"]{
    background:var(--accent);
    font-weight:bold;
}

.check{
    display:flex;
    align-items:center;
    gap:10px;
    min-height:44px;
    cursor:pointer;
}

.check input{
    width:20px;
    height:20px;
    margin:0;
    accent-color:var(--accent);
}

.check-note{
    color:var(--ink-soft);
    font-size:13px;
}

.primary{
    min-height:44px;
    border:none;
    border-radius:8px;
    background:var(--accent);
    color:var(--ink);           /* dark text on orange: 9:1 */
    font:inherit;
    font-weight:bold;
    cursor:pointer;
}

.primary:hover{
    filter:brightness(0.95);
}

.secondary{
    min-height:44px;
    border:1px solid #ccc;
    border-radius:8px;
    background:white;
    color:var(--ink);
    font:inherit;
    cursor:pointer;
}

.secondary:hover{
    background:#f5f5f5;
}

.primary:disabled,
.secondary:disabled{
    opacity:0.45;
    cursor:default;
    filter:none;
}

.combo-row.super-row{

}

.combo.super{

.toggle{

}

.toggle input:checked + .switch{

}

.toggle input:checked + .switch::after{

}

.toggle input:focus-visible + .switch{

}

/* Wide screens: the combinations are always on screen in a sidebar, so
   there's no menu button, close button or dimmed backdrop. */
@media (min-width:1000px) and (min-height:501px){

        display:flex;
        height:100vh;
        height:100dvh;
    }

    #menu{

                                   otherwise make the whole page scroll */
        order:-1;
        flex:0 0 320px;
        transform:none;
        transition:none;
        box-shadow:none;
        border-right:1px solid var(--rule);
        height:100%;

        flex:1;

    }

    #closeBtn,

        display:none;
    }
}

@media (prefers-reduced-motion:reduce){
    #menu, #backdrop{ transition:none; }
}
</style>
</head>
