    });
}

// ---------------------------------------------------------------------
// Shuffle Order: the current combination's moves in a different order,
// preferring orders that link without hand changes. And: swap a hand
// change for a real move along the same path (e.g. "swap to R", lr -> rr,
// becomes Break Through).
// ---------------------------------------------------------------------

function orderCost(moves, loops){
    let cost = 0;
    for(let i = 0; i+1 < moves.length; i++) cost += bridgeCost(moves[i], moves[i+1]);
    if(loops && moves.length > 1) cost += bridgeCost(moves[moves.length-1], moves[0]);
    return cost;
}

function* permutations(items){
    if(items.length <= 1){ yield items; return; }
    for(let i = 0; i < items.length; i++){
        const rest = [...items.slice(0,i), ...items.slice(i+1)];
        for(const p of permutations(rest)) yield [items[i], ...p];
    }
}

// How much less likely each hand change makes an order: 1 hand change is
// 1/4 as likely as none, 2 are 1/16, and so on.
const HAND_CHANGE_WEIGHT = 0.25;
const orderWeight = cost => HAND_CHANGE_WEIGHT ** cost;

function weightedPick(items, weightOf){
    const weights = items.map(weightOf);
    let r = Math.random() * weights.reduce((a,b)=>a+b, 0);
    for(let i = 0; i < items.length; i++){
        r -= weights[i];
        if(r <= 0) return items[i];
    }
    return items[items.length-1];
}

// "Avoid hand-changes": a different order with the fewest hand changes
// possible (random among the best). Exhaustive for short combinations;
// for long ones, many randomised "link where you can" attempts.
function shuffleOrderFewest(moves, loops){
    const current = moves.join(">");
    let best = Infinity, choices = [];
    const consider = order=>{
        if(order.join(">") === current) return;
        const cost = orderCost(order, loops);
        if(cost < best){ best = cost; choices = [order]; }
        else if(cost === best && choices.length < 500) choices.push(order);
    };
    if(moves.length <= 7){
        for(const p of permutations(moves)) consider(p);
    }else{
        for(let attempt = 0; attempt < 3000; attempt++){
            const left = shuffled(moves);
            const order = [left.pop()];
            while(left.length){
                const last = order[order.length-1];
                const costs = left.map(m=>bridgeCost(last, m));
                const min = Math.min(...costs);
                const pick = shuffled(left.filter((_,i)=>costs[i] === min))[0];
                left.splice(left.indexOf(pick), 1);
                order.push(pick);
            }
            consider(order);
        }
    }
    return choices.length ? { moves:shuffled(choices)[0], cost:best } : null;
}

// A different order of the same moves, chosen at random but weighted
// towards fewer hand changes: any order can come up, but each hand change
// makes it less likely. Short combinations weigh every possible order;
// long ones weigh a few hundred candidate orders.
function shuffleOrder(moves, loops){
    const current = moves.join(">");
    if(moves.length <= 7){
        const orders = [...permutations(moves)].filter(p=>p.join(">") !== current);
        if(!orders.length) return null;
        const pick = weightedPick(orders, p=>orderWeight(orderCost(p, loops)));
        return { moves:pick, cost:orderCost(pick, loops) };
    }
    // too many orders to weigh them all: build a few hundred candidates move
    // by move (favouring moves that link), then weigh those as above
    const candidates = [];
    for(let attempt = 0; attempt < 300; attempt++){
        const left = shuffled(moves);
        const order = [left.pop()];
        while(left.length){
            const last = order[order.length-1];
            const pick = weightedPick(left, m=>orderWeight(bridgeCost(last, m)));
            left.splice(left.indexOf(pick), 1);
            order.push(pick);
        }
        if(order.join(">") !== current) candidates.push(order);
    }
    if(!candidates.length) return null;
    const pick = weightedPick(candidates, p=>orderWeight(orderCost(p, loops)));
    return { moves:pick, cost:orderCost(pick, loops) };
}

const shownMoves = () => MOVES
    .filter(m=>dom.showIntro.checked || m.level !== "intromediate")
    .map(m=>m.name);

// Replace the first hand change that a real move can stand in for.
function replaceHandChange(combo){
    const used = new Set(combo.moves);
    for(const item of planMoves(combo.moves, combo)){
        if(item.kind !== "transition") continue;
        const options = shownMoves().filter(m=>{
            const st = MOVE_STATES.get(m);
            return !used.has(m) && st.from === item.from && st.to === item.to;
        });
        if(!options.length) continue;
        const pick = shuffled(options)[0];
        const moves = [...combo.moves];
        moves.splice(item.index + 1, 0, pick);
        return { moves, replaced:item.note, with:pick };
    }
    return null;
}

}

function setting(label, hint, control){
    return el("div", {className:"setting"},
        el("span", {}, label, ...(hint ? [el("span", {className:"hint-text", textContent:hint})] : [])),
        control);
}

function numberInput(value, min, max, onChange){
    const input = el("input", {type:"number", value, min, max, step:1, inputMode:"numeric"});
    input.addEventListener("change", ()=>{
        const v = Math.round(Number(input.value));
        const ok = Number.isFinite(v) ? Math.min(max, Math.max(min, v)) : value;
        input.value = ok;
        onChange(ok);
    });
    return input;
}

// =====================================================================
// Build a Combo: tap moves to make your own sequence. Moves that flow on
// from the last one (no hand change) are listed first. The sequence is
// shown on the graph as you build it, and kept on this device.
// =====================================================================

const BUILD_KEY = "mj-moves:builder";
let built = loadJSON(BUILD_KEY, []);
if(!Array.isArray(built)) built = [];
built = built.filter(m=>MOVE_STATES.has(m));

const builtCombo = ()=>({ id:null, caption:"Built", moves:[...built] });

function setBuilt(moves){
    built = moves;
    saveJSON(BUILD_KEY, built);
    renderBuilder();
    if(built.length){
        state.preview = null;
        selectCombo(builtCombo());
    }
}

function renderBuilder(){
    const last = built.at(-1);
    dom.buildSeq.replaceChildren(...(built.length
        ? [el("span", {className:"combo-moves"}, ...sequenceNodes(builtCombo()))]
        : [el("span", {className:"hint", textContent:"Tap moves below to build a combination."})]));
    dom.buildUndo.disabled = dom.buildClear.disabled = !built.length;
    const current = state.selection?.kind === "combo" ? state.selection.combo : null;
    dom.buildFromCurrent.disabled = !current || sameMoves(current.moves, built);

    const pool = movePool();
    const flows = last ? pool.filter(m=>canFollow(last, m)) : pool;
    const others = last ? pool.filter(m=>!canFollow(last, m)) : [];
    const button = (name, note)=>{
        const b = el("button", {type:"button", className:`build-move${note ? "" : last ? " flows" : ""}`},
            el("span", {textContent:name}), ...(note ? [el("small", {textContent:note})] : []));
        b.addEventListener("click", ()=>setBuilt([...built, name]));
        return b;
    };
    const groups = [];
    groups.push(el("p", {className:"build-group",
        textContent:last ? `Flows on from ${last}` : "Start with any move"}),
        el("div", {className:"build-list"}, ...flows.map(m=>button(m))));
    if(others.length){
        groups.push(el("p", {className:"build-group", textContent:"With a hand change first"}),
            el("div", {className:"build-list"}, ...others.map(m=>button(m, bridge(last, m).note))));
    }
    dom.buildMoves.replaceChildren(...groups);
}

dom.buildUndo.addEventListener("click", ()=>setBuilt(built.slice(0, -1)));
dom.buildClear.addEventListener("click", ()=>setBuilt([]));
dom.buildFromCurrent.addEventListener("click", ()=>{
    const current = state.selection?.kind === "combo" ? state.selection.combo : null;
    if(current) setBuilt([...current.moves]);
});
dom.showIntro.addEventListener("change", renderBuilder);

// =====================================================================
// Move Caller
//
// For practising while dancing to a song. After a get-ready countdown it
// calls out a random combination (2-5 moves), then gives you as long as it
// takes to dance it - 16 counts a move at the song's speed, 130 bpm by
// default - before calling the next. Each combination starts in the hand
// hold the last one finished in, so you can keep dancing without a break.
// =====================================================================

const CALLER_KEY = "mj-moves:caller";
const caller = {
    settings:{ min:2, max:5, bpm:130, counts:16, ready:15, voice:true, ...loadJSON(CALLER_KEY) },
    running:false, paused:false,
    phase:null,             // "ready" | "announce" | "dance"
    phaseStart:0, phaseLength:0, pausedAt:0,
    combo:null, plan:null, endPos:null, called:0,
    token:0, timer:null, wakeLock:null, view:null
};
const moveMs = ()=>caller.settings.counts * 60000 / caller.settings.bpm;
const saveCaller = ()=>saveJSON(CALLER_KEY, caller.settings);

// A random combination that flows without hand changes, starting (if it
// can) in the hand hold `from`.
function callerMoves(length, from){
    const pool = movePool();
    const extend = seq=>{
        if(seq.length === length) return seq;
        for(const m of shuffled(pool)){
            if(seq.includes(m) || !canFollow(seq.at(-1), m)) continue;
            const done = extend([...seq, m]);
            if(done) return done;
        }
        return null;
    };
    const firsts = shuffled(pool);
    const preferred = from ? firsts.filter(m=>MOVE_STATES.get(m).from === from) : [];
    for(const first of [...preferred, ...firsts]){
        const done = extend([first]);
        if(done) return done;
    }
    return null;
}

// "drop R" reads better as "drop right"
const spoken = text => text.replace(/\bR\b/g, "right").replace(/\bL\b/g, "left").replace(/&/g, "and");

function speak(text){
    return new Promise(resolve=>{
        if(!caller.settings.voice || !("speechSynthesis" in window)){
            setTimeout(resolve, 2500);      // time to read it instead
            return;
        }
        speechSynthesis.cancel();
        const u = new SpeechSynthesisUtterance(spoken(text));
        u.rate = 0.95;
        const done = ()=>{ clearTimeout(fallback); resolve(); };
        const fallback = setTimeout(resolve, 20000);     // if "end" never comes
        u.onend = u.onerror = done;
        speechSynthesis.speak(u);
    });
}

async function keepAwake(on){
    try{
        if(on && "wakeLock" in navigator && !caller.wakeLock){
            caller.wakeLock = await navigator.wakeLock.request("screen");
            caller.wakeLock.addEventListener("release", ()=>{ caller.wakeLock = null; });
        }else if(!on && caller.wakeLock){
            await caller.wakeLock.release();
            caller.wakeLock = null;
        }
    }catch{ /* not allowed: the screen may sleep */ }
}

function setPhase(phase, ms){
    caller.phase = phase;
    caller.phaseStart = performance.now();
    caller.phaseLength = ms;
    if(caller.paused) caller.pausedAt = caller.phaseStart;
}
const phaseElapsed = ()=>(caller.paused ? caller.pausedAt : performance.now()) - caller.phaseStart;

function callerStart(){
    Object.assign(caller, { running:true, paused:false, called:0, combo:null, plan:null });
    const current = state.selection?.kind === "combo" ? state.selection.combo : null;
    caller.endPos = current ? planMoves(current.moves, current).filter(x=>x.kind === "move").at(-1)?.to : null;
    caller.token++;
    // speak straight away: phones only allow speech that starts from a tap,
    // and after that the later calls can speak too
    if(caller.settings.voice && "speechSynthesis" in window){
        speechSynthesis.cancel();
        speechSynthesis.speak(new SpeechSynthesisUtterance("Get ready"));
    }
    setPhase("ready", caller.settings.ready * 1000);
    if(!caller.settings.ready) callNext();
    keepAwake(true);
    clearInterval(caller.timer);
    caller.timer = setInterval(callerTick, 100);
    renderCaller();
}

function callerStop(){
    caller.running = false;
    caller.token++;
    clearInterval(caller.timer);
    if("speechSynthesis" in window) speechSynthesis.cancel();
    keepAwake(false);
}

function callerTogglePause(){
    if(!caller.running) return;
    if(caller.paused){
        caller.phaseStart += performance.now() - caller.pausedAt;
        caller.paused = false;
    }else{
        caller.paused = true;
        caller.pausedAt = performance.now();
    }
    renderCaller();
}

async function callNext(){
    const token = ++caller.token;
    const {min, max} = caller.settings;
    const length = min + Math.floor(Math.random() * (max - min + 1));
    let moves = null;
    for(let n = length; n >= MIN_RANDOM && !moves; n--) moves = callerMoves(n, caller.endPos);
    if(!moves){
        callerStop();
        showToast("No combination fits - try turning on intromediate moves");
        renderCaller();
        return;
    }
    caller.combo = { id:null, caption:"Caller", moves };
    caller.plan = planMoves(moves);
    caller.endPos = caller.plan.filter(x=>x.kind === "move").at(-1).to;
    caller.called++;
    state.preview = null;
    selectCombo(caller.combo, {updateUrl:false});      // there on the graph afterwards
    setPhase("announce", 0);
    renderCaller();
    const words = caller.plan.map(x=>x.kind === "move" ? x.name + (x.variant ? `, ${x.variant}` : "") : x.note);
    await speak(`${caller.called === 1 ? "First" : "Next"}: ${words.join(". ")}.`);
    if(token !== caller.token || !caller.running) return;
    setPhase("dance", moves.length * moveMs());
    renderCaller();
}

function callerTick(){
    if(!caller.running) return;
    if(!caller.paused && caller.phase !== "announce" && phaseElapsed() >= caller.phaseLength){
        callNext();
        return;
    }
    updateCallerRun();
}

function renderCaller(){
    if(dom.callerPage.hidden) return;
    caller.view = null;
    dom.callerBody.replaceChildren(caller.running ? callerRunView() : callerSetupView());
    if(caller.running) updateCallerRun();
}

function callerSetupView(){
    const s = caller.settings;
    const pick = (key, other, cmp)=>v=>{
        s[key] = v;
        if(cmp(s[key], s[other])) s[other] = v;     // keep shortest <= longest
        saveCaller();
        renderCaller();
    };
    const secs = moveMs() / 1000;
    return el("div", {},
        el("p", {className:"intent"},
            el("b", {textContent:"Practise while dancing to a song. "}),
            "Put a track on and press Start. After a short countdown the caller reads out a random combination, " +
            "then waits as long as it takes to dance it before calling the next. Each one starts in the hand hold " +
            "the last finished in, so you can keep going for the whole song."),
        setting("Shortest combination", null, segmented([2,3,4,5], s.min, pick("min", "max", (a,b)=>a > b))),
        setting("Longest combination", null, segmented([2,3,4,5], s.max, pick("max", "min", (a,b)=>a < b))),
        setting("Song speed (bpm)", "Lower gives you more time", numberInput(s.bpm, 60, 200, v=>{ s.bpm = v; saveCaller(); renderCaller(); })),
        setting("Counts per move", null, numberInput(s.counts, 4, 64, v=>{ s.counts = v; saveCaller(); renderCaller(); })),
        setting("Get-ready countdown (seconds)", null, numberInput(s.ready, 0, 120, v=>{ s.ready = v; saveCaller(); })),
        setting("Read combinations out loud", "speechSynthesis" in window ? null : "Not supported in this browser",
            (()=>{ const c = el("input", {type:"checkbox", checked:s.voice});
                   c.addEventListener("change", ()=>{ s.voice = c.checked; saveCaller(); });
                   return c; })()),
        el("p", {className:"summary-line",
            textContent:`A move gets ${s.counts} counts ≈ ${secs.toFixed(1)} s, so a 3-move combination lasts about ${Math.round(secs*3)} s. ` +
                        (dom.showIntro.checked ? "Intromediate moves are included" : "Beginner moves only") + " (change it in the menu)."}),
        (()=>{ const b = el("button", {type:"button", className:"primary big-action", textContent:"Start"});
               b.addEventListener("click", callerStart);
               return b; })());
}

function callerRunView(){
    const R = 52, C = 2*Math.PI*R;
    const ring = svgNode("circle", {cx:60, cy:60, r:R, fill:"none", stroke:"var(--accent)", "stroke-width":8,
        "stroke-linecap":"round", "stroke-dasharray":C});
    const clock = el("div", {className:"caller-clock"});
    clock.append(svgNode("svg", {viewBox:"0 0 120 120"},
        svgNode("circle", {cx:60, cy:60, r:R, fill:"none", stroke:"#ececec", "stroke-width":8}), ring));
    const num = el("div", {className:"num"});
    clock.append(num);
    const phase = el("div", {className:"caller-phase"});
    const moves = el("div", {className:"caller-moves", ariaLive:"polite"});
    const chips = [];
    if(caller.plan){
        caller.plan.forEach((x, i)=>{
            if(i) moves.append(el("span", {className:"arrow", textContent:"→"}));
            if(x.kind === "move"){
                const chip = el("span", {className:"cm", textContent:x.name + (x.variant ? ` · ${x.variant}` : "")});
                chips[x.index] = chip;
                moves.append(chip);
            }else{
                moves.append(el("span", {className:"cn", textContent:x.note}));
            }
        });
    }
    const count = el("div", {className:"caller-count"});
    const btn = (text, cls, fn)=>{ const b = el("button", {type:"button", className:cls, textContent:text}); b.addEventListener("click", fn); return b; };
    const buttons = el("div", {className:"caller-buttons"},
        btn(caller.paused ? "Resume" : "Pause", "primary", callerTogglePause),
        btn("Skip", "secondary", ()=>{ if(caller.paused) callerTogglePause(); callNext(); }),
        btn("Stop", "secondary", ()=>{ callerStop(); renderCaller(); }));
    caller.view = { ring, C, num, phase, chips, count };
    return el("div", {className:"caller-run"}, phase, clock, moves, count, buttons);
}

function updateCallerRun(){
    const v = caller.view;
    if(!v) return;
    const elapsed = phaseElapsed();
    const left = Math.max(0, caller.phaseLength - elapsed);
    const frac = caller.phaseLength ? left / caller.phaseLength : 1;
    v.ring.setAttribute("stroke-dashoffset", v.C * (1 - frac));
    let label = "", big = "", small = "", countText = "";
    if(caller.phase === "ready"){
        label = "Get ready"; big = Math.ceil(left/1000); small = "seconds";
        countText = "The first combination is called when this reaches zero";
    }else if(caller.phase === "announce"){
        label = "Listen"; big = "…"; small = `combination ${caller.called}`;
    }else{
        label = "Dance"; big = Math.ceil(left/1000); small = "seconds left";
        const m = Math.min(caller.combo.moves.length - 1, Math.floor(elapsed / moveMs()));
        const beat = Math.floor((elapsed % moveMs()) / (60000 / caller.settings.bpm)) + 1;
        v.chips.forEach((c, i)=>{ c.classList.toggle("now", i === m); c.classList.toggle("done", i < m); });
        countText = `Move ${m+1} of ${caller.combo.moves.length} · count ${Math.min(beat, caller.settings.counts)}`;
    }
    if(caller.paused) label = "Paused";
    if(v.phase.textContent !== label) v.phase.textContent = label;
    v.num.replaceChildren(`${big}`, el("small", {textContent:small}));
    if(v.count.textContent !== countText) v.count.textContent = countText;
}

const svgNode = (tag, attrs={}, ...children)=>{
    const node = document.createElementNS("http://www.w3.org/2000/svg", tag);
    for(const [k, v] of Object.entries(attrs)) node.setAttribute(k, v);
    node.append(...children);
    return node;
};

function closeCaller(){
    if(dom.callerPage.hidden) return;
    callerStop();
    dom.callerPage.hidden = true;
    dom.callerBtn.focus({preventScroll:true});
}

dom.callerBtn.addEventListener("click", ()=>{ openPage(dom.callerPage, dom.callerClose); renderCaller(); });
dom.callerClose.addEventListener("click", closeCaller);
document.addEventListener("visibilitychange", ()=>{
    if(caller.running && document.visibilityState === "visible") keepAwake(true);
});

// =====================================================================
// Flashcards
//
// For remembering each move in full: which hand hold, which way a turn
// goes, how the lead works, how the follow works, the footwork and any
// important details. Build each move up in order - feet and position
// first, then the arms, then the lead and follow turns and changes of
// place - then show the answer and say how well you knew it. A basic
// Leitner system (like Anki): cards you know well come back less often.
// =====================================================================

const FLASH_KEY = "mj-moves:flashcards", NOTES_KEY = "mj-moves:move-notes", DECK_KEY = "mj-moves:flash-deck";
const BOX_DAYS = [0, 1, 2, 4, 8, 16];       // days until a card in box 1-5 comes back
const LAST_BOX = BOX_DAYS.length - 1;
const flash = {
    cards:loadJSON(FLASH_KEY),              // move name -> {box, due:"YYYY-MM-DD"}
    notes:loadJSON(NOTES_KEY),              // move name -> your notes
    deck:localStorage.getItem(DECK_KEY) === "all" ? "all" : "beginner",
    queue:[], at:0, revealed:false, tally:null, view:"home"
};
const NOTES_TEMPLATE = "Feet & position: \nArms & hand hold: \nLead: \nFollow: \nTurns & changing places: \nDetails: ";

const dayString = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
const today = ()=>dayString(new Date());
const inDays = n=>{ const d = new Date(); d.setDate(d.getDate() + n); return dayString(d); };
const cardOf = name => flash.cards[name] ?? { box:0, due:null };
const deckMoves = ()=>MOVES.filter(m=>flash.deck === "all" || m.level === "beginner");
const isDue = name=>{ const c = cardOf(name); return !c.box || c.due <= today(); };
const daysText = n => n === 0 ? "again now" : n === 1 ? "tomorrow" : `in ${n} days`;

// What each answer does to a card: [new box, days until it's back]
function graded(name, grade){
    const box = cardOf(name).box;
    const next = grade === "again" ? 1 : Math.min(LAST_BOX, box + (grade === "perfect" ? 2 : 1));
    return [next, grade === "again" ? 0 : BOX_DAYS[next]];
}

function flashStart(all=false){
    const names = deckMoves().map(m=>m.name).filter(n=>all || isDue(n));
    // reviews first (shakiest first), then new cards, shuffled within each
    const reviews = shuffled(names.filter(n=>cardOf(n).box)).sort((a,b)=>cardOf(a).box - cardOf(b).box);
    const fresh = shuffled(names.filter(n=>!cardOf(n).box));
    Object.assign(flash, { queue:[...reviews, ...fresh], at:0, revealed:false,
                           tally:{again:0, ok:0, perfect:0}, view:"card" });
    renderFlash();
}

function flashGrade(grade){
    const name = flash.queue[flash.at];
    const [box, days] = graded(name, grade);
    flash.cards[name] = { box, due:inDays(days) };
    saveJSON(FLASH_KEY, flash.cards);
    flash.tally[grade]++;
    if(grade === "again") flash.queue.push(name);       // see it again before the end
    flash.at++;
    flash.revealed = false;
    if(flash.at >= flash.queue.length) flash.view = "done";
    renderFlash();
}

function renderFlash(){
    if(dom.flashPage.hidden) return;
    const view = flash.view === "card" ? flashCardView() : flash.view === "done" ? flashDoneView() : flashHomeView();
    dom.flashBody.replaceChildren(view);
    dom.flashPage.scrollTop = 0;
}

function flashHomeView(){
    const moves = deckMoves().map(m=>m.name);
    const due = moves.filter(isDue);
    const fresh = moves.filter(n=>!cardOf(n).box);
    const inBox = b => moves.filter(n=>cardOf(n).box === b).length;
    const most = Math.max(1, ...[0,1,2,3,4,5].map(inBox));
    const upcoming = moves.filter(n=>!isDue(n)).map(n=>cardOf(n).due).sort()[0];
    const btn = (text, cls, fn, disabled=false)=>{
        const b = el("button", {type:"button", className:cls, textContent:text, disabled});
        b.addEventListener("click", fn);
        return b;
    };
    const reset = el("button", {type:"button", className:"secondary", textContent:"Reset progress",
        style:"margin-top:28px;min-height:40px;font-size:14px"});
    reset.addEventListener("click", ()=>{
        if(!confirm("Forget how well you know every card? (Your notes are kept.)")) return;
        flash.cards = {};
        saveJSON(FLASH_KEY, flash.cards);
        renderFlash();
    });
    const beginners = MOVES.filter(m=>m.level === "beginner").length;
    return el("div", {},
        el("p", {className:"intent"},
            el("b", {textContent:"Remember every move in full: "}),
            "which hand hold, which way a turn goes, how the lead works, how the follow works, the footwork and any " +
            "important details. For each card, build the move up in order: feet and position first, then the arms, " +
            "then the lead and follow turns and changes of place. Then show the answer and say how well you knew it. " +
            "Cards you know well come back less often."),
        setting("Cards", null, segmented(["beginner", "all"], flash.deck, v=>{
            flash.deck = v;
            localStorage.setItem(DECK_KEY, v);
            renderFlash();
        }, v=>v === "all" ? `All moves (${MOVES.length})` : `Beginner (${beginners})`)),
        el("div", {className:"boxes", role:"img",
            ariaLabel:`New: ${inBox(0)}. ` + [1,2,3,4,5].map(b=>`Box ${b}: ${inBox(b)}`).join(", ")},
            ...[0,1,2,3,4,5].map(b=>el("div", {},
                el("div", {className:"bn", textContent:inBox(b)}),
                el("div", {className:"bx"}, el("span", {style:`height:${inBox(b)/most*100}%`})),
                el("div", {textContent:b ? `Box ${b}` : "New"})))),
        el("p", {className:"summary-line", textContent:
            `Box 1 comes back the next day, then every 2, 4, 8 and 16 days as you move up. ` +
            `${due.length} due today (${fresh.length} new).` +
            (!due.length && upcoming ? ` Next cards are due ${upcoming === inDays(1) ? "tomorrow" : upcoming}.` : "")}),
        due.length ? btn(`Study ${plural(due.length, "card")}`, "primary big-action", ()=>flashStart())
                   : btn("All done for today", "primary big-action", ()=>{}, true),
        btn("Practise every card anyway", "secondary big-action", ()=>flashStart(true)),
        reset);
}

function flashCardView(){
    const name = flash.queue[flash.at];
    const move = MOVE_STATES.get(name);
    const card = el("div", {className:"flashcard"},
        el("div", {className:"flash-progress"},
            el("span", {textContent:`${flash.at + 1} of ${flash.queue.length}`}),
            el("span", {textContent:cardOf(name).box ? `Box ${cardOf(name).box}` : "New card"})),
        el("div", {className:"flash-name", textContent:name}),
        el("div", {className:"flash-level", textContent:move.level}));
    if(!flash.revealed){
        card.append(el("ol", {className:"flash-steps"},
            el("li", {textContent:"Feet and position"}),
            el("li", {textContent:"Arms: which hand hold, and where the hands go"}),
            el("li", {textContent:"Lead and follow: turns (which way?) and changing places"}),
            el("li", {textContent:"Any important details"})));
        const show = el("button", {type:"button", className:"primary big-action", textContent:"Show answer"});
        show.addEventListener("click", ()=>{ flash.revealed = true; renderFlash(); });
        card.append(show);
        return card;
    }
    // what the app knows about the move
    const hold = (id, text)=>el("div", {}, el("img", {src:nodeIcon(id), alt:""}), `${text}: ${POSITION_NAMES[id]}`);
    card.append(el("div", {className:"flash-holds"}, hold(move.from, "Starts"), el("span", {textContent:"→"}), hold(move.to, "Finishes")));
    const facts = [];
    for(const v of MOVE_VARIATIONS.filter(v=>v.move === name)){
        facts.push(v.end ? `Can finish in ${POSITION_NAMES[v.end]} (${v.note})` : `Can start from ${POSITION_NAMES[v.start]} (${v.note})`);
    }
    const inClass = COMBINATIONS.filter(c=>c.moves.includes(name)).map(c=>c.id);
    facts.push(inClass.length ? `In class combination${inClass.length > 1 ? "s" : ""} ${listText(inClass.map(String))}`
                              : "Not in a class combination yet");
    const followers = movePool().filter(m=>canFollow(name, m));
    facts.push(`Flows on into ${plural(followers.length, "move")} without a hand change`);
    card.append(el("ul", {className:"flash-facts"}, ...facts.map(f=>el("li", {textContent:f}))));

    card.append(notesEditor(name));     // your own notes: the details the app doesn't know

    const grade = (g, label, cls)=>{
        const [, days] = graded(name, g);
        const b = el("button", {type:"button", className:cls}, label, el("small", {textContent:daysText(days)}));
        b.addEventListener("click", ()=>flashGrade(g));
        return b;
    };
    card.append(el("div", {className:"grade-buttons"},
        grade("again", "Don't know", "grade-again"),
        grade("ok", "Ok", "grade-ok"),
        grade("perfect", "Details perfect", "grade-perfect")));
    return card;
}

function flashDoneView(){
    const t = flash.tally;
    const back = el("button", {type:"button", className:"primary big-action", textContent:"Done"});
    back.addEventListener("click", ()=>{ flash.view = "home"; renderFlash(); });
    return el("div", {className:"flashcard", style:"text-align:center"},
        el("div", {className:"flash-name", textContent:"Session complete"}),
        el("p", {className:"summary-line", style:"font-size:16px", textContent:
            `${plural(t.perfect, "card")} perfect, ${t.ok} ok, ${t.again} to relearn.`}),
        back);
}

function closeFlash(){
    if(dom.flashPage.hidden) return;
    dom.flashPage.hidden = true;
    flash.view = "home";
    dom.flashBtn.focus({preventScroll:true});
}

dom.flashBtn.addEventListener("click", ()=>{ flash.view = "home"; openPage(dom.flashPage, dom.flashClose); renderFlash(); });
dom.flashClose.addEventListener("click", closeFlash);

document.addEventListener("keydown", e=>{
    if(e.key === "Escape"){ closeCaller(); closeFlash(); return; }
    if(dom.flashPage.hidden || flash.view !== "card" || e.target.closest?.("textarea, input")) return;
    if(!flash.revealed && (e.key === " " || e.key === "Enter")){
        e.preventDefault();
        flash.revealed = true;
        renderFlash();
    }else if(flash.revealed && ["1","2","3"].includes(e.key)){
        flashGrade(["again", "ok", "perfect"][Number(e.key) - 1]);
    }
});
document.addEventListener("keydown", e=>{
    if(e.key === " " && !dom.callerPage.hidden && caller.running && !e.target.closest?.("button, input")){
        e.preventDefault();
        callerTogglePause();
    }
});

// =====================================================================
// The Statistics button: sparks fall off it and little fireworks pop at
// its corners now and then (not with reduced motion, or when hidden).
// =====================================================================

{
    const COLORS = ["#ffd43b", "#ff8787", "#74c0fc", "#b197fc", "#69db7c", "#ffa94d"];
    const pick = list => list[Math.floor(Math.random() * list.length)];
    const visible = ()=>{
        if(document.hidden || REDUCED_MOTION.matches) return false;
        const r = dom.statsBtn.getBoundingClientRect();
        return r.width > 0 && r.right > 0 && r.left < innerWidth && r.bottom > 0 && r.top < innerHeight;
    };
    const spark = ()=>{
        const w = dom.statsBtn.offsetWidth, h = dom.statsBtn.offsetHeight;
        const color = pick(COLORS);
        const s = el("span", {className:"spark"});
        s.style.cssText = `left:${8 + Math.random()*(w-16)}px;top:${h - 3}px;background:${color};` +
            `box-shadow:0 0 6px 1px ${color};--dx:${(Math.random()-0.5)*14}px;--t:${0.9 + Math.random()*0.6}s`;
        s.addEventListener("animationend", ()=>s.remove());
        dom.statsFx.append(s);
    };
    const firework = ()=>{
        const w = dom.statsBtn.offsetWidth, h = dom.statsBtn.offsetHeight;
        const corner = [[4, 4], [w-4, 4], [4, h-4], [w-4, h-4]][Math.floor(Math.random()*4)];
        const b = el("span", {className:"burst"});
        b.style.cssText = `left:${corner[0]}px;top:${corner[1]}px`;
        const color = pick(COLORS), n = 10;
        for(let i = 0; i < n; i++){
            const p = el("i");
            p.style.cssText = `--a:${i*360/n + Math.random()*12}deg;--r:${14 + Math.random()*8}px;background:${color};box-shadow:0 0 4px ${color}`;
            b.append(p);
        }
        setTimeout(()=>b.remove(), 900);
        dom.statsFx.append(b);
    };
    setInterval(()=>{ if(visible() && Math.random() < 0.55) spark(); }, 260);
    const scheduleFirework = ()=>setTimeout(()=>{
        if(visible()) firework();
        scheduleFirework();
    }, 2500 + Math.random()*3500);
    scheduleFirework();
}

// =====================================================================
// Move details: tap a move's name on the graph (or in the caption) to
// see everything known about it, keep your own notes (shared with the
// flashcards), and find videos.
// =====================================================================

const VIDEOS_URL = "https://fevah.dance/classes/videos/";

// The move whose name is under a graph position: each line of a label is
// one move ("3. Back Pass", "Basket · keep both"). A tap on a line that
// carries a single move counts too.
function moveAt(pos, target){
    for(const edge of cy.edges().not(".transition, .filtered")){
        // (a tapped line is restyled as active, which clears its label box
        // until the next draw: measure it again)
        let box = labelBox(edge, "main");
        if(!box && edge.visible()){ edge.boundingBox(); box = labelBox(edge, "main"); }
        if(!box || pos.x < box.x1 || pos.x > box.x2 || pos.y < box.y1 || pos.y > box.y2) continue;
        const lines = edge.data("edgeLabel").split("\n");
        const fs = parseFloat(edge.style("font-size")) || labelFontSize();
        const lh = fs * LINE_HEIGHT;
        const top = box.y1 + (box.h - lines.length*lh) / 2;
        const k = Math.min(lines.length-1, Math.max(0, Math.floor((pos.y - top) / lh)));
        const name = lines[k].replace(/^\d+\.\s+/, "").replace(/ · .*$/, "").trim();
        if(MOVE_STATES.has(name)) return name;
    }
    if(target?.isEdge?.() && !target.hasClass("transition")){
        const moves = target.data("moves");
        if(moves?.length === 1) return moves[0];
    }
    return null;
}

// Your notes for a move, saved as you type (the flashcards use them too).
function notesEditor(name){
    const id = `notes-${slug(name)}`;
    const area = el("textarea", {id, value:flash.notes[name] ?? "", placeholder:NOTES_TEMPLATE});
    area.addEventListener("input", ()=>{
        if(area.value.trim()) flash.notes[name] = area.value;
        else delete flash.notes[name];
        saveJSON(NOTES_KEY, flash.notes);
    });
    const box = el("div", {className:"flash-notes"}, el("label", {htmlFor:id, textContent:"Your notes"}), area);
    if(!area.value){
        const tmpl = el("button", {type:"button", className:"secondary", textContent:"Add headings",
            style:"margin-top:6px;min-height:36px;font-size:14px;padding:0 12px"});
        tmpl.addEventListener("click", ()=>{ area.value = NOTES_TEMPLATE; area.dispatchEvent(new Event("input")); area.focus(); tmpl.remove(); });
        box.append(tmpl);
    }
    return box;
}

// Your own feel for a move (energy, distance, smoothness), kept on this
// device; anything you haven't set uses the move's usual value.
const FEEL_KEY = "mj-moves:move-feel";
const myFeel = loadJSON(FEEL_KEY);          // move name -> {energy, distance, smoothness}
const feelOf = name => ({ ...Object.fromEntries(Object.keys(FEEL).map(k=>[k, MOVE_STATES.get(name)[k]])), ...myFeel[name] });

function setFeel(name, key, value){
    const mine = { ...myFeel[name], [key]:value };
    if(MOVE_STATES.get(name)[key] === value) delete mine[key];   // back to the usual value
    if(Object.keys(mine).length) myFeel[name] = mine;
    else delete myFeel[name];
    saveJSON(FEEL_KEY, myFeel);
}

// Three pips per scale, each with its emoji; tap one to choose your own.
function feelView(name){
    const box = el("div", {className:"feel"});
    const paint = ()=>{
        const feel = feelOf(name);
        box.replaceChildren(...Object.entries(FEEL).map(([key, values])=>{
            const label = key[0].toUpperCase() + key.slice(1);
            const pips = el("span", {className:"feel-scale", role:"radiogroup", ariaLabel:label},
                ...values.map(v=>{
                    const pip = el("button", {type:"button", className:v === feel[key] ? "on" : "",
                        textContent:FEEL_EMOJI[key][v], title:v, ariaLabel:v});
                    pip.setAttribute("role", "radio");
                    pip.setAttribute("aria-checked", v === feel[key]);
                    pip.addEventListener("click", ()=>{ setFeel(name, key, v); paint(); });
                    return pip;
                }));
            return el("div", {className:"feel-row"},
                el("span", {className:"feel-key", textContent:label}), pips,
                el("span", {className:"feel-value", textContent:feel[key]}));
        }));
        if(myFeel[name]){
            const reset = el("button", {type:"button", className:"feel-reset", textContent:"Reset to usual"});
            reset.addEventListener("click", ()=>{ delete myFeel[name]; saveJSON(FEEL_KEY, myFeel); paint(); });
            box.append(reset);
        }
    };
    paint();
    return box;
}

function showMoveDetails(name){
    const move = MOVE_STATES.get(name);
    if(!move) return;
    const pool = movePool();
    const chipList = names=>names.length
        ? el("div", {className:"mp-chips"}, ...names.map(n=>{
            const b = el("button", {type:"button", textContent:n});
            b.addEventListener("click", ()=>showMoveDetails(n));
            return b;
          }))
        : el("p", {className:"mp-text", textContent:"None"});
    const close = el("button", {type:"button", textContent:"✕", ariaLabel:"Close move details"});
    close.addEventListener("click", closeMoveDetails);
    const hold = (id, text)=>el("div", {}, el("img", {src:nodeIcon(id), alt:""}), text, el("br"), el("b", {textContent:POSITION_NAMES[id]}));

    const parts = [
        el("div", {className:"mp-head"},
            el("div", {style:"flex:1"},
                el("h2", {id:"moveTitle", textContent:name}),
                el("span", {className:`mp-level ${move.level}`, textContent:move.level})),
            close),
        el("div", {className:"mp-holds"}, hold(move.from, "Starts in"), el("span", {className:"arrow", textContent:"→"}), hold(move.to, "Finishes in")),
        el("h3", {className:"mp-section", textContent:"Feel"}),
        el("p", {className:"mp-text feel-why", textContent:"Helps us choose which move best matches a moment in a song. " +
            "High energy, distant moves for big moments. Sharp bouncy moves to match a rhythm. Smooth or close for delicate moments."}),
        feelView(name),
        notesEditor(name)
    ];

    const variations = MOVE_VARIATIONS.filter(v=>v.move === name).map(v=>v.end
        ? `Can finish in ${POSITION_NAMES[v.end]} (${v.note}), so the next move can start there`
        : `Can start from ${POSITION_NAMES[v.start]} (${v.note})`);
    if(variations.length){
        parts.push(el("h3", {textContent:"Variations"}),
            ...variations.map(t=>el("p", {className:"mp-text", textContent:t})));
    }

    parts.push(el("h3", {textContent:"Flows on into (no hand change)"}), chipList(pool.filter(m=>m !== name && canFollow(name, m))));
    parts.push(el("h3", {textContent:"Can come after (no hand change)"}), chipList(pool.filter(m=>m !== name && canFollow(m, name))));

    const inClass = COMBINATIONS.filter(c=>c.moves.includes(name));
    parts.push(el("h3", {textContent:"In class combinations"}));
    if(inClass.length){
        parts.push(el("div", {className:"mp-chips"}, ...inClass.map(c=>{
            const b = el("button", {type:"button", className:"combo-chip", textContent:`${c.id}`, title:c.moves.join(" → ")});
            b.setAttribute("aria-label", `Combination ${c.id}: ${c.moves.join(", ")}`);
            b.addEventListener("click", ()=>{ state.preview = null; selectCombo(c); });
            return b;
        })));
    }else{
        parts.push(el("p", {className:"mp-text", textContent:"Not in a class combination yet"}));
    }
    const superAt = SUPER_COMBO.moves.indexOf(name);
    if(superAt >= 0){
        parts.push(el("p", {className:"mp-text", style:"margin-top:6px",
            textContent:`Move ${superAt + 1} of ${SUPER_COMBO.moves.length} in the Beginner's Super Combo`}));
    }

    const card = cardOf(name);
    parts.push(el("h3", {textContent:"Flashcards"}), el("p", {className:"mp-text", textContent: card.box
        ? `Box ${card.box} of ${LAST_BOX}; ${card.due <= today() ? "due now" : `next due ${card.due === inDays(1) ? "tomorrow" : card.due}`}`
        : "Not studied yet"}));

    parts.push(el("a", {className:"mp-videos", href:VIDEOS_URL, target:"_blank", rel:"noopener"},
            "Videos", el("span", {ariaHidden:"true", textContent:"↗"})));

    dom.movePanel.replaceChildren(...parts);
    dom.movePanel.hidden = false;
    dom.movePanel.scrollTop = 0;
}

function closeMoveDetails(){
    dom.movePanel.hidden = true;
}

document.addEventListener("keydown", e=>{
    if(e.key === "Escape" && dom.callerPage.hidden && dom.flashPage.hidden && dom.statsPage.hidden) closeMoveDetails();
});

renderBuilder();

state.selection = (c=>c ? {kind:"combo", combo:c} : null)(comboFromUrl());
select(state.selection, {updateUrl:false});
applyLayout();
</script>
