<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dance State Transition Graph</title>

<!-- Pinned: the pulse animation reads Cytoscape's internal edge geometry and label bounds. -->
<script src="https://unpkg.com/cytoscape@3.35.0/dist/cytoscape.min.js"></script>

<style>
html, body {
    margin:0;
    height:100%;
    font-family:sans-serif;
}

#container{
    display:flex;
    flex-direction:column;
    height:100vh;
    height:100dvh;
}

/* ---------- Top bar: menu button, caption, prev/next ---------- */

#topbar{
    display:flex;
    align-items:center;
    gap:8px;
    padding:8px 10px;
    padding-top:calc(8px + env(safe-area-inset-top));
    border-bottom:1px solid #ccc;
    background:white;
    flex:0 0 auto;
}

#topbar button{
    min-width:44px;
    min-height:44px;
    font-size:20px;
    border:1px solid #ccc;
    border-radius:8px;
    background:white;
    cursor:pointer;
    -webkit-tap-highlight-color:transparent;
}

#menuBtn{
    font-size:22px;
}

#caption{
    flex:1;
    min-width:0;
    font-size:15px;
    color:#333;
    text-align:center;
}

.note{
    display:inline-block;
    font-style:italic;
    font-size:0.85em;
    color:#a35800;
    background:#fff3e0;
    border:1px dashed #ff9900;
    border-radius:10px;
    padding:0 6px;
    white-space:nowrap;
}

/* the step the comet is currently travelling */
#caption .step{
    border-radius:4px;
    padding:0 2px;
    transition:background-color 0.15s, color 0.15s;
}

#caption .step.current,
#caption .note.current{
    background:#ff9900;
    color:white;
    border-color:#ff9900;
}

#caption .placeholder{
    color:#888;
}

#graph{
    flex:1;
    min-width:0;
    min-height:0;
    position:relative;
    overflow:hidden;
}

#cy{
    position:absolute;
    inset:0;
    background:#fafafa;
}

/* Lights up the single line of a graph label that the comet is on
   (Cytoscape can't style one line of a label on its own). */
#stepHighlight{
    position:absolute;
    display:none;
    box-sizing:border-box;
    background:#ff9900;
    color:white;
    text-align:center;
    white-space:nowrap;
    overflow:hidden;
    border-radius:3px;
    pointer-events:none;
}

/* ---------- Slide-out menu of combinations ---------- */

#backdrop{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.3);
    opacity:0;
    pointer-events:none;
    transition:opacity 0.2s;
    z-index:10;
}

#menu{
    position:fixed;
    top:0;
    left:0;
    bottom:0;
    width:min(320px, 85vw);
    background:white;
    box-shadow:2px 0 12px rgba(0,0,0,0.2);
    transform:translateX(-105%);
    transition:transform 0.2s ease-out;
    overflow-y:auto;
    padding:15px;
    padding-top:calc(15px + env(safe-area-inset-top));
    padding-bottom:calc(15px + env(safe-area-inset-bottom));
    box-sizing:border-box;
    z-index:11;
}

body.menu-open #menu{
    transform:translateX(0);
}

body.menu-open #backdrop{
    opacity:1;
    pointer-events:auto;
}

#menu-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
}

#menu h2{
    margin:0;
    font-size:20px;
}

#closeBtn{
    min-width:44px;
    min-height:44px;
    font-size:22px;
    border:none;
    background:none;
    cursor:pointer;
}

#comboList{
    margin-top:10px;
}

.combo{
    padding:10px 8px;
    margin-bottom:6px;
    border-radius:6px;
    cursor:pointer;
    border:2px solid transparent;
    -webkit-tap-highlight-color:transparent;
    user-select:none;
}

.combo:hover{
    background:#eef5ff;
}

.combo.active{
    background:#fff3e0;
    border-color:#ff9900;
}

.combo-title{
    font-weight:bold;
}

.combo-moves{
    font-size:14px;
    color:#555;
}

.hint{
    font-size:13px;
    color:#666;
}

@media (prefers-reduced-motion:reduce){
    #menu, #backdrop{ transition:none; }
}
</style>
</head>

<body>

<div id="container">

<div id="topbar">
<button id="menuBtn" aria-label="Show combinations" aria-controls="menu" aria-expanded="false">☰</button>
<button id="prevBtn" aria-label="Previous combination">‹</button>
<div id="caption"></div>
<button id="nextBtn" aria-label="Next combination">›</button>
</div>

<div id="graph">
<div id="cy"></div>
<div id="stepHighlight" aria-hidden="true"></div>
</div>

</div>

<div id="backdrop"></div>

<nav id="menu" aria-label="Common combinations">
<div id="menu-header">
<h2>Common Combinations</h2>
<button id="closeBtn" aria-label="Close menu">✕</button>
</div>

<div id="comboList"></div>

<p class="hint">
Pick a combination to highlight its transitions; numbers show the execution
order. Use ‹ › to step through them. Tap a line on the graph to see all of
its moves, or tap empty space to clear.
</p>
</nav>

<script>

const moves = [
["Accordion","rr","rr"],
["Loop Throughs","bh","bh"],
["Back Pass","rr","lr"],
["Manhattan","lr","lr"],
["Basket","bh","lr"],
["New Yorker","lr","lr"],
["Block & Turn","rr","rr"],
["Outside Turn","lr","lr"],
["Break Through","lr","rr"],
["Short First Move","lr","lr"],
["Catapult","rr","lr"],
["Shoulder Block","rr","lr"],
["Figure Of 8","lr","rr"],
["Squeezebox","bh","lr"],
["Hatchback","lr","lr"],
["Step Across","lr","lr"],
["Hook Turn","rr","lr"],
["Travelling Return","lr","lr"],
["Key Turn","rr","lr"],
["Wurlitzer","lr","lr"],
["Left Side Change","lr","rr"],
["Yoyo","rr","rr"],
["Shoulder Wrap","rr","lr"],
["Comb","rr","rr"],
["Slide Break","bh","rr"],
["First Move","lr","lr"],
["Wrap & Throw","rl","lr"],
["Short Manhattan","lr","lr"]
];
// [id, moves, hand transitions]. A hand transition bridges a move that ends
// in one hand position and a next move that starts in another; it's keyed
// by the move it follows.
const combinations = [
[1,["Basket","Manhattan","Step Across"]],
[2,["Short First Move","Break Through","Hook Turn"]],
[3,["Yoyo","Back Pass","Figure Of 8"]],
[4,["Accordion","Shoulder Block","Block & Turn"], {"Shoulder Block":"swap to R"}],
[5,["Manhattan","Left Side Change","Key Turn"]],
[6,["Step Across","Wurlitzer","Short First Move"]],
[7,["Basket","Loop Throughs","Hatchback"], {"Basket":"keep both", "Loop Throughs":"drop R"}],
[8,["Squeezebox","Figure Of 8","Catapult"]],
[10,["Shoulder Block","Accordion","Yoyo"], {"Shoulder Block":"offer L"}],
[11,["Short First Move","Loop Throughs","New Yorker"], {"Short First Move":"trace R", "Loop Throughs":"drop R"}],
[12,["Catapult","Break Through","Block & Turn"]],
[13,["Squeezebox","Left Side Change","Back Pass"]]
];

// ---------- Group moves into one edge per (from, to) pair ----------

const groups = new Map();   // "from|to" -> {from, to, moves:[]}
moves.forEach(([move,from,to])=>{
    const key = `${from}|${to}`;
    if(!groups.has(key)) groups.set(key, {from, to, moves:[]});
    groups.get(key).moves.push(move);
});

const elements=[];

// ---------- Node icons: hand positions seen from above ----------
// Each node is a 2x2 grid. Top row = follow (fingers pointing down),
// bottom row = lead (fingers pointing up). Viewed from above with the
// couple facing each other, the squares are always:
//
//     follow's R | follow's L
//     lead's L   | lead's R
//
// Each node fills the squares for the hands that are joined.

const HAND_SLOTS = {
    tl:{ col:0, row:0, letter:"R" },
    tr:{ col:1, row:0, letter:"L" },
    bl:{ col:0, row:1, letter:"L" },
    br:{ col:1, row:1, letter:"R" }
};

const NODE_HANDS = {
    lr:["tl","bl"],
    rr:["tl","br"],
    rl:["tr","br"],
    bh:["tl","tr","bl","br"]
};

// Lead's hands are blue; follow's hands are silver (dark enough that the
// white letter stays readable on a white node).
const LEAD_COLOR = "#2d7ff9";
const FOLLOW_COLOR = "#7d8894";
const CELL = 46, GAP = 4, PAD = 2;          // icon is 2*CELL + GAP + 2*PAD square
const ICON_SIZE = 2*CELL + GAP + 2*PAD;

// A hand with fingers pointing up, drawn in a CELL x CELL box.
// thumbRight: thumb on the right-hand side of the palm.
function handShape(thumbRight, color){
    const fingers = [
        {x:10.0, top:8},
        {x:16.8, top:4},
        {x:23.6, top:5},
        {x:30.4, top:9}
    ].map(f=>`<rect x="${f.x}" y="${f.top}" width="5.6" height="${26-f.top}" rx="2.8"/>`).join("");
    const thumb = thumbRight
        ? `<ellipse cx="38.5" cy="29" rx="3.6" ry="7.5" transform="rotate(32 38.5 29)"/>`
        : `<ellipse cx="7.5" cy="29" rx="3.6" ry="7.5" transform="rotate(-32 7.5 29)"/>`;
    return `<g fill="${color}">${fingers}${thumb}<rect x="9.5" y="21" width="27" height="21" rx="7"/></g>`;
}

function slotSvg(slot, filled){
    const x = PAD + slot.col*(CELL+GAP);
    const y = PAD + slot.row*(CELL+GAP);
    if(!filled){
        return `<rect x="${x+3}" y="${y+3}" width="${CELL-6}" height="${CELL-6}" rx="6"
            fill="none" stroke="#d4d4d4" stroke-width="1.5" stroke-dasharray="4 3"/>`;
    }
    // Thumbs point toward the centre line: left column -> right, right column -> left.
    const thumbRight = slot.col===0;
    const fingersDown = slot.row===0;
    // Fingers-down hands are the fingers-up shape flipped vertically.
    const color = fingersDown ? FOLLOW_COLOR : LEAD_COLOR;
    const shape = fingersDown
        ? `<g transform="translate(0 ${CELL}) scale(1 -1)">${handShape(thumbRight, color)}</g>`
        : handShape(thumbRight, color);
    const textY = fingersDown ? 18 : 38;     // centre of the palm
    return `<g transform="translate(${x} ${y})">${shape}
        <text x="23" y="${textY}" text-anchor="middle" font-family="sans-serif"
            font-size="15" font-weight="bold" fill="white">${slot.letter}</text></g>`;
}

function nodeIcon(id){
    const filled = new Set(NODE_HANDS[id]);
    const body = Object.entries(HAND_SLOTS)
        .map(([key,slot])=>slotSvg(slot, filled.has(key))).join("");
    const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${ICON_SIZE}" height="${ICON_SIZE}"
        viewBox="0 0 ${ICON_SIZE} ${ICON_SIZE}">${body}</svg>`;
    return "data:image/svg+xml;utf8," + encodeURIComponent(svg);
}

["rr","lr","rl","bh"].forEach(id=>{
    elements.push({ data:{ id, label:id, icon:nodeIcon(id) }, classes:"state" });
});

groups.forEach(({from,to,moves:names},key)=>{
    // If there's also an edge going the other way, bow this one out so the
    // two lines (and their lists) sit on opposite sides instead of overlapping.
    const hasReverse = from!==to && groups.has(`${to}|${from}`);
    elements.push({
        data:{
            id:"e:"+key,
            source:from,
            target:to,
            moves:names,
            count:names.length,
            fullLabel:names.join("\n"),
            edgeLabel:names.join("\n"),
            bow: hasReverse ? 140 : 0,      // set per layout in applyLayout()
            hasReverse,
            loopDirection: 0,
            mx: 0,
            my: 0
        }
    });
});

// ---------- Node placement ----------
// A 2x2 grid with lr (the busiest state) in the top-left corner:
//
//    lr ---- rr      rr<->lr bow apart along the top edge
//    |  \    |       rl->lr runs down the left side
//    |    \  |       bh->rr runs down the right side
//    rl     bh       bh->lr is the only diagonal, so no lines cross
//
// Each self-loop (and its list) points diagonally out of its corner.
// Grid width/height adapt to the screen shape; on phones (compact) the
// nodes sit closer together so the graph is drawn as big as possible.

const LOOPS = { lr:-45, rr:45, bh:135, rl:-135 };
// Portrait phones are short on width, so loops point straight up/down;
// landscape phones are short on height, so loops point sideways.
const LOOPS_VERTICAL   = { lr:0, rr:0, bh:180, rl:180 };
const LOOPS_HORIZONTAL = { lr:-90, rr:90, bh:90, rl:-90 };

// bow: how far the rr<->lr pair curve apart.
// shift: move a line's label along its line (fraction of its length;
// + towards the target), to keep labels from colliding with each other.
function grid(w, h, loop=LOOPS, {bow=140, shift={}}={}){
    return {
        pos:{ lr:{x:0,y:0}, rr:{x:w,y:0}, rl:{x:0,y:h}, bh:{x:w,y:h} },
        loop, bow, shift
    };
}

const LAYOUTS = {
    wide:        grid(560, 420),
    tall:        grid(420, 560),
    // Landscape phones: a gentler rr<->lr bow keeps the lower list clear of
    // the diagonal Basket line.
    wideCompact: grid(460, 300, LOOPS_HORIZONTAL, { bow: 120, shift: { "lr|rr": 0.1 } }),
    // Portrait phones: the two vertical labels would sit level with the
    // diagonal's label, so move one up and one down out of its way.
    tallCompact: grid(260, 560, LOOPS_VERTICAL, {
        bow: 100,
        shift: { "rl|lr": -0.25, "bh|rr": 0.25 }
    })
};

// Phones in either orientation: narrow (portrait) or short (landscape).
const compactQuery = window.matchMedia("(max-width:700px), (max-height:500px)");
const isCompact = () => compactQuery.matches;
const fitPadding = () => isCompact() ? 20 : 50;
const labelFontSize = () => isCompact() ? 19 : 15;

let layout = LAYOUTS.wide;

function currentLayout(){
    const cyEl = document.getElementById("cy");
    const shape = cyEl.clientHeight > cyEl.clientWidth ? "tall" : "wide";
    return LAYOUTS[isCompact() ? shape + "Compact" : shape];
}

const cy = cytoscape({

container:document.getElementById("cy"),

elements,

style:[

{
selector:"node.state",
style:{
'shape':'round-rectangle',
'width':84,
'height':84,
'background-color':'white',
'border-width':2,
'border-color':'#2d7ff9',
'background-image':'data(icon)',
'background-fit':'contain',
'background-clip':'none',
'background-width':'92%',
'background-height':'92%'
}
},

{
selector:"edge",
style:{
'label':'data(edgeLabel)',
'curve-style':'bezier',
'text-wrap':'wrap',
'text-max-width':'180px',
'text-justification':'center',
'line-height':1.3,
'source-endpoint':'outside-to-node',
'target-endpoint':'outside-to-node',
'target-arrow-shape':'triangle',
'line-color':'#888',
'target-arrow-color':'#888',
'font-size':15,
// the device's own UI font is crisper on screen than Helvetica fallbacks
'font-family':'system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif',
'color':'#222',
'text-rotation':'none',
'text-background-shape':'roundrectangle',
'text-background-opacity':1,
'text-background-color':'#fafafa',   // same as the graph background, so the box is invisible
'text-background-padding':4,
// thicker line = more moves on that transition
'width':'mapData(count, 1, 10, 2, 5)',
'arrow-scale':1.2
}
},

{
selector:"edge:simple",
style:{
'text-margin-x':'data(mx)',
'text-margin-y':'data(my)',
'curve-style':'unbundled-bezier',
'control-point-distances':'data(bow)',
'control-point-weights':0.5
}
},

{
selector:"edge:loop",
style:{
'loop-direction':'data(loopDirection)',
'loop-sweep':'50deg',
'control-point-step-size':110,
// push the list off the loop so the loop itself stays visible
'text-margin-x':'data(mx)',
'text-margin-y':'data(my)'
}
},

{
selector:"edge.compact",
style:{
'font-size':19
}
},

{
selector:"edge.dim",
style:{
// faded but still readable, so labels never vanish
'line-color':'#e2e2e2',
'target-arrow-color':'#e2e2e2',
'color':'#666',
}
},

{
selector:".highlight",
style:{
'line-color':'#ff9900',
'target-arrow-color':'#ff9900',
'width':6,
'color':'#b35c00',
'font-weight':'bold',
'z-index':999
}
},

{
selector:"edge.transition",
style:{
// label sits a third of the way along (near where the hand change happens)
// so it doesn't collide with move labels at the middle of nearby lines
'label':'',
'source-label':'data(edgeLabel)',
'source-text-offset':'data(labelOffset)',
'line-style':'dashed',
'line-dash-pattern':[8,6],
'width':3,
'font-style':'italic',
'font-weight':'normal',
}
},

{
selector:"node.pulse",
style:{
'shape':'ellipse',
'width':'data(size)',
'height':'data(size)',
'background-color':'white',
// soft glow around each dot
'underlay-color':'white',
'underlay-padding':4,
'underlay-opacity':0.45,
'underlay-shape':'ellipse',
'opacity':0,
'events':'no',
'z-index':1000
}
}

],

layout:{ name:"preset" }

});

// ---------- Labels ----------

const measureCtx = document.createElement("canvas").getContext("2d");

// Shift each loop's label outward (in the loop's direction) by half its
// size, so the label sits beyond the loop instead of covering it.
function offsetLoopLabels(){
    const size = labelFontSize();
    cy.edges(":loop").forEach(edge=>{
        const lines = edge.data("edgeLabel").split("\n");
        measureCtx.font = `${edge.hasClass("highlight") ? "bold " : ""}${size}px sans-serif`;
        const w = Math.max(...lines.map(l=>measureCtx.measureText(l).width)) + 10;
        const h = lines.length * size * 1.3 + 10;
        const rad = edge.data("loopDirection") * Math.PI / 180;
        const sx = Math.sin(rad), sy = -Math.cos(rad);
        const snap = v => Math.abs(v) < 0.1 ? 0 : Math.sign(v);
        edge.data({
            mx: snap(sx) * (w/2 + 12),
            my: snap(sy) * (h/2 + 12)
        });
    });
}

// Every edge always shows its label; phones just use a larger font.
function updateLabels(){
    const compact = isCompact();
    cy.edges().forEach(edge=>edge.toggleClass("compact", compact));
    offsetLoopLabels();
    keepLabelsOnScreen();
}

// Highlighting changes label text (and makes it bold), which can push a
// label off the edge on phones. If it does, zoom out just enough to fit.
function keepLabelsOnScreen(){
    if(!isCompact()) return;
    const box = graphElements().renderedBoundingBox();
    const pad = 4;
    if(box.x1 < pad || box.y1 < pad ||
       box.x2 > cy.width() - pad || box.y2 > cy.height() - pad){
        cy.fit(graphElements(), fitPadding());
    }
}

function applyLayout(){
    layout = currentLayout();
    cy.edges(":loop").forEach(edge=>{
        edge.data("loopDirection", layout.loop[edge.data("source")]);
    });
    cy.nodes(".state").forEach(node=>node.position(layout.pos[node.id()]));
    cy.edges(":simple").not(".transition").forEach(edge=>{
        if(edge.data("hasReverse")) edge.data("bow", layout.bow);
        // label shift along the line, as a margin (straight lines only)
        const f = layout.shift[`${edge.data("source")}|${edge.data("target")}`] || 0;
        const a = layout.pos[edge.data("source")], b = layout.pos[edge.data("target")];
        edge.data({ mx: (b.x-a.x)*f, my: (b.y-a.y)*f });
    });
    cy.resize();
    updateLabels();   // before fit, so the fit accounts for label sizes
    cy.fit(graphElements(), fitPadding());
    resetPulsePath();  // lines moved, so the pulse needs the new shapes
}

// ---------- Pulse animation ----------
// A white comet glides along the highlighted lines, move by move in
// execution order, pauses briefly, then repeats. Its path comes from
// Cytoscape's internal edge geometry: every edge here is drawn as a chain
// of quadratic curves stored in rscratch.allpts as
// [start, control, end, control, end, ...] (x,y pairs).

const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)");
const PULSE_SPEED = 320;     // model units per second
const PULSE_PAUSE = 700;     // ms with no comet between loops
const PULSE_TAIL = [         // head first: size and opacity of each dot
    {size:15, alpha:1},
    {size:13, alpha:0.85},
    {size:12, alpha:0.7},
    {size:11, alpha:0.55},
    {size:10, alpha:0.42},
    {size:9,  alpha:0.3},
    {size:8,  alpha:0.2},
    {size:7,  alpha:0.12}
];
const PULSE_SPACING = 7;     // distance between tail dots

const pulseDots = cy.add(PULSE_TAIL.map((d,i)=>({
    group:"nodes",
    data:{ id:"pulse"+i, size:d.size },
    classes:"pulse",
    position:{x:0, y:0}
}))).ungrabify().unselectify();

let pulseRoute = [];
let pulsePath = null;
let pulseStart = 0;
let pulseFrame = null;

function graphElements(){
    return cy.elements().not(".pulse");
}

// Sample the route into one polyline with cumulative distances.
function buildPulsePath(){
    const pts = [];
    let incomplete = false;
    const add = (x,y)=>{
        const n = pts.length;
        if(n && Math.hypot(x-pts[n-1].x, y-pts[n-1].y) < 0.01) return;
        pts.push({x,y});
    };
    const startIdx = [];
    for(const edge of pulseRoute){
        startIdx.push(pts.length);
        if(edge.removed()) continue;
        // freshly added edges have no geometry until Cytoscape draws them
        const a = edge._private.rscratch && edge._private.rscratch.allpts;
        if(!a || a.length < 6){ incomplete = true; continue; }
        for(let i=0; i+5<a.length; i+=4){
            const [x0,y0,cx,cy_,x1,y1] = a.slice(i, i+6);
            for(let k=0; k<=24; k++){
                const t=k/24, u=1-t;
                add(u*u*x0 + 2*u*t*cx + t*t*x1, u*u*y0 + 2*u*t*cy_ + t*t*y1);
            }
        }
    }
    const cum = [0];
    for(let i=1; i<pts.length; i++){
        cum.push(cum[i-1] + Math.hypot(pts[i].x-pts[i-1].x, pts[i].y-pts[i-1].y));
    }
    // distance along the path where each route step begins
    const starts = startIdx.map(i=>cum[Math.min(i, cum.length-1)] || 0);
    return { pts, cum, starts, total: cum[cum.length-1] || 0, incomplete };
}

function pointAt(path, d){
    const {pts, cum} = path;
    let lo=0, hi=cum.length-1;
    while(hi-lo > 1){
        const mid=(lo+hi)>>1;
        if(cum[mid] <= d) lo=mid; else hi=mid;
    }
    const span = cum[hi]-cum[lo] || 1;
    const t = (d-cum[lo])/span;
    return { x: pts[lo].x + (pts[hi].x-pts[lo].x)*t,
             y: pts[lo].y + (pts[hi].y-pts[lo].y)*t };
}

// Boxes of all visible edge labels (model coordinates). Uses Cytoscape's
// internal labelBounds, which is why the library version is pinned.
function labelBoxes(){
    const boxes = [];
    cy.edges().forEach(edge=>{
        const lb = edge._private.labelBounds || {};
        for(const b of [lb.main, lb.source]){
            if(b && b.w > 0 && b.h > 0) boxes.push(b);
        }
    });
    return boxes;
}

function hidePulse(){
    pulseDots.style("opacity", 0);
}

function resetPulsePath(){
    pulsePath = null;
}

// steps: caption key for each route edge ("m0" = first move, "t0" = hand
// transition after it); owner: index of the combination being shown.
let pulseSteps = [];
let pulseOwner = -1;
let activeStep = -1;

// Light up the move currently being travelled: its line's label on the
// graph, and (if the caption shows this combination) its name in the caption.
function setActiveStep(j){
    if(j === activeStep) return;
    activeStep = j;
    caption.querySelectorAll(".current").forEach(el=>el.classList.remove("current"));
    updateStepHighlight();
    if(j < 0 || !pulseRoute[j]) return;
    if(pulseOwner >= 0 && pulseOwner === selected){
        const el = caption.querySelector(`[data-step="${pulseSteps[j]}"]`);
        if(el) el.classList.add("current");
    }
}

const stepHighlight = document.getElementById("stepHighlight");

// Position the HTML highlight over the one line of the current edge's label
// that belongs to the active step. Uses Cytoscape's internal labelBounds
// (model coordinates, including padding), converted to screen coordinates.
function updateStepHighlight(){
    const edge = activeStep >= 0 ? pulseRoute[activeStep] : null;
    const isTransition = edge && edge.hasClass("transition");
    const lb = edge && !edge.removed() && edge._private.labelBounds || {};
    const box = isTransition ? lb.source : lb.main;
    if(!box || !(box.w > 0)){
        stepHighlight.style.display = "none";
        return;
    }
    const lines = edge.data("edgeLabel").split("\n");
    let k = 0;
    if(!isTransition){
        const n = Number(pulseSteps[activeStep].slice(1)) + 1;     // "m1" -> step 2
        k = Math.max(0, lines.findIndex(l=>l.startsWith(`${n}. `)));
    }
    // match the label's exact font so the highlighted text is the same size
    const fs = parseFloat(edge.style("font-size")) || labelFontSize(), lh = fs * 1.3;
    const zoom = cy.zoom(), pan = cy.pan();
    const textTop = box.y1 + (box.h - lines.length*lh) / 2;
    const inset = 0;   // fill the label's full width
    Object.assign(stepHighlight.style, {
        display: "block",
        left:   `${(box.x1 + inset) * zoom + pan.x}px`,
        top:    `${(textTop + k*lh) * zoom + pan.y}px`,
        width:  `${(box.w - 2*inset) * zoom}px`,
        height: `${lh * zoom}px`,
        fontSize:   `${fs * zoom}px`,
        lineHeight: `${lh * zoom}px`,
        fontFamily: edge.style("font-family"),
        fontStyle:  edge.style("font-style"),
        fontWeight: edge.style("font-weight")
    });
    stepHighlight.textContent = lines[k];
}

function setPulseRoute(edges, steps=[], owner=-1){
    pulseRoute = edges;
    pulseSteps = steps;
    pulseOwner = owner;
    activeStep = -2;          // force a refresh
    setActiveStep(-1);
    pulsePath = null;
    pulseStart = performance.now();
    if(!edges.length || reduceMotion.matches){
        hidePulse();
        return;
    }
    if(pulseFrame === null) pulseFrame = requestAnimationFrame(pulseTick);
}

let lastCycle = -1;
function pulseTick(now){
    pulseFrame = null;
    if(!pulseRoute.length || reduceMotion.matches){
        hidePulse();
        setActiveStep(-1);
        return;
    }
    // (new connector edges only get their shape after the next render)
    if(!pulsePath || pulsePath.incomplete) pulsePath = buildPulsePath();
    const total = pulsePath.total;
    if(total > 0){
        const travel = total / PULSE_SPEED * 1000;
        const cycleLen = travel + PULSE_PAUSE;
        const elapsed = now - pulseStart;
        const cycle = Math.floor(elapsed / cycleLen);
        if(cycle !== lastCycle){
            // refresh the shape each loop in case lines were re-laid out
            lastCycle = cycle;
            pulsePath = buildPulsePath();
        }
        const head = (elapsed % cycleLen) / travel * total;
        let step = -1;
        if(head <= total){
            pulsePath.starts.forEach((d,j)=>{ if(d <= head) step = j; });
        }
        setActiveStep(step);
        updateStepHighlight();     // follows zoom/pan/relayout
        const boxes = labelBoxes();
        cy.batch(()=>{
            pulseDots.forEach((dot,i)=>{
                const d = head - i*PULSE_SPACING;
                if(d < 0 || d > total){
                    dot.style("opacity", 0);
                    return;
                }
                const pos = pointAt(pulsePath, d);
                dot.position(pos);
                // Nodes always draw above edge labels, so to make the comet
                // pass *under* a label, hide any dot (incl. glow) touching one.
                const r = PULSE_TAIL[i].size/2 + 4;
                const covered = boxes.some(b=>
                    pos.x + r > b.x1 && pos.x - r < b.x2 &&
                    pos.y + r > b.y1 && pos.y - r < b.y2);
                dot.style("opacity", covered ? 0 : PULSE_TAIL[i].alpha);
            });
        });
    }
    pulseFrame = requestAnimationFrame(pulseTick);
}

reduceMotion.addEventListener("change", ()=>setPulseRoute(pulseRoute));

// ---------- Highlighting ----------

function clearHighlight(){
    cy.edges(".transition").remove();
    cy.elements().removeClass("dim highlight");
    cy.edges().forEach(edge=>edge.data("edgeLabel", edge.data("fullLabel")));
    updateLabels();
    setPulseRoute([]);
}

function dimAll(){
    clearHighlight();
    cy.edges().addClass("dim");
}

function lightUp(edge, label){
    edge.removeClass("dim").addClass("highlight");
    edge.data("edgeLabel", label);
}

const moveEdge = name => cy.edges().filter(e=>(e.data("moves")||[]).includes(name))[0];

// Pick a curve for a connector from s to t that doesn't sit on top of an
// existing line between the same two states (in either direction).
function connectorBow(s, t){
    const taken = [];
    cy.edges(":simple").not(".transition").forEach(e=>{
        if(e.data("source")===s && e.data("target")===t) taken.push(e.data("bow"));
        if(e.data("source")===t && e.data("target")===s) taken.push(-e.data("bow"));
    });
    return [0, 90, -90, 180, -180].find(b=>taken.every(x=>Math.abs(x-b) >= 60)) ?? 0;
}

// A dashed connector for a hand transition, shown only while its
// combination is highlighted.
function addTransition(from, to, note, n){
    const a = cy.$id(from).position(), b = cy.$id(to).position();
    return cy.add({
        group:"edges",
        data:{
            id:`transition${n}`,
            source:from, target:to,
            moves:[], count:1,
            edgeLabel:note, fullLabel:note,
            bow:connectorBow(from, to),
            labelOffset:Math.hypot(b.x-a.x, b.y-a.y) * 0.25,
            loopDirection:0, mx:0, my:0
        },
        classes:"transition highlight"
    })[0];   // the edge itself, not the collection cy.add() returns
}

// Highlight a combination: each edge it uses shows only the combo's moves
// on that edge, numbered by execution order. Where one move ends in a
// different hand position from where the next starts, a dashed connector
// labelled with the hand transition bridges the gap.
function highlight(comboMoves, notes={}, owner=-1){
    dimAll();
    cy.edges().forEach(edge=>{
        const own = edge.data("moves");
        const steps = comboMoves
            .map((name,i)=>({name, step:i+1}))
            .filter(({name})=>own.includes(name));
        if(steps.length){
            lightUp(edge, steps.map(s=>`${s.step}. ${s.name}`).join("\n"));
        }
    });
    // pulse travels the moves (and any hand transitions) in execution order
    const route = [], steps = [];
    comboMoves.forEach((name,i)=>{
        const edge = moveEdge(name);
        if(!edge) return;
        route.push(edge); steps.push(`m${i}`);
        const next = moveEdge(comboMoves[i+1]);
        if(next && edge.data("target") !== next.data("source")){
            route.push(addTransition(edge.data("target"), next.data("source"),
                                     notes[name] || "hand change", i));
            steps.push(`t${i}`);
        }
    });
    updateLabels();
    setPulseRoute(route, steps, owner);
}

// Highlight a single edge with its full move list (used when tapping a line).
function highlightEdge(edge){
    dimAll();
    lightUp(edge, edge.data("fullLabel"));
    updateLabels();
    setPulseRoute([edge]);
}

// ---------- Menu ----------

const menuBtn=document.getElementById("menuBtn");

function openMenu(){
    document.body.classList.add("menu-open");
    menuBtn.setAttribute("aria-expanded","true");
    const target = document.querySelector(".combo.active") || document.querySelector(".combo");
    target.focus({preventScroll:true});
    target.scrollIntoView({block:"nearest"});
}

function closeMenu(){
    if(!document.body.classList.contains("menu-open")) return;
    document.body.classList.remove("menu-open");
    menuBtn.setAttribute("aria-expanded","false");
    menuBtn.focus({preventScroll:true});
    showSelected();   // undo any hover preview
}

menuBtn.addEventListener("click",openMenu);
document.getElementById("closeBtn").addEventListener("click",closeMenu);
document.getElementById("backdrop").addEventListener("click",closeMenu);
document.addEventListener("keydown",e=>{
    if(e.key==="Escape") closeMenu();
});

// ---------- Selection state ----------

const list=document.getElementById("comboList");
const caption=document.getElementById("caption");
const comboDivs=[];
let selected=-1;          // index into combinations, -1 = none
let selectedEdge=null;    // edge tapped directly, if any

function showSelected(){
    if(selected>=0)         highlight(combinations[selected][1], combinations[selected][2], selected);
    else if(selectedEdge)   highlightEdge(selectedEdge);
    else                    clearHighlight();
}

function setCaption(text, placeholder){
    caption.innerHTML="";
    const span=document.createElement("span");
    if(placeholder) span.className="placeholder";
    span.textContent=text;
    caption.appendChild(span);
}

// "Shoulder Block → [swap to R] → Block & Turn", built as DOM nodes.
function sequenceNodes(moves, notes={}){
    const parts = [];
    moves.forEach((name,i)=>{
        if(i) parts.push(document.createTextNode(" → "));
        const step = document.createElement("span");
        step.className = "step";
        step.dataset.step = `m${i}`;
        step.textContent = name;
        parts.push(step);
        if(notes[name] && i < moves.length-1){
            const tag = document.createElement("span");
            tag.className = "note";
            tag.dataset.step = `t${i}`;
            tag.textContent = notes[name];
            parts.push(document.createTextNode(" → "), tag);
        }
    });
    return parts;
}

function select(index){
    selected=index;
    selectedEdge=null;

    comboDivs.forEach((div,i)=>div.classList.toggle("active", i===selected));

    if(selected<0){
        setCaption("Choose a combination from ☰", true);
    }else{
        const [id,moves,notes]=combinations[selected];
        caption.innerHTML="";
        caption.append(`${id}: `, ...sequenceNodes(moves, notes));
    }

    showSelected();
}

function selectEdge(edge){
    select(-1);
    selectedEdge=edge;
    const n=edge.data("count");
    setCaption(`${edge.data("source")} → ${edge.data("target")}: ${n} move${n===1?"":"s"}`);
    showSelected();
}

combinations.forEach(([id,moves,notes],i)=>{

    const div=document.createElement("div");
    div.className="combo";
    div.setAttribute("role","button");
    div.setAttribute("tabindex","0");

    div.innerHTML=`<div class="combo-title">Combination ${id}</div>`;
    const seq=document.createElement("div");
    seq.className="combo-moves";
    seq.append(...sequenceNodes(moves, notes));
    div.appendChild(seq);

    // Picking a combination selects it and hides the menu.
    div.addEventListener("click",()=>{
        select(i);
        closeMenu();
    });
    div.addEventListener("keydown",e=>{
        if(e.key==="Enter"||e.key===" "){ e.preventDefault(); div.click(); }
    });

    // Hover preview for mouse users only (visible beside the menu on desktop).
    div.addEventListener("pointerenter",e=>{
        if(e.pointerType==="mouse") highlight(moves, notes, i);
    });
    div.addEventListener("pointerleave",e=>{
        if(e.pointerType==="mouse") showSelected();
    });

    list.appendChild(div);
    comboDivs.push(div);
});

document.getElementById("prevBtn").addEventListener("click",()=>{
    select(selected<=0 ? combinations.length-1 : selected-1);
});
document.getElementById("nextBtn").addEventListener("click",()=>{
    select(selected<0 || selected>=combinations.length-1 ? 0 : selected+1);
});

// Tap empty space to clear; tap a line to see all of its moves.
cy.on("tap",e=>{
    if(e.target===cy) select(-1);
});
cy.on("tap","edge",e=>{
    if(e.target.hasClass("transition")) return;
    if(selectedEdge===e.target) select(-1);
    else selectEdge(e.target);
});

// ---------- Keep the graph fitted to the screen ----------

let resizeTimer;
function refit(){
    clearTimeout(resizeTimer);
    resizeTimer=setTimeout(applyLayout,150);
}

window.addEventListener("resize",refit);
window.addEventListener("orientationchange",refit);
compactQuery.addEventListener("change",refit);

select(-1);
applyLayout();

</script>

</body>
</html>
