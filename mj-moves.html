// Share a link to a combination: the phone's share sheet where there is one,
// otherwise copy it. Built from the combination rather than read from the
// address bar, which file:// pages may not have been able to update.
async function shareCombo(combo){
    const url = new URL(comboUrl(combo), location.href).href;
    const title = comboName(combo);
    if(navigator.share && matchMedia("(pointer: coarse)").matches){
        try{ await navigator.share({ title, url }); return; }
        catch(e){ if(e.name === "AbortError") return; }   // cancelled; else fall back to copying
    }
    try{
        await navigator.clipboard.writeText(url);
        showToast(`Link to ${title} copied`);
    }catch{
        window.prompt("Copy this link:", url);
    }
}

// ---------------------------------------------------------------------
// Random Combo: a random first move, then moves that each start where the
// previous one finished (an alternative ending, e.g. Basket keeping both
// hands, counts). No repeats and no hand changes. With "loops", the last
// move also leads back into the first.
// ---------------------------------------------------------------------

const MIN_RANDOM = 2, MAX_RANDOM = 5;

// Can move b follow move a without a hand change?
const canFollow = (a, b) => bridgeCost(a, b) === 0;

const shuffled = items => items.map(v=>[Math.random(), v]).sort((x,y)=>x[0]-y[0]).map(([,v])=>v);

function randomMoves(length, loops){
    const pool = MOVES
        .filter(m=>dom.showIntro.checked || m.level !== "intromediate")
        .map(m=>m.name);
    // depth-first in random order, so every choice is random but we never
    // pick a move that leaves no way to finish
    const extend = seq=>{
        const last = seq[seq.length-1];
        if(seq.length === length) return !loops || canFollow(last, seq[0]) ? seq : null;
        for(const m of shuffled(pool)){
            if(seq.includes(m) || !canFollow(last, m)) continue;
            const done = extend([...seq, m]);
            if(done) return done;
        }
        return null;
    };
    for(const first of shuffled(pool)){
        const done = extend([first]);
        if(done) return done;
    }
    return null;
}

{
    const LENGTH_KEY = "mj-moves:random-length", LOOPS_KEY = "mj-moves:random-loops";
    let length = Number(localStorage.getItem(LENGTH_KEY)) || 3;
    dom.loopCombo.checked = localStorage.getItem(LOOPS_KEY) !== "false";    // on by default

    const lengthButtons = [];
    for(let n = MIN_RANDOM; n <= MAX_RANDOM; n++){
        const btn = el("button", {type:"button", textContent:`${n}`});
        btn.setAttribute("role", "radio");
        btn.setAttribute("aria-label", `${n} moves`);
        btn.addEventListener("click", ()=>{
            length = n;
            localStorage.setItem(LENGTH_KEY, n);
            showLength();
        });
        lengthButtons.push(btn);
        dom.lengthGroup.append(btn);
    }
    const showLength = ()=>lengthButtons.forEach((b,i)=>b.setAttribute("aria-checked", i + MIN_RANDOM === length));
    showLength();

    dom.loopCombo.addEventListener("change", ()=>localStorage.setItem(LOOPS_KEY, dom.loopCombo.checked));

    dom.generateBtn.addEventListener("click", ()=>{
        const moves = randomMoves(length, dom.loopCombo.checked);
        if(!moves){
            showToast("No combination fits those settings - try another length");
            return;
        }
        state.preview = null;
        selectCombo({ id:null, caption:"Random", moves, loops:dom.loopCombo.checked });
        closeMenu();
    });
}

// ---------------------------------------------------------------------
// Shuffle Order: the current combination's moves in a different order,
// preferring orders that link without hand changes. And: swap a hand
// change for a real move along the same path (e.g. "swap to R", lr -> rr,
// becomes Break Through).
// ---------------------------------------------------------------------

function orderCost(moves, loops){
    let cost = 0;
    for(let i = 0; i+1 < moves.length; i++) cost += bridgeCost(moves[i], moves[i+1]);
    if(loops && moves.length > 1) cost += bridgeCost(moves[moves.length-1], moves[0]);
    return cost;
}

function* permutations(items){
    if(items.length <= 1){ yield items; return; }
    for(let i = 0; i < items.length; i++){
        const rest = [...items.slice(0,i), ...items.slice(i+1)];
        for(const p of permutations(rest)) yield [items[i], ...p];
    }
}

// How much less likely each hand change makes an order: 1 hand change is
// 1/4 as likely as none, 2 are 1/16, and so on.
const HAND_CHANGE_WEIGHT = 0.25;
const orderWeight = cost => HAND_CHANGE_WEIGHT ** cost;

function weightedPick(items, weightOf){
    const weights = items.map(weightOf);
    let r = Math.random() * weights.reduce((a,b)=>a+b, 0);
    for(let i = 0; i < items.length; i++){
        r -= weights[i];
        if(r <= 0) return items[i];
    }
    return items[items.length-1];
}

// "Avoid hand-changes": a different order with the fewest hand changes
// possible (random among the best). Exhaustive for short combinations;
// for long ones, many randomised "link where you can" attempts.
function shuffleOrderFewest(moves, loops){
    const current = moves.join(">");
    let best = Infinity, choices = [];
    const consider = order=>{
        if(order.join(">") === current) return;
        const cost = orderCost(order, loops);
        if(cost < best){ best = cost; choices = [order]; }
        else if(cost === best && choices.length < 500) choices.push(order);
    };
    if(moves.length <= 7){
        for(const p of permutations(moves)) consider(p);
    }else{
        for(let attempt = 0; attempt < 3000; attempt++){
            const left = shuffled(moves);
            const order = [left.pop()];
            while(left.length){
                const last = order[order.length-1];
                const costs = left.map(m=>bridgeCost(last, m));
                const min = Math.min(...costs);
                const pick = shuffled(left.filter((_,i)=>costs[i] === min))[0];
                left.splice(left.indexOf(pick), 1);
                order.push(pick);
            }
            consider(order);
        }
    }
    return choices.length ? { moves:shuffled(choices)[0], cost:best } : null;
}

// A different order of the same moves, chosen at random but weighted
// towards fewer hand changes: any order can come up, but each hand change
// makes it less likely. Short combinations weigh every possible order;
// long ones weigh a few hundred candidate orders.
function shuffleOrder(moves, loops){
    const current = moves.join(">");
    if(moves.length <= 7){
        const orders = [...permutations(moves)].filter(p=>p.join(">") !== current);
        if(!orders.length) return null;
        const pick = weightedPick(orders, p=>orderWeight(orderCost(p, loops)));
        return { moves:pick, cost:orderCost(pick, loops) };
    }
    // too many orders to weigh them all: build a few hundred candidates move
    // by move (favouring moves that link), then weigh those as above
    const candidates = [];
    for(let attempt = 0; attempt < 300; attempt++){
        const left = shuffled(moves);
        const order = [left.pop()];
        while(left.length){
            const last = order[order.length-1];
            const pick = weightedPick(left, m=>orderWeight(bridgeCost(last, m)));
            left.splice(left.indexOf(pick), 1);
            order.push(pick);
        }
        if(order.join(">") !== current) candidates.push(order);
    }
    if(!candidates.length) return null;
    const pick = weightedPick(candidates, p=>orderWeight(orderCost(p, loops)));
    return { moves:pick, cost:orderCost(pick, loops) };
}

const shownMoves = () => MOVES
    .filter(m=>dom.showIntro.checked || m.level !== "intromediate")
    .map(m=>m.name);

// Replace the first hand change that a real move can stand in for.
function replaceHandChange(combo){
    const used = new Set(combo.moves);
    for(const item of planMoves(combo.moves, combo)){
        if(item.kind !== "transition") continue;
        const options = shownMoves().filter(m=>{
            const st = MOVE_STATES.get(m);
            return !used.has(m) && st.from === item.from && st.to === item.to;
        });
        if(!options.length) continue;
        const pick = shuffled(options)[0];
        const moves = [...combo.moves];
        moves.splice(item.index + 1, 0, pick);
        return { moves, replaced:item.note, with:pick };
    }
    return null;
}

const handChanges = combo => planMoves(combo.moves, combo).filter(x=>x.kind === "transition").length;
const plural = (n, word) => `${n} ${word}${n === 1 ? "" : "s"}`;

function updateShuffleControls(){
    const combo = state.selection?.kind === "combo" ? state.selection.combo : null;
    dom.shuffleBtn.disabled = !combo || combo.moves.length < 2;
    dom.replaceBtn.disabled = !combo || !replaceHandChange(combo);
}

dom.shuffleBtn.addEventListener("click", ()=>{
    const combo = state.selection?.combo;
    if(!combo) return;
    const result = dom.avoidChanges.checked
        ? shuffleOrderFewest(combo.moves, combo.loops)
        : shuffleOrder(combo.moves, combo.loops);
    if(!result){ showToast("There's no other order for these moves"); return; }
    state.preview = null;
    const shuffledCombo = { id:null, caption:"Shuffled", moves:result.moves, loops:combo.loops };
    selectCombo(shuffledCombo);
    const n = handChanges(shuffledCombo);
    showToast(n ? `Shuffled: ${plural(n, "hand change")} needed` : "Shuffled: no hand changes needed");
    closeMenu();
});

{
    const key = "mj-moves:avoid-hand-changes";
    dom.avoidChanges.checked = localStorage.getItem(key) === "true";     // off by default
    dom.avoidChanges.addEventListener("change", ()=>localStorage.setItem(key, dom.avoidChanges.checked));
}

dom.replaceBtn.addEventListener("click", ()=>{
    const combo = state.selection?.combo;
    const result = combo && replaceHandChange(combo);
    if(!result) return;
    state.preview = null;
    selectCombo({ id:null, caption:"Custom", moves:result.moves, loops:combo.loops });
    showToast(`Replaced "${result.replaced}" with ${result.with}`);
    closeMenu();
});

// Show/hide intromediate moves (remembered per device; shown by default).
{
    const key = "mj-moves:show-intromediate";
    dom.showIntro.checked = localStorage.getItem(key) !== "false";
    applyLevelFilter();
    dom.showIntro.addEventListener("change", ()=>{
        localStorage.setItem(key, dom.showIntro.checked);
        updateShuffleControls();
        applyLevelFilter();
        applyLayout();          // labels changed size: re-fit the graph
    });
}

// Remember whether each foldable menu section was left open or folded.
for(const section of dom.menu.querySelectorAll("details.menu-section")){
    const key = `mj-moves:${section.id}-open`;
    const saved = localStorage.getItem(key);
    if(saved !== null) section.open = saved === "true";
    section.addEventListener("toggle", ()=>localStorage.setItem(key, section.open));
}

dom.menuBtn.addEventListener("click", openMenu);
dom.closeBtn.addEventListener("click", closeMenu);
dom.backdrop.addEventListener("click", closeMenu);
document.addEventListener("keydown", e=>{ if(e.key === "Escape") closeMenu(); });
dom.prevBtn.addEventListener("click", ()=>stepCombo(-1));
dom.nextBtn.addEventListener("click", ()=>stepCombo(+1));

// tap empty space to clear the combination
cy.on("tap", e=>{ if(e.target === cy) selectCombo(null); });

// Re-lay out whenever the graph area changes size (window resize,
// rotation, caption height) or the phone/desktop breakpoint flips.
let resizeTimer;
const relayoutSoon = ()=>{
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(applyLayout, 150);
};
new ResizeObserver(relayoutSoon).observe(dom.graph);
COMPACT.addEventListener("change", relayoutSoon);
SIDEBAR.addEventListener("change", ()=>{
    if(SIDEBAR.matches) closeMenu();
    renderCaption();
});

// Back/Forward move between combinations viewed
window.addEventListener("popstate", ()=>selectCombo(comboFromUrl(), {updateUrl:false}));

state.selection = (c=>c ? {kind:"combo", combo:c} : null)(comboFromUrl());
select(state.selection, {updateUrl:false});
applyLayout();
</script>
