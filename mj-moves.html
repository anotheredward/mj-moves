<script>
"use strict";

// =====================================================================
// Data
// =====================================================================

// Every move: where the hands start and finish, and its level. The 22
// beginner moves are the beginners block; the rest are intromediate.
// How each move feels: energy, distance between partners and smoothness
// (values in FEEL, below).
const MOVES = [
{ name:"Accordion",         from:"rr", to:"rr", level:"beginner", energy:"medium", distance:"normal", smoothness:"smooth" },
{ name:"Loop Throughs",     from:"bh", to:"bh", level:"beginner", energy:"medium", distance:"close", smoothness:"smooth" },
{ name:"Back Pass",         from:"rr", to:"lr", level:"beginner", energy:"low", distance:"close", smoothness:"smooth" },
{ name:"Manhattan",         from:"lr", to:"lr", level:"beginner", energy:"medium", distance:"close", smoothness:"normal" },
{ name:"Basket",            from:"bh", to:"lr", level:"beginner", energy:"medium", distance:"close", smoothness:"normal" },
{ name:"New Yorker",        from:"lr", to:"lr", level:"beginner", energy:"high", distance:"far", smoothness:"sharp" },
{ name:"Block & Turn",      from:"rr", to:"rr", level:"beginner", energy:"medium", distance:"normal", smoothness:"normal" },
{ name:"Outside Turn",      from:"lr", to:"lr", level:"beginner", energy:"high", distance:"far", smoothness:"sharp" },
{ name:"Break Through",     from:"lr", to:"rr", level:"beginner", energy:"medium", distance:"close", smoothness:"smooth" },
{ name:"Short First Move",  from:"lr", to:"lr", level:"beginner", energy:"medium", distance:"close", smoothness:"normal" },
{ name:"Catapult",          from:"rr", to:"lr", level:"beginner", energy:"high", distance:"far", smoothness:"sharp" },
{ name:"Shoulder Block",    from:"rr", to:"lr", level:"beginner", energy:"medium", distance:"close", smoothness:"normal" },
{ name:"Figure Of 8",       from:"lr", to:"rr", level:"beginner", energy:"high", distance:"normal", smoothness:"sharp" },
{ name:"Squeezebox",        from:"bh", to:"lr", level:"beginner", energy:"medium", distance:"normal", smoothness:"normal" },
{ name:"Hatchback",         from:"lr", to:"lr", level:"beginner", energy:"medium", distance:"far", smoothness:"normal" },
{ name:"Step Across",       from:"lr", to:"lr", level:"beginner", energy:"low", distance:"normal", smoothness:"smooth" },
{ name:"Hook Turn",         from:"rr", to:"lr", level:"beginner", energy:"medium", distance:"far", smoothness:"sharp" },
{ name:"Travelling Return", from:"lr", to:"lr", level:"beginner", energy:"medium", distance:"normal", smoothness:"normal" },
{ name:"Key Turn",          from:"rr", to:"lr", level:"beginner", energy:"medium", distance:"normal", smoothness:"normal" },
{ name:"Wurlitzer",         from:"lr", to:"lr", level:"beginner", energy:"medium", distance:"far", smoothness:"sharp" },
{ name:"Left Side Change",  from:"lr", to:"rr", level:"beginner", energy:"high", distance:"far", smoothness:"normal" },
{ name:"Yoyo",              from:"rr", to:"rr", level:"beginner", energy:"medium", distance:"normal", smoothness:"sharp" },
{ name:"Aerial Yoyo",       from:"rr", to:"rr", level:"intromediate", energy:"high", distance:"normal", smoothness:"sharp" },
{ name:"Shoulder Wrap",     from:"rr", to:"lr", level:"intromediate", energy:"medium", distance:"close", smoothness:"normal" },
{ name:"Comb",              from:"rr", to:"rr", level:"intromediate", energy:"medium", distance:"close", smoothness:"sharp" },
{ name:"Slide Break",       from:"bh", to:"rr", level:"intromediate", energy:"medium", distance:"normal", smoothness:"normal" },
{ name:"First Move",        from:"lr", to:"lr", level:"intromediate", energy:"medium", distance:"close", smoothness:"normal" },
{ name:"Wrap & Throw",      from:"rl", to:"lr", level:"intromediate", energy:"medium", distance:"close", smoothness:"smooth" },
{ name:"Short Manhattan",   from:"lr", to:"lr", level:"intromediate", energy:"medium", distance:"close", smoothness:"normal" }
];

// How to get from one move into the next when the first finishes in a
// different hand position from where the next starts. Tried in this order:
//   1. a variation of the first move that finishes elsewhere (end)
//   2. a variation of the next move that starts elsewhere (start)
//   3. a general hand swap between the two positions
//   4. otherwise a plain "hand change" (and a console warning)
// We prefer moves that link without any of these.
//
// Move variations: how a particular move changes grip (traces and offers
// depend on the move). "ending: true" means it's really the move ending
// differently (shown as a tag on the move); the others are shown as a hand
// change between the moves.
const MOVE_VARIATIONS = [
{ move:"Basket",           end:"bh",   note:"keep both", ending:true },
{ move:"Short First Move", end:"bh",   note:"trace R" },
{ move:"Accordion",        start:"lr", note:"offer L" }
];

// General hand changes, usable after any move (the lead makes them; on the
// follow's side their hand is moved). Takes and drops work almost anywhere.
// [from position, to position, note]
const HAND_SWAPS = [
["bh", "lr", "drop R"],
["bh", "rl", "drop L"],
["lr", "bh", "take"],          // could be an offer or trace, depending on the move
["lr", "rr", "swap to R"],
["rr", "lr", "swap to L"],
["rl", "rr", "swap to R"],
["rr", "rl", "swap to L"],
["rl", "bh", "offer L"],
["rl", "lr", "change both"],
["lr", "rl", "change both"],
["rr", "bh", "drop, take both"],
["bh", "rr", "drop both, take R"]
];

const COMBINATIONS = [
{ id:1,  moves:["Basket","Manhattan","Step Across"] },
{ id:2,  moves:["Short First Move","Break Through","Hook Turn"] },
{ id:3,  moves:["Yoyo","Back Pass","Figure Of 8"] },
{ id:4,  moves:["Accordion","Shoulder Block","Block & Turn"] },
{ id:5,  moves:["Manhattan","Left Side Change","Key Turn"] },
{ id:6,  moves:["Step Across","Wurlitzer","Short First Move"] },
{ id:7,  moves:["Basket","Loop Throughs","Hatchback"] },
{ id:8,  moves:["Squeezebox","Figure Of 8","Catapult"] },
{ id:9,  moves:["Manhattan","Travelling Return","New Yorker","Outside Turn"] },
{ id:10, moves:["Shoulder Block","Accordion","Yoyo"] },
{ id:11, moves:["Short First Move","Loop Throughs","New Yorker"] },
{ id:12, moves:["Catapult","Break Through","Block & Turn"] },
{ id:13, moves:["Squeezebox","Left Side Change","Back Pass"] }
];

// Every beginner move once, in the shortest order: two hand changes, and
// Basket keeps both hands so Squeezebox can follow.
const SUPER_COMBO = {
    id:null,
    title:"Beginner's Super Combo",
    caption:"Super",
    moves:["Accordion","Yoyo","Back Pass","Figure Of 8","Catapult","Break Through",
           "Block & Turn","Shoulder Block","New Yorker","Hatchback","Outside Turn",
           "Travelling Return","Left Side Change","Key Turn","Manhattan","Step Across",
           "Wurlitzer","Short First Move","Loop Throughs","Basket","Squeezebox","Hook Turn"]
};

const STATES = ["rr","lr","rl","bh"];
const MOVE_STATES = new Map(MOVES.map(m=>[m.name, m]));      // name -> {name, from, to, level}
const LEVELS = ["beginner", "intromediate"];
// Each scale, lowest to highest
// (a subjective feel, for choosing moves to suit the music)
const FEEL = {
    energy:     ["low", "medium", "high"],
    distance:   ["close", "normal", "far"],
    smoothness: ["smooth", "normal", "sharp"]
};
const FEEL_EMOJI = {
    energy:     { low:"🌙", medium:"🙂", high:"🔥" },
    distance:   { close:"🫂", normal:"🤝", far:"↔️" },
    smoothness: { smooth:"🌊", normal:"〰️", sharp:"⚡" }
};
// Does going from move a into move b need a hand change?
const needsHandChange = (a, b) => MOVE_STATES.get(a).to !== MOVE_STATES.get(b).from;

// How move a leads into move b:
//   {kind:"link"}                         they already link
//   {kind:"ending", to, note}             a finishes differently (e.g. keep both)
//   {kind:"change", note, known}          a hand change between them
function bridge(a, b){
    const from = MOVE_STATES.get(a).to, to = MOVE_STATES.get(b).from;
    if(from === to) return { kind:"link" };
    const end = MOVE_VARIATIONS.find(v=>v.move === a && v.end === to);
    if(end?.ending) return { kind:"ending", to, note:end.note };
    if(end) return { kind:"change", note:end.note, known:true };
    const start = MOVE_VARIATIONS.find(v=>v.move === b && v.start === from);
    if(start) return { kind:"change", note:start.note, known:true };
    const swap = HAND_SWAPS.find(([f,t])=>f === from && t === to);
    if(swap) return { kind:"change", note:swap[2], known:true };
    return { kind:"change", note:"hand change", known:false };
}

// How much we'd rather not use a bridge: linking moves are best.
const bridgeCost = (a, b)=>{
    const br = bridge(a, b);
    return br.kind === "link" || br.kind === "ending" ? 0 : br.known ? 1 : 3;
};
const sameMoves = (a, b) => a.length === b.length && a.every((m,i)=>m === b[i]);

// How a sequence of moves is danced: where each move really ends (it may
// use an alternative ending so the next move can follow), and the hand
// changes needed in between. Returns, in order:
//   {kind:"move", index, name, from, to, variant}   variant: e.g. "keep both"
//   {kind:"transition", index, from, to, note}      after move `index`
function planMoves(moves, {loops=false}={}){
    const plan = [];
    moves.forEach((name,i)=>{
        const st = MOVE_STATES.get(name);
        if(!st) return;
        const next = MOVE_STATES.get(moves[i+1]);
        // a looping combination's last move leads back into the first, so it
        // may need its alternative ending too (Basket keeping both hands)
        const wrapTo = loops && i === moves.length-1 ? MOVE_STATES.get(moves[0]) : null;
        const targetName = next ? moves[i+1] : wrapTo ? moves[0] : null;
        const br = targetName ? bridge(name, targetName) : { kind:"link" };
        const to = br.kind === "ending" ? br.to : st.to;
        const variant = br.kind === "ending" ? br.note : null;
        plan.push({ kind:"move", index:i, name, from:st.from, to, variant });
        if(next && br.kind === "change"){
            plan.push({ kind:"transition", index:i, from:to, to:next.from, note:br.note });
        }
    });
    return plan;
}

// Catch typos early: a misspelt move would otherwise be skipped silently.
(function validateData(){
    for(const m of MOVES){
        if(!LEVELS.includes(m.level)) console.warn(`Move "${m.name}": unknown level "${m.level}"`);
        for(const [key, values] of Object.entries(FEEL)){
            if(!values.includes(m[key])) console.warn(`Move "${m.name}": unknown ${key} "${m[key]}"`);
        }
    }
    for(const v of MOVE_VARIATIONS){
        const m = MOVE_STATES.get(v.move);
        if(!m) console.warn(`Move variation: unknown move "${v.move}"`);
        else if(m.to === v.end || m.from === v.start) console.warn(`Move variation for ${v.move} doesn't change anything`);
    }
    const beginner = MOVES.filter(m=>m.level === "beginner").map(m=>m.name);
    if(SUPER_COMBO.moves.length !== beginner.length || !beginner.every(m=>SUPER_COMBO.moves.includes(m))){
        console.warn("Beginner's Super Combo doesn't cover every beginner move exactly once");
    }
    for(const combo of [...COMBINATIONS, SUPER_COMBO]){
        combo.moves.forEach((name,i)=>{
            if(!MOVE_STATES.has(name)){
                console.warn(`Combination ${combo.id}: unknown move "${name}"`);
                return;
            }
            const next = combo.moves[i+1];
            if(next && MOVE_STATES.has(next) && bridge(name, next).known === false){
                console.warn(`Combination ${combo.id}: no known way from ${name} into ${next} (add a variation or hand swap)`);
            }
        });
    }
})();

// =====================================================================
// Look & layout constants (colours/fonts match the CSS tokens)
// =====================================================================

// All colours and the font come from the CSS tokens at the top of the page.
const ROOT_STYLE = getComputedStyle(document.documentElement);
const token = name => ROOT_STYLE.getPropertyValue(`--${name}`).trim();
const FONT = token("font");
const COLOR = {
    ink: token("ink"),         inkFaded: token("ink-faded"),
    line: token("line"),       lineFaded: token("line-faded"),
    accent: token("accent"),   accentText: token("accent-text"),
    canvas: token("canvas"),
    nodeBorder: token("node-border"), emptySlot: token("empty-slot"),
    lead: token("lead"),       follow: token("follow")
};
const LINE_HEIGHT = 1.3;           // label line height, as a multiple of font size
const LABEL_SIZE = { normal:15, compact:19 };

const COMPACT = window.matchMedia("(max-width:700px), (max-height:500px)");
// wide screens show the combinations in a permanent sidebar (see the CSS)
const SIDEBAR = window.matchMedia("(min-width:1000px) and (min-height:501px)");
const REDUCED_MOTION = window.matchMedia("(prefers-reduced-motion: reduce)");
const isCompact = () => COMPACT.matches;
const labelFontSize = () => isCompact() ? LABEL_SIZE.compact : LABEL_SIZE.normal;
const fitPadding = () => isCompact() ? 20 : 50;

// =====================================================================
// DOM & app state
// =====================================================================

const dom = Object.fromEntries(
    ["container","graph","cy","caption","comboTitle","stepHighlight","menu","menuBtn","closeBtn","classSection","showIntro","superSlot","toast","randomSection","lengthGroup","loopCombo","generateBtn","favBtn","shareBtn","favList","favCount","movePanel","shuffleBtn","replaceBtn","avoidChanges",
     "backdrop","comboList","buildSection","buildSeq","buildUndo","buildClear","buildFromCurrent","buildMoves",
     "callerBtn","callerPage","callerBody","callerClose","flashBtn","flashPage","flashBody","flashClose","statsFx","statsBtn","statsPage","statsBody","statsClose","statsTip","prevBtn","nextBtn"].map(id=>[id, document.getElementById(id)])
);

// selection: the combination the user picked ({kind:"combo", combo} | null)
// preview:   a combination hovered in the menu, shown on the graph only
const state = { selection:null, preview:null };

// =====================================================================
// Node icons: hand positions seen from above
// =====================================================================
// Each node is a 2x2 grid. Top row = follow (fingers pointing down),
// bottom row = lead (fingers pointing up). Viewed from above with the
// couple facing each other, the squares are always:
//
//     follow's R | follow's L
//     lead's L   | lead's R
//
// Each node fills the squares for the hands that are joined.

const HAND_SLOTS = {
    tl:{ col:0, row:0, letter:"R" },
    tr:{ col:1, row:0, letter:"L" },
    bl:{ col:0, row:1, letter:"L" },
    br:{ col:1, row:1, letter:"R" }
};

const NODE_HANDS = {
    lr:["tl","bl"],
    rr:["tl","br"],
    rl:["tr","br"],
    bh:["tl","tr","bl","br"]
};

const NODE_SIZE = 84;            // width/height of a hand-position node
const CELL = 46, GAP = 4, PAD = 2;
const ICON_SIZE = 2*CELL + GAP + 2*PAD;

// A hand with fingers pointing up, drawn in a CELL x CELL box.
function handShape(thumbRight, color){
    const fingers = [
        {x:10.0, top:8},
        {x:16.8, top:4},
        {x:23.6, top:5},
        {x:30.4, top:9}
    ].map(f=>`<rect x="${f.x}" y="${f.top}" width="5.6" height="${26-f.top}" rx="2.8"/>`).join("");
    const thumb = thumbRight
        ? `<ellipse cx="38.5" cy="29" rx="3.6" ry="7.5" transform="rotate(32 38.5 29)"/>`
        : `<ellipse cx="7.5" cy="29" rx="3.6" ry="7.5" transform="rotate(-32 7.5 29)"/>`;
    return `<g fill="${color}">${fingers}${thumb}<rect x="9.5" y="21" width="27" height="21" rx="7"/></g>`;
}

function slotSvg(slot, filled){
    const x = PAD + slot.col*(CELL+GAP);
    const y = PAD + slot.row*(CELL+GAP);
    if(!filled){
        return `<rect x="${x+3}" y="${y+3}" width="${CELL-6}" height="${CELL-6}" rx="6"
            fill="none" stroke="${COLOR.emptySlot}" stroke-width="1.2" stroke-dasharray="1.5 3" stroke-linecap="round"/>`;
    }
    const thumbRight = slot.col === 0;      // thumbs point toward the centre line
    const fingersDown = slot.row === 0;     // follow's hands: the up-shape flipped
    const color = fingersDown ? COLOR.follow : COLOR.lead;
    const shape = fingersDown
        ? `<g transform="translate(0 ${CELL}) scale(1 -1)">${handShape(thumbRight, color)}</g>`
        : handShape(thumbRight, color);
    const textY = fingersDown ? 18 : 38;    // centre of the palm
    return `<g transform="translate(${x} ${y})">${shape}
        <text x="23" y="${textY}" text-anchor="middle" font-family="${FONT.replace(/"/g,"'")}"
            font-size="15" font-weight="bold" fill="white">${slot.letter}</text></g>`;
}

const nodeIcon = (()=>{
    const cache = new Map();
    return id=>{
        if(!cache.has(id)){
            const filled = new Set(NODE_HANDS[id]);
            const body = Object.entries(HAND_SLOTS)
                .map(([key,slot])=>slotSvg(slot, filled.has(key))).join("");
            const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${ICON_SIZE}" height="${ICON_SIZE}"
                viewBox="0 0 ${ICON_SIZE} ${ICON_SIZE}">${body}</svg>`;
            cache.set(id, "data:image/svg+xml;utf8," + encodeURIComponent(svg));
        }
        return cache.get(id);
    };
})();

// =====================================================================
// Graph elements: one node per hand position, one edge per (from, to)
// pair carrying the list of moves between them
// =====================================================================

function buildElements(){
    const groups = new Map();   // "from|to" -> {from, to, moves:[]}
    for(const {name, from, to} of MOVES){
        const key = `${from}|${to}`;
        if(!groups.has(key)) groups.set(key, {from, to, moves:[]});
        groups.get(key).moves.push(name);
    }
    const nodes = STATES.map(id=>({ data:{ id, icon:nodeIcon(id) }, classes:"state" }));
    const edges = [...groups].map(([key,{from,to,moves}])=>{
        const label = moves.join("\n");
        return { data:{
            id:`e:${key}`, source:from, target:to,
            allMoves:moves,                    // every move on this line
            moves, count:moves.length,         // the ones shown (see applyLevelFilter)
            fullLabel:label, edgeLabel:label,
            // a reverse edge exists: bow the pair apart (amount set per layout)
            hasReverse: from !== to && groups.has(`${to}|${from}`),
            bow:0, loopDirection:0, mx:0, my:0
        }};
    });
    return [...nodes, ...edges];
}

// =====================================================================
// Node placement
// =====================================================================
// A 2x2 grid with lr (the busiest state) in the top-left corner:
//
//    lr ---- rr      rr<->lr bow apart along the top edge
//    |  \    |       rl->lr runs down the left side
//    |    \  |       bh->rr runs down the right side
//    rl     bh       bh->lr is the only diagonal, so no lines cross
//
// Each self-loop (and its list) points out of its corner. Grid size
// adapts to the screen shape; on phones the nodes sit closer together.

const LOOPS            = { lr:-45, rr:45, bh:135, rl:-135 };
const LOOPS_VERTICAL   = { lr:0, rr:0, bh:180, rl:180 };     // portrait: short on width
const LOOPS_HORIZONTAL = { lr:-90, rr:90, bh:90, rl:-90 };   // landscape: short on height

// bow:   how far the rr<->lr pair curve apart
// shift: move a line's label along its line (fraction of its length,
//        + towards the target) so labels don't collide
function grid(w, h, loop=LOOPS, {bow=140, shift={}}={}){
    return {
        pos:{ lr:{x:0,y:0}, rr:{x:w,y:0}, rl:{x:0,y:h}, bh:{x:w,y:h} },
        loop, bow, shift
    };
}

const LAYOUTS = {
    wide:        grid(560, 420),
    tall:        grid(420, 560),
    // landscape phones: a gentler bow keeps the lower list clear of the diagonal
    wideCompact: grid(460, 300, LOOPS_HORIZONTAL, { bow:120, shift:{ "lr|rr":0.1 } }),
    // portrait phones: move the vertical labels away from the diagonal's label
    tallCompact: grid(260, 560, LOOPS_VERTICAL, { bow:100, shift:{ "rl|lr":-0.25, "bh|rr":0.25 } })
};

function currentLayout(){
    const shape = dom.cy.clientHeight > dom.cy.clientWidth ? "tall" : "wide";
    return LAYOUTS[isCompact() ? `${shape}Compact` : shape];
}

// =====================================================================
// Cytoscape
// =====================================================================

const cy = cytoscape({
    container: dom.cy,
    elements: buildElements(),
    layout: { name:"preset" },
    style: [
        { selector:"node.state", style:{
            "shape":"round-rectangle",
            "width":NODE_SIZE, "height":NODE_SIZE,
            "background-color":"white",
            "border-width":1, "border-color":COLOR.nodeBorder,
            "background-image":"data(icon)",
            "background-fit":"contain",
            "background-clip":"none",
            "background-width":"92%", "background-height":"92%"
        }},
        { selector:"edge", style:{
            "label":"data(edgeLabel)",
            "curve-style":"bezier",
            "text-wrap":"wrap",
            "text-max-width":"1000px",       // break only between moves, never inside one
            "text-justification":"center",   // "left" mis-positions wrapped text in Cytoscape
            "line-height":LINE_HEIGHT,
            "font-size":LABEL_SIZE.normal,
            "font-family":FONT,
            "color":COLOR.ink,
            "text-rotation":"none",
            "text-background-shape":"roundrectangle",
            "text-background-opacity":1,
            "text-background-color":COLOR.canvas,   // box is invisible
            "text-background-padding":4,
            "source-endpoint":"outside-to-node",
            "target-endpoint":"outside-to-node",
            "target-arrow-shape":"triangle",
            "line-color":COLOR.line,
            "target-arrow-color":COLOR.line,
            "width":"mapData(count, 1, 10, 1.5, 4)",   // thicker = more moves
            "arrow-scale":1.2
        }},
        { selector:"edge:simple", style:{
            "curve-style":"unbundled-bezier",
            "control-point-distances":"data(bow)",
            "control-point-weights":0.5,
            "text-margin-x":"data(mx)",
            "text-margin-y":"data(my)"
        }},
        { selector:"edge:loop", style:{
            "loop-direction":"data(loopDirection)",
            "loop-sweep":"50deg",
            "control-point-step-size":110,
            "text-margin-x":"data(mx)",     // list sits beyond the loop
            "text-margin-y":"data(my)"
        }},
        { selector:"edge.compact", style:{ "font-size":LABEL_SIZE.compact }},
        { selector:"edge.dim", style:{
            // in the background, but the structure stays visible
            "line-color":COLOR.lineFaded,
            "target-arrow-color":COLOR.lineFaded,
            "color":COLOR.inkFaded
        }},
        { selector:".highlight", style:{
            "line-color":COLOR.accent,
            "target-arrow-color":COLOR.accent,
            "width":"mapData(count, 1, 10, 3.5, 6)",
            "color":COLOR.accentText,
            "font-weight":"bold",
            "z-index":999
        }},
        { selector:"edge.transition", style:{
            // label a quarter of the way along, clear of nearby move labels
            "label":"",
            "source-label":"data(edgeLabel)",
            "source-text-offset":"data(labelOffset)",
            "line-style":"dashed",
            "line-dash-pattern":[8,6],
            "width":2.5,
            "font-style":"italic",
            "font-weight":"normal"
        }},
        { selector:".filtered", style:{ "display":"none" }},
        { selector:"edge.filtered.highlight, node.filtered.in-use", style:{ "display":"element" }},
        { selector:"node.pulse", style:{
            "shape":"ellipse",
            "width":"data(size)", "height":"data(size)",
            "background-color":"white",
            "underlay-color":"white",        // soft glow
            "underlay-padding":4,
            "underlay-opacity":0.45,
            "underlay-shape":"ellipse",
            "opacity":0,
            "events":"no",
            "z-index":1000
        }}
    ]
});

// --- Cytoscape internals ------------------------------------------------
// The comet and the per-line highlight need each edge's drawn curve and
// label box, which Cytoscape keeps privately. This is why the library
// version is pinned; if it's upgraded, these two functions are what to check.

// Quadratic curve chain [start, control, end, control, end, ...] as x,y
// pairs, or null if the edge hasn't been drawn yet.
function edgeCurves(edge){
    const pts = edge._private.rscratch?.allpts;
    return pts && pts.length >= 6 ? pts : null;
}

// Label box in model coordinates ("main" label, or "source" label).
function labelBox(edge, which="main"){
    const box = edge._private.labelBounds?.[which];
    return box && box.w > 0 && box.h > 0 ? box : null;
}

const graphElements = () => cy.elements().not(".pulse");

// =====================================================================
// Labels & fitting
// =====================================================================

const measureCtx = document.createElement("canvas").getContext("2d");

// Push each loop's label outward (in the loop's direction) by half its
// size, so it sits beyond the loop instead of covering it.
function offsetLoopLabels(){
    const size = labelFontSize();
    cy.edges(":loop").forEach(edge=>{
        const lines = edge.data("edgeLabel").split("\n");
        measureCtx.font = `${edge.hasClass("highlight") ? "bold " : ""}${size}px ${FONT}`;
        const w = Math.max(...lines.map(l=>measureCtx.measureText(l).width)) + 10;
        const h = lines.length * size * LINE_HEIGHT + 10;
        const rad = edge.data("loopDirection") * Math.PI / 180;
        const snap = v => Math.abs(v) < 0.1 ? 0 : Math.sign(v);
        edge.data({
            mx: snap(Math.sin(rad)) * (w/2 + 12),
            my: snap(-Math.cos(rad)) * (h/2 + 12)
        });
    });
}

function updateLabels(){
    cy.edges().toggleClass("compact", isCompact());
    offsetLoopLabels();
    // Cytoscape caches each label's box and doesn't always notice when the
    // text changes, so new (bold) text gets drawn into the old, narrower box
    // and clipped. Drop the cached boxes so they're measured again.
    cy.edges().dirtyBoundingBoxCache();
}

// The view is fitted once per layout with every full list showing; that
// viewport is the baseline. A highlighted label can poke out of it (it's
// bold), in which case we zoom out for that view, and return to the
// baseline afterwards rather than ratcheting smaller each time.
let baseViewport = null;

function fitView(){
    cy.viewport(baseViewport);
    const box = graphElements().renderedBoundingBox();
    const pad = 4;
    if(box.x1 < pad || box.y1 < pad || box.x2 > cy.width() - pad || box.y2 > cy.height() - pad){
        cy.fit(graphElements(), fitPadding());
    }
}

let layout = LAYOUTS.wide;

function applyLayout(){
    layout = currentLayout();
    cy.nodes(".state").positions(node=>layout.pos[node.id()]);
    cy.edges(":loop").forEach(edge=>edge.data("loopDirection", layout.loop[edge.data("source")]));
    cy.edges(":simple").not(".transition").forEach(edge=>{
        const {source, target} = edge.data();
        if(edge.data("hasReverse")) edge.data("bow", layout.bow);
        // label shift along the (straight) line, applied as a margin
        const f = layout.shift[`${source}|${target}`] || 0;
        const a = layout.pos[source], b = layout.pos[target];
        edge.data({ mx:(b.x-a.x)*f, my:(b.y-a.y)*f });
    });
    cy.resize();
    resetGraph();
    updateLabels();
    cy.fit(graphElements(), fitPadding());
    baseViewport = { zoom:cy.zoom(), pan:{...cy.pan()} };
    render();
}

// =====================================================================
// Highlighting
// =====================================================================

// Show or hide the intromediate moves: each line keeps only the moves
// shown; a line with none left is hidden, and so is a hand position with
// no lines left (unless the highlighted combination uses them).
function applyLevelFilter(){
    const showIntro = dom.showIntro.checked;
    cy.edges().not(".transition").forEach(edge=>{
        const moves = edge.data("allMoves")
            .filter(name=>showIntro || MOVE_STATES.get(name).level !== "intromediate");
        const label = moves.join("\n");
        edge.data({ moves, count:Math.max(moves.length, 1), fullLabel:label, edgeLabel:label });
        edge.toggleClass("filtered", moves.length === 0);
    });
    // a hand position with no lines left is hidden too
    cy.nodes(".state").forEach(node=>{
        node.toggleClass("filtered", node.connectedEdges().not(".filtered, .transition").length === 0);
    });
}

function resetGraph(){
    cy.edges(".transition").remove();
    cy.elements().removeClass("dim highlight in-use");
    cy.edges().forEach(edge=>edge.data("edgeLabel", edge.data("fullLabel")));
}

function lightUp(edge, label){
    edge.removeClass("dim").addClass("highlight");
    edge.data("edgeLabel", label);
}

// Curve for a connector s -> t that doesn't lie on an existing line
// between the same two states (in either direction).
// Returns {bow, labelAt}: labelAt = how far along the label sits (0-1).
function connectorShape(s, t, note=""){
    const taken = [];
    cy.edges(":simple").not(".transition").forEach(e=>{
        if(e.data("source") === s && e.data("target") === t) taken.push(e.data("bow"));
        if(e.data("source") === t && e.data("target") === s) taken.push(-e.data("bow"));
    });
    // Of the curves that keep clear of existing lines, pick the one that
    // crosses the fewest labels. Cytoscape puts the control point `bow`
    // out from the midpoint; sample that curve against the label boxes.
    const a = cy.$id(s).position(), b = cy.$id(t).position();
    const len = Math.hypot(b.x-a.x, b.y-a.y) || 1;
    const nx = -(b.y-a.y)/len, ny = (b.x-a.x)/len;
    const boxes = labelBoxes();
    // the connector's own label must also stay off the hand-position nodes
    const nodeBoxes = cy.nodes(".state").filter(n=>n.visible()).map(n=>n.boundingBox({includeLabels:false}));
    // the connector's own label sits about a quarter of the way along
    const size = labelFontSize();
    measureCtx.font = `italic ${size}px ${FONT}`;
    const halfW = measureCtx.measureText(note).width/2 + 6, halfH = size*LINE_HEIGHT/2 + 4;
    const cost = (bow, labelAt)=>{
        const qx = (a.x+b.x)/2 + nx*bow, qy = (a.y+b.y)/2 + ny*bow;
        const at = t=>{ const u = 1-t; return [u*u*a.x + 2*u*t*qx + t*t*b.x, u*u*a.y + 2*u*t*qy + t*t*b.y]; };
        let n = 0;
        for(let k=2; k<=18; k++){
            const [x,y] = at(k/20);
            if(boxes.some(r=>x > r.x1 && x < r.x2 && y > r.y1 && y < r.y2)) n++;
        }
        // the label's overlap, as a share of its area: with no clear spot
        // (crowded phone layouts) the least-covered one wins, and covering
        // a hand-position node is worse than touching another label
        const [lx,ly] = at(labelAt);
        const covered = r=>Math.max(0, Math.min(lx+halfW, r.x2) - Math.max(lx-halfW, r.x1))
                         * Math.max(0, Math.min(ly+halfH, r.y2) - Math.max(ly-halfH, r.y1)) / (4*halfW*halfH);
        const overLabels = boxes.reduce((sum, r)=>sum + covered(r), 0);
        const overNodes = nodeBoxes.reduce((sum, r)=>sum + covered(r), 0);
        if(overLabels || overNodes) n += 10 + 10*overLabels + 20*overNodes;
        return n + Math.abs(labelAt - 0.25);   // prefer a quarter of the way along
    };
    const free = [0, 90, -90, 180, -180].filter(bw=>taken.every(x=>Math.abs(x-bw) >= 60));
    let best = { bow:free[0] ?? 0, labelAt:0.25 }, bestCost = Infinity;
    for(const bow of free){
        for(const labelAt of [0.25, 0.15, 0.35, 0.45, 0.55, 0.65, 0.75, 0.85]){
            const c = cost(bow, labelAt);
            if(c < bestCost){ bestCost = c; best = {bow, labelAt}; }
        }
    }
    return best;
}

// A dashed connector for a hand transition (exists only while shown). It's
// numbered between the moves either side: after step 9 it's "9.5".
function addTransition(from, to, note, index){
    const a = cy.$id(from).position(), b = cy.$id(to).position();
    const label = `${index + 1}.5 ${note}`;
    const {bow, labelAt} = connectorShape(from, to, label);
    return cy.add({
        group:"edges",
        data:{
            id:`transition-${index}`,
            source:from, target:to,
            moves:[], count:1,
            edgeLabel:label, fullLabel:label,
            bow,
            // Cytoscape measures this from where the line leaves the source
            // node's edge, not its centre, so take off half a node
            labelOffset:Math.max(0, Math.hypot(b.x-a.x, b.y-a.y) * labelAt - NODE_SIZE/2),
            loopDirection:0, mx:0, my:0
        },
        classes:"transition highlight"
    })[0];   // the edge itself, not the collection cy.add() returns
}

// Light up a combination. Each of its edges shows only the combination's
// moves, numbered; a dashed connector bridges any hand transition.
// Returns the steps in execution order: {edge, kind, index, line}.
// Move names are always shown, however many share a line.

function showCombo(combo){
    cy.edges().addClass("dim");
    const plan = planMoves(combo.moves, combo);
    // Each move is drawn on the line for where it really goes, so a move
    // with an alternative ending (Basket keeping both hands) sits on that line.
    const onEdge = new Map();   // edge -> [{n, text, step}]
    const steps = [];
    for(const item of plan){
        if(item.kind === "move"){
            const edge = cy.$id(`e:${item.from}|${item.to}`)[0];
            if(!edge) continue;
            const step = { edge, kind:"move", index:item.index };
            if(!onEdge.has(edge)) onEdge.set(edge, []);
            onEdge.get(edge).push({ n:item.index+1, text:`${item.name}${item.variant ? ` · ${item.variant}` : ""}`, step });
            steps.push(step);
        }else{
            steps.push({ kind:"transition", index:item.index, item });   // edge added below
        }
    }
    onEdge.forEach((entries,edge)=>{
        entries.forEach(e=>{ e.step.line = `${e.n}. `; });
        lightUp(edge, entries.map(e=>`${e.n}. ${e.text}`).join("\n"));
    });
    // Connectors last, so they can steer clear of the labels just set.
    updateLabels();
    graphElements().boundingBox();      // re-measure label boxes now
    for(const step of steps){
        if(step.kind !== "transition") continue;
        step.edge = addTransition(step.item.from, step.item.to, step.item.note, step.index);
        delete step.item;
    }
    return steps;
}

// Redraw the graph for the current preview/selection.
function render(){
    const view = state.preview || state.selection;
    resetGraph();
    let steps = [];
    if(view?.kind === "combo") steps = showCombo(view.combo);
    // positions the combination passes through stay visible even if hidden
    cy.edges(".highlight").connectedNodes().addClass("in-use");
    updateLabels();
    if(baseViewport) fitView();
    startPulse(steps, view);
}

// =====================================================================
// Pulse: a comet travelling the highlighted path
// =====================================================================
// A white comet glides along the highlighted lines in execution order,
// pauses, and repeats. The step it's on is lit up in the caption and on
// its line of the graph label.

const PULSE = {
    speed: 320,          // model units per second
    pause: 700,          // ms between laps
    spacing: 7,          // distance between tail dots
    tail: [              // head first
        {size:15, alpha:1},    {size:13, alpha:0.85}, {size:12, alpha:0.7},
        {size:11, alpha:0.55}, {size:10, alpha:0.42}, {size:9,  alpha:0.3},
        {size:8,  alpha:0.2},  {size:7,  alpha:0.12}
    ]
};

const pulseDots = cy.add(PULSE.tail.map((d,i)=>({
    group:"nodes", data:{ id:`pulse${i}`, size:d.size }, classes:"pulse", position:{x:0, y:0}
}))).ungrabify().unselectify();

const pulse = {
    steps: [],       // [{edge, kind, index, line}]
    owner: null,     // the view (selection/preview) the steps belong to
    path: null,      // sampled polyline, see buildPath()
    start: 0,
    lap: -1,
    frame: null,
    active: -1       // index of the step the comet is on
};

// Sample the steps' curves into one polyline with cumulative distances.
function buildPath(){
    const pts = [], startIdx = [];
    let incomplete = false;
    const add = (x,y)=>{
        const last = pts[pts.length-1];
        if(!last || Math.hypot(x-last.x, y-last.y) >= 0.01) pts.push({x,y});
    };
    for(const {edge} of pulse.steps){
        startIdx.push(pts.length);
        if(edge.removed()) continue;
        const a = edgeCurves(edge);
        if(!a){ incomplete = true; continue; }   // not drawn yet: retry next frame
        for(let i=0; i+5<a.length; i+=4){
            const [x0,y0, qx,qy, x1,y1] = a.slice(i, i+6);
            for(let k=0; k<=24; k++){
                const t = k/24, u = 1-t;
                add(u*u*x0 + 2*u*t*qx + t*t*x1, u*u*y0 + 2*u*t*qy + t*t*y1);
            }
        }
    }
    const cum = [0];
    for(let i=1; i<pts.length; i++){
        cum.push(cum[i-1] + Math.hypot(pts[i].x-pts[i-1].x, pts[i].y-pts[i-1].y));
    }
    const starts = startIdx.map(i=>cum[Math.min(i, cum.length-1)] || 0);
    return { pts, cum, starts, total: cum[cum.length-1] || 0, incomplete };
}

function pointAt(path, d){
    const {pts, cum} = path;
    let lo = 0, hi = cum.length-1;
    while(hi - lo > 1){
        const mid = (lo+hi) >> 1;
        if(cum[mid] <= d) lo = mid; else hi = mid;
    }
    const t = (d - cum[lo]) / (cum[hi] - cum[lo] || 1);
    return { x: pts[lo].x + (pts[hi].x-pts[lo].x)*t, y: pts[lo].y + (pts[hi].y-pts[lo].y)*t };
}

function labelBoxes(){
    const boxes = [];
    cy.edges().forEach(edge=>{
        for(const which of ["main","source"]){
            const b = labelBox(edge, which);
            if(b) boxes.push(b);
        }
    });
    return boxes;
}

function startPulse(steps, owner){
    Object.assign(pulse, { steps, owner, path:null, start:performance.now(), lap:-1 });
    setActiveStep(-1, true);
    if(!steps.length || REDUCED_MOTION.matches){
        pulseDots.style("opacity", 0);
        return;
    }
    if(pulse.frame === null) pulse.frame = requestAnimationFrame(pulseTick);
}

function pulseTick(now){
    pulse.frame = null;
    if(!pulse.steps.length || REDUCED_MOTION.matches){
        pulseDots.style("opacity", 0);
        setActiveStep(-1);
        return;
    }
    if(!pulse.path || pulse.path.incomplete) pulse.path = buildPath();
    const {total} = pulse.path;
    if(total > 0){
        const travel = total / PULSE.speed * 1000;
        const lapLength = travel + PULSE.pause;
        const elapsed = now - pulse.start;
        const lap = Math.floor(elapsed / lapLength);
        if(lap !== pulse.lap){
            pulse.lap = lap;
            pulse.path = buildPath();     // pick up any relayout each lap
        }
        const head = (elapsed % lapLength) / travel * total;
        let step = -1;
        if(head <= total) pulse.path.starts.forEach((d,j)=>{ if(d <= head) step = j; });
        setActiveStep(step);
        updateStepHighlight();            // once per frame: follows the comet and zoom/pan

        const boxes = labelBoxes();
        cy.batch(()=>pulseDots.forEach((dot,i)=>{
            const d = head - i*PULSE.spacing;
            if(d < 0 || d > total){ dot.style("opacity", 0); return; }
            const pos = pointAt(pulse.path, d);
            dot.position(pos);
            // Dots always draw above labels; to pass *under* a label, hide
            // any dot (including its glow) that touches one.
            const r = PULSE.tail[i].size/2 + 4;
            const covered = boxes.some(b=>
                pos.x + r > b.x1 && pos.x - r < b.x2 && pos.y + r > b.y1 && pos.y - r < b.y2);
            dot.style("opacity", covered ? 0 : PULSE.tail[i].alpha);
        }));
    }
    pulse.frame = requestAnimationFrame(pulseTick);
}

REDUCED_MOTION.addEventListener("change", ()=>startPulse(pulse.steps, pulse.owner));

const stepKey = step => `${step.kind}-${step.index}`;

// Light up the step the comet is on: in the caption (if the caption is
// showing this view) and on its line of the graph label.
function setActiveStep(j, force=false){
    if(j === pulse.active && !force) return;
    pulse.active = j;
    dom.caption.querySelectorAll(".current").forEach(el=>el.classList.remove("current"));
    // (the graph strip is positioned by pulseTick each frame; just hide it here)
    if(j < 0) dom.stepHighlight.style.display = "none";
    const step = pulse.steps[j];
    if(!step || pulse.owner !== (state.preview || state.selection)) return;
    const chip = dom.caption.querySelector(`[data-step="${stepKey(step)}"]`);
    if(chip){
        chip.classList.add("current");
        // keep the current chip centred in a caption that overflows
        dom.caption.scrollLeft = chip.offsetLeft - (dom.caption.clientWidth - chip.offsetWidth) / 2;
    }
}

// Cytoscape can't style one line of a label, so an HTML strip is laid over
// the line belonging to the current step, in the label's exact font.
function updateStepHighlight(){
    const step = pulse.steps[pulse.active];
    const edge = step && !step.edge.removed() ? step.edge : null;
    const box = edge && labelBox(edge, step.kind === "transition" ? "source" : "main");
    if(!box){
        dom.stepHighlight.style.display = "none";
        return;
    }
    const lines = edge.data("edgeLabel").split("\n");
    const k = step.line ? Math.max(0, lines.findIndex(l=>l.startsWith(step.line))) : 0;
    const fs = parseFloat(edge.style("font-size")) || labelFontSize();
    const lh = fs * LINE_HEIGHT;
    const zoom = cy.zoom(), pan = cy.pan();
    const textTop = box.y1 + (box.h - lines.length*lh) / 2;
    const x = box.x1, w = box.w, text = lines[k];
    Object.assign(dom.stepHighlight.style, {
        display:"block",
        left:   `${x * zoom + pan.x}px`,
        top:    `${(textTop + k*lh) * zoom + pan.y}px`,
        width:  `${w * zoom}px`,
        height: `${lh * zoom}px`,
        fontSize:   `${fs * zoom}px`,
        lineHeight: `${lh * zoom}px`,
        fontFamily: edge.style("font-family"),
        fontStyle:  edge.style("font-style"),
        fontWeight: edge.style("font-weight")
    });
    dom.stepHighlight.textContent = text;
}

// =====================================================================
// Caption & menu
// =====================================================================

const el = (tag, props={}, ...children)=>{
    const node = Object.assign(document.createElement(tag), props);
    node.append(...children);
    return node;
};
const arrow = (text=" → ") => el("span", {className:"arrow", textContent:text});

// "Shoulder Block → [swap to R] → Block & Turn" as chips; data-step lets
// the pulse light up the current one.
function sequenceNodes(combo){
    const parts = [];
    for(const item of planMoves(combo.moves, combo)){
        if(parts.length) parts.push(arrow());
        if(item.kind === "move"){
            const chip = el("span", {className:"step", textContent:item.name});
            chip.dataset.move = item.name;
            // an alternative ending is a small tag on the move itself
            if(item.variant) chip.append(el("span", {className:"variant", textContent:item.variant}));
            chip.dataset.step = `move-${item.index}`;
            parts.push(chip);
        }else{
            const tag = el("span", {className:"note", textContent:item.note});
            tag.dataset.step = `transition-${item.index}`;
            parts.push(tag);
        }
    }
    if(combo.loops) parts.push(el("span", {className:"loop-mark", textContent:" ↻", title:"Loops back to the start"}));
    return parts;
}

// The caption shows the hovered combination while previewing, otherwise
// the selection.
function renderCaption(){
    const sel = state.preview || state.selection;
    dom.caption.replaceChildren();
    dom.caption.scrollLeft = 0;
    dom.comboTitle.classList.toggle("placeholder", sel?.kind !== "combo");
    if(sel?.kind === "combo"){
        const c = sel.combo, name = stats[comboKey(c)]?.name;
        const label = name ?? c.id ?? c.caption;
        if(label) dom.caption.append(el("span", {className:"combo-id", textContent:`${label}`}));
        dom.caption.append(...sequenceNodes(c));
        // narrow phones: the name on the button row, the moves below
        dom.comboTitle.textContent = name ?? (c.id ? `Combo ${c.id}` : c.caption ?? "Custom");
    }else{
        const where = SIDEBAR.matches ? "on the left" : "from ☰";
        dom.caption.append(el("span", {className:"placeholder", textContent:`Choose a combination ${where}`}));
        dom.comboTitle.textContent = "Choose from ☰";
    }
}

// ---------------------------------------------------------------------
// The query string holds the combination being shown, e.g.
//   ?moves=accordion,shoulder-block,block-and-turn&combo=4
// "moves" is what's shown (any sequence of moves); "loop" marks one that
// repeats (its last move leads back into the first). "combo" is optional:
// the class combination number, added only when the moves are one. A link
// with just "moves" works the same; "combo" alone opens that combination.
// ---------------------------------------------------------------------

const slug = name => name.toLowerCase().replace(/&/g, "and").replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");
const MOVE_BY_SLUG = new Map(MOVES.map(({name})=>[slug(name), name]));

// The class combination with exactly these moves, if there is one.
// The named combination (class or super) with exactly these moves, if any.
const MENU_COMBOS = [SUPER_COMBO, ...COMBINATIONS];
const classCombo = moves => MENU_COMBOS.find(c=>sameMoves(c.moves, moves));

function comboUrl(combo){
    const params = [];
    if(combo) params.push(`moves=${combo.moves.map(slug).join(",")}`);
    if(combo?.loops) params.push("loop");
    if(combo?.id) params.push(`combo=${combo.id}`);     // optional, last
    return params.length ? `?${params.join("&")}` : location.pathname.split("/").pop();
}

function comboFromUrl(){
    const params = new URLSearchParams(location.search);
    const movesParam = params.get("moves");
    if(!movesParam){
        const id = Number(params.get("combo"));
        return COMBINATIONS.find(c=>c.id === id) ?? null;
    }
    const moves = [];
    for(const s of movesParam.split(",")){
        const name = MOVE_BY_SLUG.get(s.trim());
        if(name) moves.push(name);
        else if(s.trim()) console.warn(`Link: unknown move "${s}"`);
    }
    if(!moves.length) return null;
    if(params.has("loop")) return { id:null, moves, loops:true };
    return classCombo(moves) ?? { id:null, moves };
}

function writeUrl(combo){
    const url = comboUrl(combo);
    if(location.search === (url.startsWith("?") ? url : "")) return;
    try{ history.pushState(null, "", url); }
    catch{ /* some browsers refuse history changes on file:// pages */ }
}

const comboLinks = new Map();   // menu link -> its combination (a combination can be listed twice)

function select(selection, {updateUrl=true}={}){
    state.selection = selection;
    const combo = selection?.kind === "combo" ? selection.combo : null;
    markActiveLinks();
    if(updateUrl) writeUrl(combo);
    updateFavButton();
    updateShuffleControls();
    renderBuilder();            // "Use current" follows the selection
    renderCaption();
    render();
}

function markActiveLinks(){
    const combo = state.selection?.kind === "combo" ? state.selection.combo : null;
    comboLinks.forEach((c,link)=>link.classList.toggle("active", !!combo && sameMoves(c.moves, combo.moves)));
}

const selectCombo = (combo, options) => select(combo ? {kind:"combo", combo} : null, options);

function stepCombo(delta){
    const sel = state.selection?.kind === "combo" ? state.selection.combo : null;
    const current = sel ? COMBINATIONS.findIndex(c=>sameMoves(c.moves, sel.moves)) : -1;
    const n = COMBINATIONS.length;
    const next = current < 0 ? (delta > 0 ? 0 : n-1) : (current + delta + n) % n;
    selectCombo(COMBINATIONS[next]);
}

function openMenu(){
    document.body.classList.add("menu-open");
    dom.menuBtn.setAttribute("aria-expanded", "true");
    dom.container.inert = true;              // keep focus inside the menu
    const target = dom.classSection.open
        ? dom.menu.querySelector(".combo.active") || dom.menu.querySelector(".combo")
        : dom.classSection.querySelector("summary");
    target?.focus({preventScroll:true});
    target?.scrollIntoView({block:"nearest"});
}

function closeMenu(){
    if(!document.body.classList.contains("menu-open")) return;
    document.body.classList.remove("menu-open");
    dom.menuBtn.setAttribute("aria-expanded", "false");
    dom.container.inert = false;
    dom.menuBtn.focus({preventScroll:true});
    if(state.preview) setPreview(null);
}

function setPreview(preview){
    state.preview = preview;
    renderCaption();
    render();
}

// ---------------------------------------------------------------------
// Favourites (with optional custom names) and "times practiced", saved on
// this device. Keyed by the
// moves (not the number), so they survive the class list being renumbered.
// ---------------------------------------------------------------------

const STATS_KEY = "mj-moves:combo-stats";
const comboKey = combo => combo.moves.map(slug).join(",");
const comboName = combo => stats[comboKey(combo)]?.name ?? combo.title ??
    (combo.id ? `Combination ${combo.id}` : `${combo.moves.length}-move combination`);
const stats = (()=>{
    try{ return JSON.parse(localStorage.getItem(STATS_KEY)) || {}; }
    catch{ return {}; }
})();
// Nov 2026: First Move became intromediate and Travelling Return beginner,
// swapping places in the Super Combo. Carry ticks/stars over from the
// earlier move lists (with First Move, and briefly with neither).
{
    const newKey = comboKey(SUPER_COMBO);
    const withFirstMove = SUPER_COMBO.moves.map(m=>m === "Travelling Return" ? "First Move" : m);
    const withNeither = SUPER_COMBO.moves.filter(m=>m !== "Travelling Return");
    for(const old of [withFirstMove, withNeither]){
        const oldKey = comboKey({moves:old});
        if(stats[oldKey] && !stats[newKey]){
            stats[newKey] = stats[oldKey];
            delete stats[oldKey];
            try{ localStorage.setItem(STATS_KEY, JSON.stringify(stats)); }catch{}
        }
    }
}
const statOf = combo => ({ fav:false, done:0, ...stats[comboKey(combo)] });
// combo key -> every {star, tick} pair showing it (a combination can be in
// the class list and the Favourites list at once)
const statButtons = new Map();
const timesText = n => n === 1 ? "once" : `${n} times`;

function setStat(combo, change){
    const key = comboKey(combo);
    const value = { ...statOf(combo), ...change };
    if(!value.name) delete value.name;
    if(!value.fav && !value.done && !value.name) delete stats[key];
    else stats[key] = value;
    const listChanged = "fav" in change || "name" in change;
    try{ localStorage.setItem(STATS_KEY, JSON.stringify(stats)); }
    catch{ /* storage full or blocked: keep working for this visit */ }
    refreshStats(combo);
    updateFavButton();
    if(listChanged){
        renderFavourites();
        renderCaption();            // the caption shows a favourite's name
    }
}

function refreshStats(combo){
    const key = comboKey(combo);
    const sets = [...(statButtons.get(key) || [])].filter(b=>b.star.isConnected);
    statButtons.set(key, new Set(sets));
    for(const buttons of sets) paintStats(combo, buttons);
}

function paintStats(combo, {star, tick}){
    const {fav, done} = statOf(combo);
    star.textContent = fav ? "★" : "☆";
    star.classList.toggle("on", fav);
    star.setAttribute("aria-pressed", fav);
    star.setAttribute("aria-label", `${comboName(combo)}: ${fav ? "remove from" : "add to"} favourites`);
    tick.querySelector(".count").textContent = done || "";
    tick.classList.toggle("on", done > 0);
    tick.setAttribute("aria-label", `${comboName(combo)}: practiced ${timesText(done)}. Add one`);
    tick.title = "Practiced";
}

// Star or unstar; unstarring can be undone (it may remove a row).
function toggleFavourite(combo){
    const {fav, favAt} = statOf(combo);
    if(fav){
        setStat(combo, {fav:false});
        showToast(`${comboName(combo)} removed from favourites`,
                  ()=>setStat(combo, {fav:true, favAt, ...(combo.loops ? {loops:true} : {})}));
    }else{
        setStat(combo, {fav:true, favAt:Date.now(), ...(combo.loops ? {loops:true} : {})});
    }
}

function statControls(combo, {rename}={}){
    const star = el("button", {type:"button", className:"star"});
    star.addEventListener("click", ()=>toggleFavourite(combo));
    const tick = el("button", {type:"button", className:"tick"},
        el("span", {className:"mark", textContent:"✓"}), el("span", {className:"count"}));
    tick.addEventListener("click", ()=>{
        const before = statOf(combo).done;
        setStat(combo, {done:before + 1});
        showToast(`${comboName(combo)}: practiced ${timesText(before + 1)}`,
                  ()=>setStat(combo, {done:before}));
    });
    const key = comboKey(combo);
    if(!statButtons.has(key)) statButtons.set(key, new Set());
    statButtons.get(key).add({star, tick});
    paintStats(combo, {star, tick});
    const actions = el("div", {className:"combo-actions"}, star, tick);
    if(rename){
        const edit = el("button", {type:"button", className:"rename", textContent:"✎"});
        edit.setAttribute("aria-label", `Rename ${comboName(combo)}`);
        edit.title = "Rename";
        edit.addEventListener("click", ()=>rename(edit));
        actions.append(edit);
    }
    return actions;
}

// Swap a favourites row for a text box to name the combination.
function startRename(combo, row){
    const input = el("input", {type:"text", className:"rename-input", value:stats[comboKey(combo)]?.name ?? "",
                               placeholder:"Name this combination", maxLength:40});
    input.setAttribute("aria-label", "Combination name");
    let done = false;
    const finish = save=>{
        if(done) return;
        done = true;
        if(save) setStat(combo, {name:input.value.trim()});
        else renderFavourites();
    };
    input.addEventListener("keydown", e=>{
        if(e.key === "Enter"){ e.preventDefault(); finish(true); }
        if(e.key === "Escape"){ e.preventDefault(); e.stopPropagation(); finish(false); }
    });
    input.addEventListener("blur", ()=>finish(true));
    row.replaceChildren(input);
    input.focus();
    input.select();
}

// The ☆ in the top bar favourites whatever combination is selected.
function updateFavButton(){
    const combo = state.selection?.kind === "combo" ? state.selection.combo : null;
    dom.favBtn.hidden = dom.shareBtn.hidden = !combo;
    if(!combo) return;
    const {fav} = statOf(combo);
    dom.favBtn.textContent = fav ? "★" : "☆";
    dom.favBtn.classList.toggle("on", fav);
    dom.favBtn.setAttribute("aria-pressed", fav);
    dom.favBtn.setAttribute("aria-label", fav ? "Remove from favourites" : "Add to favourites");
}

// Favourites: custom combinations (random or from a link) first, newest
// first, then the named ones in menu order.
function renderFavourites(){
    for(const [link] of [...comboLinks].filter(([link])=>dom.favList.contains(link))) comboLinks.delete(link);
    const favs = Object.entries(stats).filter(([,v])=>v.fav).map(([key,v])=>{
        const moves = key.split(",").map(s=>MOVE_BY_SLUG.get(s)).filter(Boolean);
        const combo = v.loops ? { id:null, moves, loops:true } : classCombo(moves) ?? { id:null, moves };
        return { combo, favAt: v.favAt || 0 };
    }).filter(f=>f.combo.moves.length);
    const rank = f=>{
        const i = MENU_COMBOS.indexOf(f.combo);
        return i < 0 ? -1 : (f.combo === SUPER_COMBO ? MENU_COMBOS.length : i);   // super after the class list
    };
    favs.sort((a,b)=>rank(a) - rank(b) || b.favAt - a.favAt);
    const rows = favs.map(({combo})=>{
        const label = combo.id ? el("span", {className:"combo-num", textContent:`${combo.id}`})
                    : el("span", {className:"combo-num tag", textContent: combo === SUPER_COMBO ? "Super" : "Custom"});
        const name = stats[comboKey(combo)]?.name;
        const body = el("span", {className:"combo-body"},
            ...(name ? [el("span", {className:"combo-name", textContent:name})] : []),
            el("span", {className:"combo-moves"}, ...sequenceNodes(combo)));
        const link = comboLink(combo, label, body);
        link.setAttribute("aria-label", `${comboName(combo)}: ${combo.moves.join(", ")}`);
        const row = el("div", {className:"combo-row"}, link);
        row.append(statControls(combo, {rename:()=>startRename(combo, row)}));
        return row;
    });
    dom.favCount.hidden = !rows.length;
    dom.favCount.textContent = rows.length;
    dom.favCount.setAttribute("aria-label", `${rows.length} favourite${rows.length === 1 ? "" : "s"}`);
    dom.favList.replaceChildren(...(rows.length ? rows
        : [el("p", {className:"fav-empty", textContent:"No favourites yet. Tap ☆ on a combination to add it."})]));
    markActiveLinks();
}

let toastTimer;
function showToast(message, undo){
    dom.toast.replaceChildren(el("span", {textContent:message}));
    if(undo){
        const btn = el("button", {type:"button", textContent:"Undo"});
        btn.addEventListener("click", ()=>{ undo(); hideToast(); });
        dom.toast.append(btn);
    }
    dom.toast.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(hideToast, 4000);
}

function hideToast(){
    dom.toast.classList.remove("show");
}

// A menu entry for a combination: a real link, so "open in new tab" and
// "copy link" work, that selects it in place when clicked.
function comboLink(combo, ...content){
    const btn = el("a", {className:"combo", href:comboUrl(combo)}, ...content);
    btn.addEventListener("click", e=>{
        if(e.ctrlKey || e.metaKey || e.shiftKey || e.altKey || e.button !== 0) return;
        e.preventDefault();
        state.preview = null;
        selectCombo(combo);
        closeMenu();
    });
    // hover preview for mouse users (visible beside the menu on desktop)
    btn.addEventListener("pointerenter", e=>{
        if(e.pointerType === "mouse") setPreview({kind:"combo", combo});
    });
    btn.addEventListener("pointerleave", e=>{
        if(e.pointerType === "mouse") setPreview(null);
    });
    comboLinks.set(btn, combo);
    return btn;
}

function buildMenu(){
    const superLink = comboLink(SUPER_COMBO,
        el("span", {className:"super-title", textContent:SUPER_COMBO.title}),
        el("span", {className:"super-sub", textContent:`Every beginner move · ${SUPER_COMBO.moves.length} moves`}));
    superLink.classList.add("super");
    superLink.setAttribute("aria-label", `${SUPER_COMBO.title}: every beginner move, ${SUPER_COMBO.moves.length} moves`);
    dom.superSlot.append(el("div", {className:"combo-row super-row"}, superLink, statControls(SUPER_COMBO)));

    for(const combo of COMBINATIONS){
        const btn = comboLink(combo,
            el("span", {className:"combo-num", textContent:`${combo.id}`}),
            el("span", {className:"combo-moves"}, ...sequenceNodes(combo)));
        btn.setAttribute("aria-label", `Combination ${combo.id}: ${combo.moves.join(", ")}`);
        dom.comboList.append(el("div", {className:"combo-row"}, btn, statControls(combo)));
    }
}

// =====================================================================
// Statistics: a full-page overlay of facts about the moves, the class
// combinations and your own practice. Built afresh each time it opens.
// =====================================================================

const POSITION_NAMES = { lr:"L to R", rr:"R to R", rl:"R to L", bh:"Both hands" };
const LEVEL_COLOR = { beginner:"var(--s-blue)", intromediate:"var(--s-orange)" };
const fmt = n => n.toLocaleString("en-NZ");
const listText = items => items.length < 2 ? items.join("")
    : `${items.slice(0,-1).join(", ")} and ${items.at(-1)}`;
// light blue -> dark blue, for counts
const BLUE_STEPS = ["#cde2fb","#9ec5f4","#6da7ec","#3987e5","#256abf","#184f95"];

// Hover/focus readout: the value first, then what it is.
function tip(node, value, label){
    node.dataset.tip = value;
    if(label) node.dataset.tipLabel = label;
    node.tabIndex = 0;
    node.setAttribute("aria-label", label ? `${label}: ${value}` : value);
    return node;
}

function card(title, sub, ...content){
    return el("section", {className:"stats-card"},
        el("h3", {textContent:title}),
        ...(sub ? [el("p", {className:"sub", textContent:sub})] : []),
        ...content);
}

const note = (...parts)=>el("p", {className:"stat-note"}, ...parts);
const bold = text=>el("b", {textContent:text});
const posIcon = (id, size)=>el("img", {src:nodeIcon(id), alt:POSITION_NAMES[id], width:size, height:size});

function legend(items){
    return el("div", {className:"legend"}, ...items.map(([color, text])=>
        el("span", {}, el("i", {style:`background:${color}`}), text)));
}

// Every way of dancing `length` different moves in a row without a hand
// change, counted by trying them all.
function countFlowing(moves, length){
    const startingAt = Map.groupBy(moves, m=>m.from);
    const used = new Set();
    const walk = (move, left)=>{
        if(left === 0) return 1;
        used.add(move);
        let n = 0;
        for(const next of startingAt.get(move.to) || []) if(!used.has(next)) n += walk(next, left-1);
        used.delete(move);
        return n;
    };
    return moves.reduce((n, m)=>n + walk(m, length-1), 0);
}

function headlineCard(){
    const beginner = MOVES.filter(m=>m.level === "beginner");
    const inClass = new Set(COMBINATIONS.flatMap(c=>c.moves));
    const taught = beginner.filter(m=>inClass.has(m.name));
    const missing = beginner.filter(m=>!inClass.has(m.name)).map(m=>m.name);
    const tile = (label, value, detail, extra)=>el("div", {className:"stat-tile"},
        el("div", {className:"label", textContent:label}),
        el("div", {className:"value"}, ...value),
        ...(extra ? [extra] : []),
        el("div", {className:"detail", textContent:detail}));
    const moveSlots = COMBINATIONS.reduce((n,c)=>n + c.moves.length, 0);
    const section = card("At a glance", null, el("div", {className:"stat-tiles"},
        tile("Moves", [fmt(MOVES.length)],
             `${beginner.length} beginner · ${MOVES.length - beginner.length} intromediate`),
        tile("Class combinations", [fmt(COMBINATIONS.length)],
             `${moveSlots} moves in all, plus the ${SUPER_COMBO.moves.length}-move Super Combo`),
        tile("Beginner moves in class combinations", [fmt(taught.length), el("small", {textContent:` of ${beginner.length}`})],
             missing.length ? `Not in any yet: ${listText(missing)}` : "Every one of them",
             el("div", {className:"meter", role:"img", ariaLabel:`${taught.length} of ${beginner.length}`},
                 el("span", {style:`flex:${taught.length}`}),
                 ...(missing.length ? [el("span", {className:"rest", style:`flex:${missing.length}`})] : [])))));
    section.classList.add("wide");
    return section;
}

// "3 moves — 2 of them intromediate — haven't been in a class combination yet."
function unusedText(unused){
    if(!unused.length) return "Every move has been in a class combination.";
    const intro = unused.filter(m=>m.level === "intromediate").length;
    const which = intro === unused.length ? (unused.length > 1 ? ", all intromediate," : ", intromediate,")
        : intro ? ` — ${intro} of them intromediate —` : "";
    return `${plural(unused.length, "move")}${which} ${unused.length > 1 ? "haven't" : "hasn't"} been in a class combination yet.`;
}

function moveUsageCard(){
    const uses = new Map(MOVES.map(m=>[m.name, {count:0, first:0, last:0, combos:[]}]));
    for(const c of COMBINATIONS){
        c.moves.forEach((name, i)=>{
            const u = uses.get(name);
            u.count++;
            u.combos.push(c.id);
            if(i === 0) u.first++;
            if(i === c.moves.length-1) u.last++;
        });
    }
    const max = Math.max(...[...uses.values()].map(u=>u.count));
    const rows = MOVES.toSorted((a,b)=>uses.get(b.name).count - uses.get(a.name).count
                                     || LEVELS.indexOf(a.level) - LEVELS.indexOf(b.level)
                                     || a.name.localeCompare(b.name));
    const grid = el("div", {className:"hbars"});
    for(const m of rows){
        const u = uses.get(m.name);
        const where = u.count ? `In ${listText([...new Set(u.combos)].map(String))}`
            + (u.first ? ` · opens ${timesText(u.first)}` : "")
            + (u.last ? ` · finishes ${timesText(u.last)}` : "")
            : "Not in a class combination yet";
        grid.append(el("span", {className:`name${u.count ? "" : " zero"}`, textContent:m.name}),
            tip(el("div", {className:"hbar-row"},
                ...(u.count ? [el("div", {className:"hbar",
                    style:`width:${u.count/max*85}%;background:${LEVEL_COLOR[m.level]}`})] : []),
                el("span", {className:"val", textContent:u.count})),
                plural(u.count, "combination"), `${m.name} (${m.level}). ${where}`));
    }
    const top = rows.filter(m=>uses.get(m.name).count === max).map(m=>m.name);
    const unused = rows.filter(m=>!uses.get(m.name).count);
    return card("Moves in the class combinations", "How many of the class combinations each move is in",
        legend([[LEVEL_COLOR.beginner, "Beginner"], [LEVEL_COLOR.intromediate, "Intromediate"]]),
        grid,
        note(bold(listText(top)), ` ${top.length > 1 ? "are" : "is"} the most used, in ${plural(max, "combination")}. `,
             unusedText(unused)));
}

function positionsCard(){
    const counts = {};
    for(const m of MOVES) (counts[m.from + m.to] ??= []).push(m.name);
    const max = Math.max(...Object.values(counts).map(c=>c.length));
    const grid = el("div", {className:"matrix"},
        el("span", {className:"axis", innerHTML:"from ↓<br>to →"}),
        ...STATES.map(id=>el("div", {className:"head"}, posIcon(id, 36), el("span", {textContent:POSITION_NAMES[id]}))));
    for(const from of STATES){
        grid.append(el("div", {className:"head row"}, el("span", {textContent:POSITION_NAMES[from]}), posIcon(from, 36)));
        for(const to of STATES){
            const names = counts[from + to] || [];
            const cell = el("div", {className:"cell", textContent:names.length || "·"});
            if(names.length){
                const step = Math.min(BLUE_STEPS.length-1, Math.round(names.length/max*(BLUE_STEPS.length-1)));
                cell.style.background = BLUE_STEPS[step];
                cell.style.color = step >= 3 ? "white" : "var(--ink)";
            }
            grid.append(tip(cell, plural(names.length, "move"),
                `${POSITION_NAMES[from]} → ${POSITION_NAMES[to]}${names.length ? ": " + names.join(", ") : ""}`));
        }
    }
    const starts = id=>MOVES.filter(m=>m.from === id).length;
    const ends = id=>MOVES.filter(m=>m.to === id).length;
    const hub = STATES.toSorted((a,b)=>starts(b)+ends(b) - starts(a)-ends(a))[0];
    const same = MOVES.filter(m=>m.from === m.to).length;
    const unreachable = STATES.filter(id=>!ends(id) && !MOVE_VARIATIONS.some(v=>v.end === id));
    return card("Where moves take your hands", "Each move counted by the hand position it starts in (rows) and finishes in (columns)",
        grid,
        note(bold(POSITION_NAMES[hub]), ` is the home position: ${starts(hub)} moves start there and ${ends(hub)} finish there. `,
             `${plural(same, "move")} finish where ${same === 1 ? "it" : "they"} started (the diagonal). `,
             ...(unreachable.length ? [`No move finishes in ${listText(unreachable.map(id=>POSITION_NAMES[id]))}, `
                + "so you only get there with a hand change."] : [])));
}

function flowCard(){
    const kinds = { link:0, ending:0, change:0 };
    const changes = new Map();
    const shapes = el("div", {className:"shapes"});
    for(const c of COMBINATIONS){
        c.moves.slice(1).forEach((b, i)=>{
            const br = bridge(c.moves[i], b);
            kinds[br.kind]++;
            if(br.kind === "change"){
                const list = changes.get(br.note) || [];
                changes.set(br.note, [...list, c.id]);
            }
        });
        // the hand positions the combination passes through
        const shape = el("div", {className:"shape"});
        const plan = planMoves(c.moves, c);
        shape.append(posIcon(plan[0].from, 30));
        for(const step of plan){
            const isMove = step.kind === "move";
            const kind = isMove ? (step.variant ? "ending" : "") : "change";
            shape.append(tip(el("span", {className:`hop ${kind}`}),
                    isMove ? step.name : step.note,
                    isMove ? (step.variant ? `move, ${step.variant}` : "move") : "hand change"),
                posIcon(step.to, 30));
        }
        shapes.append(el("span", {className:"num", textContent:c.id}), shape);
    }
    const total = kinds.link + kinds.ending + kinds.change;
    const parts = [
        ["link", "Flows straight on", "var(--s-blue)"],
        ["ending", "Alternative ending", "var(--s-aqua)"],
        ["change", "Hand change", "var(--s-orange)"]
    ].filter(([k])=>kinds[k]);
    const bar = el("div", {className:"segbar", role:"img",
        ariaLabel:parts.map(([k, label])=>`${label}: ${kinds[k]}`).join(", ")},
        ...parts.map(([k, label, color])=>{
            const seg = el("span", {style:`flex:${kinds[k]};background:${color}`});
            if(kinds[k]/total > 0.12) seg.textContent = `${Math.round(kinds[k]/total*100)}%`;
            return tip(seg, `${kinds[k]} of ${total}`, label);
        }));
    const smooth = COMBINATIONS.filter(c=>c.moves.slice(1).every((b,i)=>bridge(c.moves[i], b).kind !== "change"));
    return card("How the class combinations flow", `The ${total} places where one move leads into the next`,
        legend(parts.map(([k, label, color])=>[color, `${label} (${kinds[k]})`])),
        bar,
        note(`Hand changes used: `),
        el("div", {className:"chips"}, ...[...changes].map(([text, ids])=>
            tip(el("span", {className:"chip", textContent:ids.length > 1 ? `${text} ×${ids.length}` : text}),
                text, `In combination${ids.length > 1 ? "s" : ""} ${listText(ids.map(String))}`))),
        note(bold(`${smooth.length} of ${COMBINATIONS.length}`), " combinations flow from start to finish without a hand change. ",
             "Below: the hand positions each combination passes through. A dashed line is a hand change."),
        shapes);
}

function practiceCard(){
    const entries = Object.entries(stats).map(([key, value])=>{
        const moves = key.split(",").map(s=>MOVE_BY_SLUG.get(s)).filter(Boolean);
        return { moves, ...value };
    }).filter(e=>e.moves.length);
    const practiced = entries.filter(e=>e.done > 0);
    const totalDone = practiced.reduce((n,e)=>n + e.done, 0);
    const favs = entries.filter(e=>e.fav).length;
    const section = card("Your practice", "From the ✓ and ☆ on this device");
    if(!totalDone && !favs){
        section.append(el("p", {className:"empty-note",
            textContent:"Nothing yet. Tap ✓ beside a combination each time you practise it, and ☆ to keep it in Favourites; your progress will show up here."}));
        return section;
    }
    const tile = (label, value)=>el("div", {className:"stat-tile"},
        el("div", {className:"label", textContent:label}), el("div", {className:"value", textContent:fmt(value)}));
    section.append(el("div", {className:"stat-tiles"},
        tile("Times practiced", totalDone),
        tile("Combinations practiced", practiced.length),
        tile("Favourites", favs)));

    // practice per class combination (and the Super Combo)
    const menuCombos = [...COMBINATIONS, SUPER_COMBO];
    const doneOf = c=>statOf(c).done;
    const max = Math.max(1, ...menuCombos.map(doneOf));
    const cols = el("div", {className:"cols"});
    const labels = el("div", {className:"col-labels"});
    for(const c of menuCombos){
        const n = doneOf(c);
        cols.append(tip(el("div", {className:"col"},
                el("span", {className:"v", textContent:n || ""}),
                el("div", {className:"colbar", style:`height:${n/max*100}%`})),
            n ? `practiced ${timesText(n)}` : "not practiced yet", comboName(c)));
        labels.append(el("span", {textContent:c.id ?? SUPER_COMBO.caption}));
    }
    section.append(el("h3", {textContent:"Class combinations", style:"margin-top:20px;font-size:15px"}),
        el("p", {className:"sub", textContent:"Times practiced"}), cols, labels);

    // moves danced most, across everything practiced
    const moveDone = new Map();
    for(const e of practiced) for(const m of e.moves) moveDone.set(m, (moveDone.get(m) || 0) + e.done);
    const top = [...moveDone].sort((a,b)=>b[1] - a[1] || a[0].localeCompare(b[0])).slice(0, 8);
    if(top.length){
        const topMax = top[0][1];
        const grid = el("div", {className:"hbars"});
        for(const [name, n] of top){
            grid.append(el("span", {className:"name", textContent:name}),
                tip(el("div", {className:"hbar-row"},
                    el("div", {className:"hbar", style:`width:${n/topMax*85}%;background:var(--s-blue)`}),
                    el("span", {className:"val", textContent:n})), `danced ${timesText(n)}`, name));
        }
        const never = MOVES.filter(m=>!moveDone.has(m.name)).map(m=>m.name);
        section.append(el("h3", {textContent:"Moves you've danced most", style:"margin-top:20px;font-size:15px"}),
            el("p", {className:"sub", textContent:"Counting every practiced combination they're in"}), grid,
            ...(never.length ? [note(`Not practiced yet: ${listText(never)}.`)] : []));
    }
    return section;
}

// ---------------------------------------------------------------------
// Random Combo: a random first move, then moves that each start where the
// previous one finished (an alternative ending, e.g. Basket keeping both
// hands, counts). No repeats and no hand changes. With "loops", the last
// move also leads back into the first.
// ---------------------------------------------------------------------

const MIN_RANDOM = 2, MAX_RANDOM = 5;

// Can move b follow move a without a hand change?
const canFollow = (a, b) => bridgeCost(a, b) === 0;

const shuffled = items => items.map(v=>[Math.random(), v]).sort((x,y)=>x[0]-y[0]).map(([,v])=>v);

function randomMoves(length, loops){
    const pool = MOVES
        .filter(m=>dom.showIntro.checked || m.level !== "intromediate")
        .map(m=>m.name);
    // depth-first in random order, so every choice is random but we never
    // pick a move that leaves no way to finish
    const extend = seq=>{
        const last = seq[seq.length-1];
        if(seq.length === length) return !loops || canFollow(last, seq[0]) ? seq : null;
        for(const m of shuffled(pool)){
            if(seq.includes(m) || !canFollow(last, m)) continue;
            const done = extend([...seq, m]);
            if(done) return done;
        }
        return null;
    };
    for(const first of shuffled(pool)){
        const done = extend([first]);
        if(done) return done;
    }
    return null;
}

    const LENGTH_KEY = "mj-moves:random-length", LOOPS_KEY = "mj-moves:random-loops";
