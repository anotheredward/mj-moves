<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dance State Transition Graph</title>

<script src="https://unpkg.com/cytoscape/dist/cytoscape.min.js"></script>

<style>
html, body {
    margin:0;
    height:100%;
    font-family:sans-serif;
}

#container{
    display:flex;
    height:100vh;
    height:100dvh;
}

#cy{
    flex:1;
    min-width:0;
    min-height:0;
    background:#fafafa;
}

#sidebar{
    width:320px;
    border-left:1px solid #ccc;
    overflow:auto;
    padding:15px;
    box-sizing:border-box;
}

.combo{
    padding:8px;
    margin-bottom:8px;
    border-radius:6px;
    cursor:pointer;
    border:2px solid transparent;
    -webkit-tap-highlight-color:transparent;
    user-select:none;
}

.combo:hover{
    background:#eef5ff;
}

.combo.active{
    background:#fff3e0;
    border-color:#ff9900;
}

.combo-title{
    font-weight:bold;
}

.combo-short{
    display:none;
}

.combo-moves{
    font-size:14px;
    color:#555;
}

#controls{
    display:flex;
    align-items:center;
    gap:8px;
    margin:4px 0 12px;
}

#controls button{
    min-width:44px;
    min-height:44px;
    font-size:20px;
    border:1px solid #ccc;
    border-radius:8px;
    background:white;
    cursor:pointer;
}

#caption{
    flex:1;
    font-size:14px;
    color:#333;
    text-align:center;
}

#caption .placeholder{
    color:#888;
}

.hint{
    font-size:13px;
    color:#666;
}

/* ---------- Mobile / narrow screens ---------- */
@media (max-width:700px){

    #container{
        flex-direction:column;
    }

    #sidebar{
        width:auto;
        border-left:none;
        border-top:1px solid #ccc;
        padding:8px 10px calc(8px + env(safe-area-inset-bottom));
        overflow:visible;
        flex:0 0 auto;
    }

    #sidebar h2{
        display:none;
    }

    /* Combos become a horizontally swipeable row of chips */
    #comboList{
        display:flex;
        gap:8px;
        overflow-x:auto;
        scroll-snap-type:x proximity;
        padding-bottom:4px;
        -webkit-overflow-scrolling:touch;
    }

    .combo{
        flex:0 0 auto;
        margin:0;
        min-width:44px;
        min-height:44px;
        box-sizing:border-box;
        display:flex;
        align-items:center;
        justify-content:center;
        padding:0 12px;
        border:2px solid #ccc;
        border-radius:22px;
        scroll-snap-align:start;
    }

    .combo:hover{
        background:none;
    }

    .combo.active{
        background:#fff3e0;
        border-color:#ff9900;
    }

    .combo-title,
    .combo-moves{
        display:none;
    }

    .combo-short{
        display:block;
        font-weight:bold;
        font-size:16px;
    }

    #controls{
        margin:8px 0 0;
    }

    #caption{
        font-size:15px;
    }

    .hint{
        display:none;
    }
}
</style>
</head>

<body>

<div id="container">

<div id="cy"></div>

<div id="sidebar">
<h2>Common Combinations</h2>

<div id="controls">
<button id="prevBtn" aria-label="Previous combination">‹</button>
<div id="caption"></div>
<button id="nextBtn" aria-label="Next combination">›</button>
</div>

<div id="comboList"></div>

<p class="hint">
Tap or click a combination to highlight its transitions (hover to preview).
Numbered moves show the execution order. Tap the empty graph to clear.
</p>

</div>

</div>

<script>

const moves = [
["Accordion","rr","rr"],
["Loop Throughs","bh","bh"],
["Back Pass","rr","lr"],
["Manhattan","lr","lr"],
["Basket","bh","lr"],
["New Yorker","lr","lr"],
["Block & Turn","rr","rr"],
["Outside Turn","lr","lr"],
["Break Through","lr","rr"],
["Short First Move","lr","lr"],
["Catapult","rr","lr"],
["Shoulder Block","rr","lr"],
["Figure Of 8","lr","rr"],
["Squeezebox","bh","lr"],
["Hatchback","lr","lr"],
["Step Across","lr","lr"],
["Hook Turn","rr","lr"],
["Travelling Return","lr","lr"],
["Key Turn","rr","lr"],
["Wurlitzer","lr","lr"],
["Left Side Change","lr","rr"],
["Yoyo","rr","lr"],
["Shoulder Wrap","rr","lr"],
["Comb","rr","rr"],
["Slide Break","bh","rr"],
["First Move","lr","lr"],
["Wrap & Throw","rl","lr"],
["Short Manhattan","lr","lr"]
];
const combinations = [
[1,["Basket","Manhattan","Step Across"]],
[2,["Short First Move","Break Through","Hook Turn"]],
[3,["Yoyo","Back Pass","Figure Of 8"]],
[4,["Accordion","Shoulder Block","Block & Turn"]],
[5,["Manhattan","Left Side Change","Key Turn"]],
[6,["Step Across","Wurlitzer","Short First Move"]],
[7,["Basket","Loop Throughs","Hatchback"]],
[8,["Squeezebox","Figure Of 8","Catapult"]],
[10,["Shoulder Block","Accordion","Yoyo"]],
[11,["Short First Move","Loop Throughs","New Yorker"]],
[12,["Catapult","Break Through","Block & Turn"]],
[13,["Squeezebox","Left Side Change","Back Pass"]]
];

const elements=[];

const edgeCounts = {};
moves.forEach(([move,from,to])=>{
    const key = `${from}|${to}`;
    edgeCounts[key] = (edgeCounts[key]||0) + 1;
});

const edgeIndex = {};

["rr","lr","rl","bh"].forEach(id=>{
    elements.push({
        data:{
            id:id,
            label:id
        }
    });
});

moves.forEach(([move,from,to],i)=>{
    const key = `${from}|${to}`;
    const idx = edgeIndex[key] = (edgeIndex[key]||0) + 1;
    const count = edgeCounts[key];
    const selfLoop = from === to;
    const offset = selfLoop ? 0 : (count === 1 ? 0 : (idx - (count + 1) / 2) * 70);
    const direction = selfLoop ? 280 + ((idx - 1) * 30) : 0;

    elements.push({
        data:{
            id:"e"+i,
            move:move,
            source:from,
            target:to,
            edgeLabel:move,
            curveDistance: offset,
            curveWeight: 0.5,
            loopDirection: direction,
            loopSweep: selfLoop ? 80 : 0
        }
    });

});

const compactQuery = window.matchMedia("(max-width:700px)");
const isCompact = () => compactQuery.matches;
const fitPadding = () => isCompact() ? 30 : 60;

const cy = cytoscape({

container:document.getElementById("cy"),

elements,

style:[

{
selector:"node",
style:{
'label':'data(label)',
'text-valign':'center',
'text-halign':'center',
'background-color':'#2d7ff9',
'color':'white',
'font-size':18,
'font-weight':'bold',
'width':60,
'height':60
}
},

{
selector:"edge",
style:{
'label':'data(edgeLabel)',
'curve-style':'bezier',
'text-background-shape':'roundrectangle',
'text-wrap':'wrap',
'text-max-width':'90px',
'text-justification':'center',
'control-point-step-size': 70,
'control-point-weight': 0.5,
'loop-direction':'data(loopDirection)',
'loop-sweep':'data(loopSweep)',
'loop-sizes':'96px 96px',
'source-endpoint':'outside-to-node',
'target-endpoint':'outside-to-node',
'target-arrow-shape':'triangle',
'line-color':'#888',
'target-arrow-color':'#888',
'font-size':11,
'text-rotation':'none',
'text-background-opacity':1,
'text-background-color':'white',
'text-background-padding':2,
'text-margin-y':'-10',
'width':2
}
},

{
selector:"edge.compact",
style:{
'font-size':13
}
},

{
selector:"edge.hide-label",
style:{
'label':''
}
},

{
selector:".dim",
style:{
'opacity':0.1
}
},

{
selector:".highlight",
style:{
'line-color':'#ff9900',
'target-arrow-color':'#ff9900',
'width':6,
'color':'#ff9900',
'z-index':999
}
}

],

layout:{
name:"circle",
padding:60
}

});

// On small screens, only show labels for highlighted moves to avoid clutter.
function updateLabels(){
    const compact = isCompact();
    cy.edges().forEach(edge=>{
        edge.toggleClass("compact", compact);
        edge.toggleClass("hide-label", compact && !edge.hasClass("highlight"));
    });
}

function clearHighlight(){

cy.elements().removeClass("dim");
cy.elements().removeClass("highlight");

cy.edges().forEach(edge=>edge.data('edgeLabel', edge.data('move')));

updateLabels();

}

function highlight(moves){

clearHighlight();

cy.elements().addClass("dim");

cy.nodes().removeClass("dim");

moves.forEach(name=>{

const edge=cy.edges().filter(e=>e.data("move")==name);

edge.removeClass("dim");
edge.addClass("highlight");

edge.connectedNodes().removeClass("dim");

edge.data('edgeLabel', `${moves.indexOf(name)+1}. ${edge.data('move')}`);

});

updateLabels();

}

// ---------- Selection state ----------

const list=document.getElementById("comboList");
const caption=document.getElementById("caption");
const comboDivs=[];
let selected=-1;   // index into combinations, -1 = none

function showSelected(){
    if(selected<0){
        clearHighlight();
    }else{
        highlight(combinations[selected][1]);
    }
}

function select(index){

selected=index;

comboDivs.forEach((div,i)=>div.classList.toggle("active", i===selected));

if(selected<0){
    caption.innerHTML='<span class="placeholder">Select a combination</span>';
}else{
    const [id,moves]=combinations[selected];
    caption.textContent=`${id}: ${moves.join(" → ")}`;
    comboDivs[selected].scrollIntoView({block:"nearest",inline:"nearest",behavior:"smooth"});
}

showSelected();

}

combinations.forEach(([id,moves],i)=>{

const div=document.createElement("div");

div.className="combo";
div.setAttribute("role","button");
div.setAttribute("tabindex","0");

div.innerHTML=`
<div class="combo-title">Combination ${id}</div>
<div class="combo-moves">${moves.join(" → ")}</div>
<div class="combo-short">${id}</div>
`;

// Tap/click toggles the selection.
div.addEventListener("click",()=>select(selected===i ? -1 : i));
div.addEventListener("keydown",e=>{
    if(e.key==="Enter"||e.key===" "){ e.preventDefault(); div.click(); }
});

// Hover preview for mouse users only; restores the selection on leave.
div.addEventListener("pointerenter",e=>{
    if(e.pointerType==="mouse") highlight(moves);
});
div.addEventListener("pointerleave",e=>{
    if(e.pointerType==="mouse") showSelected();
});

list.appendChild(div);
comboDivs.push(div);

});

document.getElementById("prevBtn").addEventListener("click",()=>{
    select(selected<=0 ? combinations.length-1 : selected-1);
});
document.getElementById("nextBtn").addEventListener("click",()=>{
    select(selected<0 || selected>=combinations.length-1 ? 0 : selected+1);
});

// Tapping empty graph space clears the selection.
cy.on("tap",e=>{
    if(e.target===cy) select(-1);
});

// ---------- Keep the graph fitted to the screen ----------

let resizeTimer;
function refit(){
    clearTimeout(resizeTimer);
    resizeTimer=setTimeout(()=>{
        cy.resize();
        cy.fit(undefined, fitPadding());
        updateLabels();
    },150);
}

window.addEventListener("resize",refit);
window.addEventListener("orientationchange",refit);
compactQuery.addEventListener("change",refit);

select(-1);
cy.fit(undefined, fitPadding());

</script>

</body>
</html>
