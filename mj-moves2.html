<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dance State Transition Graph (grouped edges)</title>

<script src="https://unpkg.com/cytoscape/dist/cytoscape.min.js"></script>

<style>
html, body {
    margin:0;
    height:100%;
    font-family:sans-serif;
}

#container{
    display:flex;
    height:100vh;
    height:100dvh;
}

#cy{
    flex:1;
    min-width:0;
    min-height:0;
    background:#fafafa;
}

#sidebar{
    width:320px;
    border-left:1px solid #ccc;
    overflow:auto;
    padding:15px;
    box-sizing:border-box;
}

.combo{
    padding:8px;
    margin-bottom:8px;
    border-radius:6px;
    cursor:pointer;
    border:2px solid transparent;
    -webkit-tap-highlight-color:transparent;
    user-select:none;
}

.combo:hover{
    background:#eef5ff;
}

.combo.active{
    background:#fff3e0;
    border-color:#ff9900;
}

.combo-title{
    font-weight:bold;
}

.combo-short{
    display:none;
}

.combo-moves{
    font-size:14px;
    color:#555;
}

#controls{
    display:flex;
    align-items:center;
    gap:8px;
    margin:4px 0 12px;
}

#controls button{
    min-width:44px;
    min-height:44px;
    font-size:20px;
    border:1px solid #ccc;
    border-radius:8px;
    background:white;
    cursor:pointer;
}

#caption{
    flex:1;
    font-size:14px;
    color:#333;
    text-align:center;
}

#caption .placeholder{
    color:#888;
}

.hint{
    font-size:13px;
    color:#666;
}

/* ---------- Mobile / narrow screens ---------- */
@media (max-width:700px){

    #container{
        flex-direction:column;
    }

    #sidebar{
        width:auto;
        border-left:none;
        border-top:1px solid #ccc;
        padding:8px 10px calc(8px + env(safe-area-inset-bottom));
        overflow:visible;
        flex:0 0 auto;
    }

    #sidebar h2{
        display:none;
    }

    /* Combos become a horizontally swipeable row of chips */
    #comboList{
        display:flex;
        gap:8px;
        overflow-x:auto;
        scroll-snap-type:x proximity;
        padding-bottom:4px;
        -webkit-overflow-scrolling:touch;
    }

    .combo{
        flex:0 0 auto;
        margin:0;
        min-width:44px;
        min-height:44px;
        box-sizing:border-box;
        display:flex;
        align-items:center;
        justify-content:center;
        padding:0 12px;
        border:2px solid #ccc;
        border-radius:22px;
        scroll-snap-align:start;
    }

    .combo:hover{
        background:none;
    }

    .combo.active{
        background:#fff3e0;
        border-color:#ff9900;
    }

    .combo-title,
    .combo-moves{
        display:none;
    }

    .combo-short{
        display:block;
        font-weight:bold;
        font-size:16px;
    }

    #controls{
        margin:8px 0 0;
    }

    #caption{
        font-size:15px;
    }

    .hint{
        display:none;
    }
}
</style>
</head>

<body>

<div id="container">

<div id="cy"></div>

<div id="sidebar">
<h2>Common Combinations</h2>

<div id="controls">
<button id="prevBtn" aria-label="Previous combination">‹</button>
<div id="caption"></div>
<button id="nextBtn" aria-label="Next combination">›</button>
</div>

<div id="comboList"></div>

<p class="hint">
Tap or click a combination to highlight its transitions (hover to preview).
Each line is one transition; its moves are listed on it, and numbers show
the execution order. Tap a line to see all its moves, or the empty graph to clear.
</p>

</div>

</div>

<script>

const moves = [
["Accordion","rr","rr"],
["Loop Throughs","bh","bh"],
["Back Pass","rr","lr"],
["Manhattan","lr","lr"],
["Basket","bh","lr"],
["New Yorker","lr","lr"],
["Block & Turn","rr","rr"],
["Outside Turn","lr","lr"],
["Break Through","lr","rr"],
["Short First Move","lr","lr"],
["Catapult","rr","lr"],
["Shoulder Block","rr","lr"],
["Figure Of 8","lr","rr"],
["Squeezebox","bh","lr"],
["Hatchback","lr","lr"],
["Step Across","lr","lr"],
["Hook Turn","rr","lr"],
["Travelling Return","lr","lr"],
["Key Turn","rr","lr"],
["Wurlitzer","lr","lr"],
["Left Side Change","lr","rr"],
["Yoyo","rr","lr"],
["Shoulder Wrap","rr","lr"],
["Comb","rr","rr"],
["Slide Break","bh","rr"],
["First Move","lr","lr"],
["Wrap & Throw","rl","lr"],
["Short Manhattan","lr","lr"]
];
const combinations = [
[1,["Basket","Manhattan","Step Across"]],
[2,["Short First Move","Break Through","Hook Turn"]],
[3,["Yoyo","Back Pass","Figure Of 8"]],
[4,["Accordion","Shoulder Block","Block & Turn"]],
[5,["Manhattan","Left Side Change","Key Turn"]],
[6,["Step Across","Wurlitzer","Short First Move"]],
[7,["Basket","Loop Throughs","Hatchback"]],
[8,["Squeezebox","Figure Of 8","Catapult"]],
[10,["Shoulder Block","Accordion","Yoyo"]],
[11,["Short First Move","Loop Throughs","New Yorker"]],
[12,["Catapult","Break Through","Block & Turn"]],
[13,["Squeezebox","Left Side Change","Back Pass"]]
];

// ---------- Group moves into one edge per (from, to) pair ----------

const groups = new Map();   // "from|to" -> {from, to, moves:[]}
moves.forEach(([move,from,to])=>{
    const key = `${from}|${to}`;
    if(!groups.has(key)) groups.set(key, {from, to, moves:[]});
    groups.get(key).moves.push(move);
});

const elements=[];

["rr","lr","rl","bh"].forEach(id=>{
    elements.push({ data:{ id, label:id } });
});

groups.forEach(({from,to,moves:names},key)=>{
    // If there's also an edge going the other way, bow this one out so the
    // two lines (and their lists) sit on opposite sides instead of overlapping.
    const hasReverse = from!==to && groups.has(`${to}|${from}`);
    elements.push({
        data:{
            id:"e:"+key,
            source:from,
            target:to,
            moves:names,
            count:names.length,
            fullLabel:names.join("\n"),
            edgeLabel:names.join("\n"),
            bow: hasReverse ? 140 : 0,
            loopDirection: 0
        }
    });
});

// ---------- Node placement ----------
// rr and lr carry most of the traffic, so they go far apart on the long
// axis of the screen, with the busy rr<->lr lists between them.
// Each node's self-loop (and its list) points away from the middle.

const LAYOUTS = {
    wide:{
        pos:  { rr:{x:-280,y:0}, lr:{x:280,y:0}, bh:{x:0,y:-280}, rl:{x:0,y:280} },
        loop: { rr:-90, lr:90, bh:0, rl:180 }
    },
    tall:{
        pos:  { rr:{x:0,y:-280}, lr:{x:0,y:280}, bh:{x:-280,y:0}, rl:{x:280,y:0} },
        loop: { rr:0, lr:180, bh:-90, rl:90 }
    }
};

const compactQuery = window.matchMedia("(max-width:700px)");
const isCompact = () => compactQuery.matches;
const fitPadding = () => isCompact() ? 20 : 50;

function currentLayout(){
    const cyEl = document.getElementById("cy");
    return cyEl.clientHeight > cyEl.clientWidth ? LAYOUTS.tall : LAYOUTS.wide;
}

const cy = cytoscape({

container:document.getElementById("cy"),

elements,

style:[

{
selector:"node",
style:{
'label':'data(label)',
'text-valign':'center',
'text-halign':'center',
'background-color':'#2d7ff9',
'color':'white',
'font-size':18,
'font-weight':'bold',
'width':60,
'height':60
}
},

{
selector:"edge",
style:{
'label':'data(edgeLabel)',
'curve-style':'bezier',
'text-wrap':'wrap',
'text-max-width':'160px',
'text-justification':'left',
'line-height':1.3,
'source-endpoint':'outside-to-node',
'target-endpoint':'outside-to-node',
'target-arrow-shape':'triangle',
'line-color':'#888',
'target-arrow-color':'#888',
'font-size':11,
'text-rotation':'none',
'text-background-shape':'roundrectangle',
'text-background-opacity':0.92,
'text-background-color':'white',
'text-background-padding':4,
'text-border-opacity':1,
'text-border-width':1,
'text-border-color':'#ddd',
// thicker line = more moves on that transition
'width':'mapData(count, 1, 10, 2, 5)',
'arrow-scale':1.2
}
},

{
selector:"edge:simple",
style:{
'curve-style':'unbundled-bezier',
'control-point-distances':'data(bow)',
'control-point-weights':0.5
}
},

{
selector:"edge:loop",
style:{
'loop-direction':'data(loopDirection)',
'loop-sweep':'50deg',
'control-point-step-size':110
}
},

{
selector:"edge.compact",
style:{
'font-size':13
}
},

{
selector:"edge.hide-label",
style:{
'label':''
}
},

{
selector:".dim",
style:{
'opacity':0.1
}
},

{
selector:".highlight",
style:{
'line-color':'#ff9900',
'target-arrow-color':'#ff9900',
'width':6,
'color':'#c46a00',
'font-weight':'bold',
'text-border-color':'#ff9900',
'z-index':999
}
}

],

layout:{ name:"preset" }

});

function applyLayout(){
    const layout = currentLayout();
    cy.edges(":loop").forEach(edge=>{
        edge.data("loopDirection", layout.loop[edge.data("source")]);
    });
    cy.nodes().forEach(node=>node.position(layout.pos[node.id()]));
    cy.resize();
    cy.fit(undefined, fitPadding());
}

// ---------- Highlighting ----------

// On small screens, only show labels for highlighted edges to avoid clutter.
function updateLabels(){
    const compact = isCompact();
    cy.edges().forEach(edge=>{
        edge.toggleClass("compact", compact);
        edge.toggleClass("hide-label", compact && !edge.hasClass("highlight"));
    });
}

function clearHighlight(){
    cy.elements().removeClass("dim highlight");
    cy.edges().forEach(edge=>edge.data("edgeLabel", edge.data("fullLabel")));
    updateLabels();
}

function dimAllEdges(){
    clearHighlight();
    cy.edges().addClass("dim");
    cy.nodes().addClass("dim");
}

function lightUp(edge, label){
    edge.removeClass("dim").addClass("highlight");
    edge.connectedNodes().removeClass("dim");
    edge.data("edgeLabel", label);
}

// Highlight a combination: each edge it uses shows only the combo's moves
// on that edge, numbered by execution order.
function highlight(comboMoves){
    dimAllEdges();
    cy.edges().forEach(edge=>{
        const own = edge.data("moves");
        const steps = comboMoves
            .map((name,i)=>({name, step:i+1}))
            .filter(({name})=>own.includes(name));
        if(steps.length){
            lightUp(edge, steps.map(s=>`${s.step}. ${s.name}`).join("\n"));
        }
    });
    cy.nodes().removeClass("dim");
    updateLabels();
}

// Highlight a single edge with its full move list (used when tapping a line).
function highlightEdge(edge){
    dimAllEdges();
    cy.nodes().removeClass("dim");
    lightUp(edge, edge.data("fullLabel"));
    updateLabels();
}

// ---------- Selection state ----------

const list=document.getElementById("comboList");
const caption=document.getElementById("caption");
const comboDivs=[];
let selected=-1;          // index into combinations, -1 = none
let selectedEdge=null;    // edge tapped directly, if any

function showSelected(){
    if(selected>=0)         highlight(combinations[selected][1]);
    else if(selectedEdge)   highlightEdge(selectedEdge);
    else                    clearHighlight();
}

function setCaption(text, placeholder){
    if(placeholder){
        caption.innerHTML="";
        const span=document.createElement("span");
        span.className="placeholder";
        span.textContent=text;
        caption.appendChild(span);
    }else{
        caption.textContent=text;
    }
}

function select(index){
    selected=index;
    selectedEdge=null;

    comboDivs.forEach((div,i)=>div.classList.toggle("active", i===selected));

    if(selected<0){
        setCaption("Select a combination", true);
    }else{
        const [id,moves]=combinations[selected];
        setCaption(`${id}: ${moves.join(" → ")}`);
        comboDivs[selected].scrollIntoView({block:"nearest",inline:"nearest",behavior:"smooth"});
    }

    showSelected();
}

function selectEdge(edge){
    select(-1);
    selectedEdge=edge;
    const n=edge.data("count");
    setCaption(`${edge.data("source")} → ${edge.data("target")}: ${n} move${n===1?"":"s"}`);
    showSelected();
}

combinations.forEach(([id,moves],i)=>{

    const div=document.createElement("div");
    div.className="combo";
    div.setAttribute("role","button");
    div.setAttribute("tabindex","0");

    div.innerHTML=`
<div class="combo-title">Combination ${id}</div>
<div class="combo-moves">${moves.join(" → ")}</div>
<div class="combo-short">${id}</div>
`;

    // Tap/click toggles the selection.
    div.addEventListener("click",()=>select(selected===i ? -1 : i));
    div.addEventListener("keydown",e=>{
        if(e.key==="Enter"||e.key===" "){ e.preventDefault(); div.click(); }
    });

    // Hover preview for mouse users only; restores the selection on leave.
    div.addEventListener("pointerenter",e=>{
        if(e.pointerType==="mouse") highlight(moves);
    });
    div.addEventListener("pointerleave",e=>{
        if(e.pointerType==="mouse") showSelected();
    });

    list.appendChild(div);
    comboDivs.push(div);
});

document.getElementById("prevBtn").addEventListener("click",()=>{
    select(selected<=0 ? combinations.length-1 : selected-1);
});
document.getElementById("nextBtn").addEventListener("click",()=>{
    select(selected<0 || selected>=combinations.length-1 ? 0 : selected+1);
});

// Tap empty space to clear; tap a line to see all of its moves.
cy.on("tap",e=>{
    if(e.target===cy) select(-1);
});
cy.on("tap","edge",e=>{
    if(selectedEdge===e.target) select(-1);
    else selectEdge(e.target);
});

// ---------- Keep the graph fitted to the screen ----------

let resizeTimer;
function refit(){
    clearTimeout(resizeTimer);
    resizeTimer=setTimeout(()=>{
        applyLayout();
        updateLabels();
    },150);
}

window.addEventListener("resize",refit);
window.addEventListener("orientationchange",refit);
compactQuery.addEventListener("change",refit);

applyLayout();
select(-1);

</script>

</body>
</html>
